<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#21a5e3">
  <title>友链卡片编辑器 · 七七的折腾笔记</title>

  <style>
    /* ============ 设计令牌 ============ */
    :root {
      --color-primary: #21a5e3;
      --color-primary-hover: #0E7AE0;
      --color-primary-active: #0B6BC5;
      --color-blue-light: #ABD7FF;

      --color-bg-white: #FFFFFF;
      --color-bg-light: #FAFAFA;
      --color-bg-soft: #F5F5F5;
      --color-border: #EDEDED;
      --color-border-strong: #D4D4D4;

      --color-text-primary: #1F1F1F;
      --color-text-body: #404040;
      --color-text-secondary: #737373;
      --color-text-disabled: #A3A3A3;

      --color-danger: #F21B28;
      --color-success: #169B5B;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      --shadow-card: 0 2px 8px rgba(0, 0, 0, .06);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .1);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

      --topbar-h: 56px;
    }

    /* ============ 基础 ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-light);
      color: var(--color-text-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    input {
      font-family: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* 背景氛围 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 4%, rgba(18, 138, 250, .12), transparent 42%),
        radial-gradient(circle at 92% -4%, rgba(171, 215, 255, .42), transparent 46%),
        radial-gradient(circle at 72% 96%, rgba(190, 192, 236, .22), transparent 46%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(18, 138, 250, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 138, 250, .035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ============ 顶栏 ============ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 300;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: rgba(255, 255, 255, .92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .brand__dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: var(--color-primary);
      transform: rotate(45deg);
      box-shadow: 0 0 0 4px rgba(33, 165, 227, .14);
    }

    .brand__name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--color-text-primary);
      white-space: nowrap;
    }

    .topbar__hint {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-disabled);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar__spacer {
      flex: 1 1 auto;
    }

    .tbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      flex: 0 0 auto;
      border-radius: var(--radius-full);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--color-text-body);
      background: #fff;
      border: 1px solid var(--color-border);
      transition: background .16s ease, color .16s ease,
        border-color .16s ease, transform .12s ease;
    }

    .tbtn:hover {
      color: var(--color-primary);
      border-color: var(--color-blue-light);
      background: rgba(33, 165, 227, .05);
    }

    .tbtn:active {
      transform: scale(.96);
    }

    .tbtn svg {
      flex: 0 0 auto;
    }

    /* ============ 布局 ============ */
    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 430px);
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + 18px) 16px 40px;
      align-items: start;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .panel__head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 13px 16px;
      border-bottom: 1px solid var(--color-border);
      background: linear-gradient(180deg, #FCFDFF 0%, #F8FBFF 100%);
      flex: 0 0 auto;
    }

    .panel__title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--color-text-primary);
    }

    .panel__sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .panel__head-spacer {
      flex: 1 1 auto;
    }

    .panel__body {
      padding: 14px 16px;
      min-height: 0;
    }

    .panel__foot {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-top: 1px solid var(--color-border);
      background: #FCFDFF;
      flex: 0 0 auto;
    }

    /* ============ 按钮 ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 38px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease,
        border-color .18s ease, transform .12s ease, box-shadow .2s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn--primary {
      color: #fff;
      background: var(--color-primary);
      box-shadow: 0 4px 14px rgba(18, 138, 250, .28);
    }

    .btn--primary:hover {
      background: var(--color-primary-hover);
    }

    .btn--ghost {
      color: var(--color-text-body);
      background: #fff;
      border: 1px solid var(--color-border);
    }

    .btn--ghost:hover {
      color: var(--color-primary);
      border-color: var(--color-blue-light);
    }

    /* ============ 表单 ============ */
    .form__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .field--full {
      grid-column: 1 / -1;
    }

    .field>span {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--color-text-secondary);
    }

    .field>span em {
      font-style: normal;
      color: var(--color-danger);
      margin-left: 2px;
    }

    .field>span i {
      font-style: normal;
      font-weight: 600;
      color: var(--color-text-disabled);
      margin-left: 4px;
    }

    .field input[type="text"] {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      font-size: 13.5px;
      color: var(--color-text-primary);
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .field input::placeholder {
      color: var(--color-text-disabled);
    }

    .field input[type="text"]:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .14);
    }

    .field.is-invalid input[type="text"] {
      border-color: rgba(242, 27, 40, .45);
      background: #FFFCFC;
    }

    /* ---------- 配色 ---------- */
    .colors {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .color-field {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 10px 3px 4px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    .color-field:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .14);
    }

    .color-field input[type="color"] {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .color-field input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-field input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .color-field input[type="color"]::-moz-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .color-field input[type="text"] {
      width: 82px;
      height: 24px;
      border: none;
      outline: none;
      padding: 0;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-text-primary);
      text-transform: lowercase;
    }

    .mini {
      height: 34px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-secondary);
      background: var(--color-bg-soft);
      border: 1px solid transparent;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }

    .mini:hover {
      color: var(--color-primary);
      background: rgba(33, 165, 227, .1);
      border-color: rgba(33, 165, 227, .25);
    }

    /* ---------- 预设色板 ---------- */
    .swatches {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 9px;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--color-border), 0 2px 6px rgba(0, 0, 0, .1);
      transition: transform .14s ease, box-shadow .16s ease;
    }

    .swatch:hover {
      transform: scale(1.14);
      box-shadow: 0 0 0 2px var(--color-primary), 0 3px 10px rgba(18, 138, 250, .3);
    }

    .swatch:active {
      transform: scale(.94);
    }

    .swatches__label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--color-text-disabled);
      margin-right: 2px;
    }

    /* ============ 预览舞台 ============ */
    .stage {
      display: grid;
      place-items: center;
      padding: 30px 18px;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--color-border-strong);
      background-color: #F8FBFF;
      background-image:
        linear-gradient(rgba(18, 138, 250, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 138, 250, .05) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* ---------- 友链卡片（与正式页面一致） ---------- */
    .friend {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      width: min(100%, 320px);
      padding: 14px 16px;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: transform .18s cubic-bezier(.22, .61, .36, 1),
        box-shadow .2s ease, border-color .2s ease;
    }

    .friend::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--c1, #21a5e3), var(--c2, #ABD7FF));
      opacity: 0;
      transform: scaleY(.35);
      transition: opacity .2s ease, transform .26s cubic-bezier(.22, .61, .36, 1);
    }

    .friend:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
      border-color: rgba(33, 165, 227, .42);
    }

    .friend:hover::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .friend:active {
      transform: translateY(-1px) scale(.992);
    }

    .friend.is-empty {
      border-style: dashed;
      border-color: var(--color-border-strong);
      box-shadow: none;
    }

    .friend__avatar {
      position: relative;
      flex: 0 0 auto;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .02em;
      background: linear-gradient(145deg, var(--c1, #5FB0FF), var(--c2, #4454F8));
      border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(18, 138, 250, .22);
      user-select: none;
    }

    .friend__avatar img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .friend__main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .friend__name {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend__desc {
      display: block;
      font-size: 12px;
      line-height: 1.6;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 3px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 6px;
      border-radius: var(--radius-sm);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--color-primary);
      background: rgba(18, 138, 250, .09);
      white-space: nowrap;
    }

    .friend__go {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--color-text-disabled);
      transition: color .2s ease, transform .2s ease;
    }

    .friend:hover .friend__go {
      color: var(--color-primary);
      transform: translate(2px, -2px);
    }

    .friend.is-thanks .friend__go {
      display: none;
    }

    .stage__note {
      margin-top: 12px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--color-text-disabled);
    }

    /* ============ JSON 输出 ============ */
    .json-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--color-text-primary);
    }

    .json-head::before {
      content: "";
      flex: 0 0 auto;
      width: 4px;
      height: 13px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--color-primary), var(--color-blue-light));
    }

    .json {
      margin: 0;
      padding: 13px 15px;
      border-radius: var(--radius-lg);
      background: #1E2734;
      color: #C8D6E5;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.72;
      white-space: pre;
      overflow: auto;
      max-height: 260px;
      tab-size: 2;
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      left: 50%;
      top: calc(var(--topbar-h) + 16px);
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: min(86vw, 380px);
      padding: 10px 20px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, .94);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card-hover);
      color: var(--color-text-primary);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.5;
      text-align: center;
      word-break: break-word;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -10px);
      transition: opacity .25s cubic-bezier(.22, .61, .36, 1),
        transform .25s cubic-bezier(.22, .61, .36, 1);
      white-space: pre-line;
    }

    .toast::before {
      content: "";
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(18, 138, 250, .15);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ============ 响应式 ============ */
    @media (min-width: 961px) {
      .panel {
        position: sticky;
        top: calc(var(--topbar-h) + 16px);
        max-height: calc(100vh - var(--topbar-h) - 32px);
      }

      .panel__body {
        overflow-y: auto;
        flex: 1 1 auto;
      }
    }

    @media (max-width: 960px) {
      .app {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 720px) {
      .topbar {
        gap: 7px;
        padding: 0 10px;
      }

      .topbar__hint {
        display: none;
      }

      .tbtn__label {
        display: none;
      }

      .tbtn {
        width: 34px;
        padding: 0;
      }
    }

    @media (max-width: 560px) {
      .form__grid {
        grid-template-columns: minmax(0, 1fr);
      }

      /* 避免 iOS 聚焦缩放 */
      .field input[type="text"] {
        font-size: 16px;
      }

      .panel__body {
        padding: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    /* ---------- 特别鸣谢开关 ---------- */
    .check {
      flex-direction: row;
      align-items: center;
      gap: 9px;
      padding: 9px 11px;
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-md);
      background: var(--color-bg-light);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease;
    }

    .check:hover {
      border-color: var(--color-blue-light);
      background: #fff;
    }

    .check input[type="checkbox"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .check>span {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-body);
    }

    /* 特别鸣谢模式下，链接不再是必填，隐藏星号 */
    .field.is-optional>span em {
      display: none;
    }
  </style>
</head>

<body>

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand__dot"></span>
      <span class="brand__name">友链卡片编辑器</span>
    </div>
    <span class="topbar__hint">单条友链 · 实时预览</span>
    <div class="topbar__spacer"></div>

    <button class="tbtn" id="btn-sample" type="button" title="填入一条示例数据">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3" />
        <circle cx="12" cy="12" r="4" />
      </svg>
      <span class="tbtn__label">示例</span>
    </button>

    <button class="tbtn" id="btn-clear" type="button" title="清空全部字段">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M6 6l1 14h10l1-14" />
      </svg>
      <span class="tbtn__label">清空</span>
    </button>
  </header>

  <main class="app">

    <!-- ============ 左侧：编辑 ============ -->
    <section class="panel" aria-label="友链编辑区">
      <div class="panel__head">
        <h1 class="panel__title">编辑这一条友链</h1>
        <div class="panel__head-spacer"></div>
        <span class="panel__sub" id="status-text">编辑中…</span>
      </div>

      <div class="panel__body">
        <div class="form__grid">

          <label class="field field--full check">
            <input type="checkbox" id="f-special">
            <span>特别鸣谢模式 <i>勾选后站点链接变为可选项，卡片不再跳转</i></span>
          </label>

          <label class="field" id="field-name">
            <span id="lb-name">站点名称 <em>*</em></span>
            <input id="f-name" type="text" placeholder="七七的折腾笔记" spellcheck="false" autocomplete="off">
          </label>

          <label class="field" id="field-url">
            <span id="lb-url">站点链接 <em>*</em></span>
            <input id="f-url" type="text" placeholder="https://www.ttwe77.cn" spellcheck="false" autocomplete="off">
          </label>

          <label class="field field--full">
            <span id="lb-desc">站点描述</span>
            <input id="f-desc" type="text" placeholder="学计算机的，最大的爱好就是闲着没事瞎折腾" spellcheck="false" autocomplete="off">
          </label>

          <label class="field field--full">
            <span id="lb-initial">标签 <i>可留空，用逗号分隔</i></span>
            <input id="f-tags" type="text" placeholder="技术, 日常" spellcheck="false" autocomplete="off">
          </label>

          <label class="field">
            <span>首字母 <i>留空则取名称首字</i></span>
            <input id="f-initial" type="text" maxlength="2" placeholder="七" spellcheck="false" autocomplete="off">
          </label>

          <label class="field">
            <span id="lb-avatar">头像地址 <i>可留空</i></span>
            <input id="f-avatar" type="text" placeholder="https://…/avatar.png" spellcheck="false" autocomplete="off">
          </label>

          <div class="field field--full">
            <span>配色 <i>用于头像渐变与卡片左侧色条</i></span>
            <div class="colors">
              <span class="color-field">
                <input type="color" id="f-c1-pick" value="#8ab4f8" aria-label="主色">
                <input type="text" id="f-c1" maxlength="7" placeholder="#8AB4F8" spellcheck="false" autocomplete="off">
              </span>
              <span class="color-field">
                <input type="color" id="f-c2-pick" value="#5e8bff" aria-label="辅色">
                <input type="text" id="f-c2" maxlength="7" placeholder="#5E8BFF" spellcheck="false" autocomplete="off">
              </span>
              <button class="mini" id="btn-random-color" type="button">🎲 随机配色</button>
            </div>

            <div class="swatches" id="swatches">
              <span class="swatches__label">预设</span>
            </div>
          </div>

        </div>
      </div>

      <div class="panel__foot">
        <button class="btn btn--ghost" id="btn-copy-json" type="button">复制 JSON</button>
        <button class="btn btn--ghost" id="btn-copy-html" type="button">复制卡片 HTML</button>
        <button class="btn btn--primary" id="btn-download" type="button">下载 friend.json</button>
      </div>
    </section>

    <!-- ============ 右侧：预览 ============ -->
    <section class="panel" aria-label="预览区">
      <div class="panel__head">
        <h2 class="panel__title">实时预览</h2>
        <div class="panel__head-spacer"></div>
        <span class="panel__sub">与正式页面样式一致</span>
      </div>

      <div class="panel__body">
        <div class="stage">
          <!-- 卡片由 JS 填充内容 -->
          <a class="friend" id="card" href="#" target="_blank" rel="noopener noreferrer">
            <span class="friend__avatar">
              <img id="card-img" alt="" width="50" height="50" hidden>
              <span id="card-initial">?</span>
            </span>
            <span class="friend__main">
              <span class="friend__name" id="card-name">未命名</span>
              <span class="friend__desc" id="card-desc"></span>
              <span class="friend__tags" id="card-tags"></span>
            </span>
            <span class="friend__go" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17 17 7" />
                <path d="M8 7h9v9" />
              </svg>
            </span>
          </a>
        </div>
                <p class="stage__note" id="stage-note">名称或链接为空时，卡片会显示为虚线占位状态</p>

        <h3 class="json-head">JSON 片段</h3>
        <pre class="json" id="json-out">{}</pre>
      </div>
    </section>

  </main>

  <script>
    (function () {
      'use strict';

      /* ============================================================
         常量
         ============================================================ */
      var STORE_KEY = 'ttwe77.friend.single.v1';

      // 与 build.py 的 PALETTE 保持一致
      var PALETTE = [
        ['#8AB4F8', '#5E8BFF'],
        ['#7FC4EA', '#21a5e3'],
        ['#BEC0EC', '#4454F8'],
        ['#7BE0B8', '#34C79F'],
        ['#E39BEA', '#A97CE6'],
        ['#FFD84D', '#FB7B44'],
        ['#9BA4B5', '#6C7A9F'],
        ['#F4756A', '#EA3462']
      ];

      var DEFAULT_COLOR = PALETTE[0];

      var SAMPLE = {
        name: '七七的折腾笔记',
        url: 'https://www.ttwe77.cn',
        desc: '学计算机的，最大的爱好就是闲着没事瞎折腾',
        tags: ['技术', '日常'],
        avatar: 'https://www.ttwe77.cn/src/head.avif',
        initial: '七',
        c1: '#8AB4F8',
        c2: '#5E8BFF'
      };

      /* ============================================================
         工具
         ============================================================ */
      function $(id) { return document.getElementById(id); }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function toTags(v) {
        if (Array.isArray(v)) {
          return v.map(function (x) { return String(x == null ? '' : x).trim(); })
            .filter(function (x) { return x.length; });
        }
        return String(v || '')
          .split(/[,，、;；\s]+/)
          .map(function (x) { return x.trim(); })
          .filter(function (x) { return x.length; });
      }

      function safeColor(v, fallback) {
        var s = String(v == null ? '' : v).trim();
        if (/^#[0-9a-f]{6}$/i.test(s)) return s;
        if (/^#[0-9a-f]{3}$/i.test(s)) {
          return ('#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3]).toLowerCase();
        }
        return fallback;
      }

      function isHex6(v) {
        return /^#[0-9a-f]{6}$/i.test(String(v == null ? '' : v).trim());
      }

      function initialOf(f) {
        var s = String(f.initial || '').trim();
        if (s) return s.slice(0, 2);
        var n = String(f.name || '').trim();
        return n ? n.slice(0, 1) : '?';
      }

      /* ============================================================
         状态
         ============================================================ */
      var state = {
        name: '', url: '', desc: '', tags: [],
        avatar: '', initial: '', c1: DEFAULT_COLOR[0], c2: DEFAULT_COLOR[1],
        special: false
      };

      function setState(data) {
        state = {
          name: data.name == null ? '' : String(data.name),
          url: data.url == null ? '' : String(data.url),
          desc: data.desc == null ? '' : String(data.desc),
          tags: toTags(data.tags),
          avatar: data.avatar == null ? '' : String(data.avatar),
          initial: data.initial == null ? '' : String(data.initial),
          c1: data.c1 == null ? DEFAULT_COLOR[0] : String(data.c1),
          c2: data.c2 == null ? DEFAULT_COLOR[1] : String(data.c2),
          special: !!data.special
        };
      }

      function serialize() {
        var o = { name: state.name, url: state.url, desc: state.desc };
        if (state.tags.length) o.tags = state.tags.slice();
        if (state.avatar) o.avatar = state.avatar;
        if (state.initial) o.initial = state.initial;
        if (state.c1) o.c1 = state.c1;
        if (state.c2) o.c2 = state.c2;
        if (state.special) o.special = true;
        return o;
      }

      /* ============================================================
         轻提示
         ============================================================ */
      function toast(msg) {
        var old = document.getElementById('__toast__');
        if (old) old.remove();

        var el = document.createElement('div');
        el.id = '__toast__';
        el.className = 'toast';
        el.textContent = msg;
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        document.body.appendChild(el);

        void el.offsetWidth;
        el.classList.add('is-visible');

        setTimeout(function () {
          el.classList.remove('is-visible');
          setTimeout(function () { el.remove(); }, 320);
        }, 1800);
      }

      function copyText(text, okMsg) {
        function fallback() {
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            toast(ok ? okMsg : '复制失败，请手动选中');
          } catch (e) {
            toast('复制失败，请手动选中');
          }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            toast(okMsg);
          }).catch(fallback);
        } else {
          fallback();
        }
      }

      /* ============================================================
         表单 <-> 状态
         ============================================================ */
      var els = {
        name: $('f-name'),
        url: $('f-url'),
        desc: $('f-desc'),
        tags: $('f-tags'),
        initial: $('f-initial'),
        avatar: $('f-avatar'),
        c1: $('f-c1'),
        c2: $('f-c2'),
        c1Pick: $('f-c1-pick'),
        c2Pick: $('f-c2-pick'),
        special: $('f-special')
      };

      function fillForm() {
        els.name.value = state.name;
        els.url.value = state.url;
        els.desc.value = state.desc;
        els.tags.value = state.tags.join(', ');
        els.initial.value = state.initial;
        els.avatar.value = state.avatar;
        els.c1.value = state.c1;
        els.c2.value = state.c2;
        els.c1Pick.value = safeColor(state.c1, DEFAULT_COLOR[0]).toLowerCase();
        els.c2Pick.value = safeColor(state.c2, DEFAULT_COLOR[1]).toLowerCase();
        els.special.checked = state.special;
      }

      /* ============================================================
         渲染：预览卡片
         ============================================================ */
      var card = $('card');
      var cardImg = $('card-img');
      var cardInitial = $('card-initial');
      var cardName = $('card-name');
      var cardDesc = $('card-desc');
      var cardTags = $('card-tags');

      cardImg.addEventListener('error', function () {
        cardImg.hidden = true;
      });

            /* ============================================================
         渲染：字段文案（普通模式 / 特别鸣谢模式）
         ============================================================ */
      var LABELS = {
        normal: {
          name: '站点名称 <em>*</em>',
          url: '站点链接 <em>*</em>',
          desc: '站点描述',
          initial: '标签 <i>可留空，用逗号分隔</i>',
          avatar: '头像地址 <i>可留空</i>',
          phName: '七七的折腾笔记',
          phDesc: '学计算机的，最大的爱好就是闲着没事瞎折腾',
          note: '名称或链接为空时，卡片会显示为虚线占位状态'
        },
        special: {
          name: '昵称 <em>*</em>',
          url: '个人主页链接 <i>可留空</i>',
          desc: '一句话介绍',
          initial: '标签 <i>可留空，用逗号分隔</i>',
          avatar: '头像 <i>可留空</i>',
          phName: '七七',
          phDesc: '技术宅一枚，沉迷计算机与网络，爱折腾软硬件',
          note: '特别鸣谢模式下，仅昵称为空时才会显示虚线占位'
        }
      };

      function renderLabels() {
        var L = state.special ? LABELS.special : LABELS.normal;
        $('lb-name').innerHTML = L.name;
        $('lb-url').innerHTML = L.url;
        $('lb-desc').innerHTML = L.desc;
        $('lb-initial').innerHTML = L.initial;
        $('lb-avatar').innerHTML = L.avatar;
        els.name.placeholder = L.phName;
        els.desc.placeholder = L.phDesc;
        $('stage-note').textContent = L.note;
      }

      function renderCard() {
        var f = state;
        var c1 = safeColor(f.c1, DEFAULT_COLOR[0]);
        var c2 = safeColor(f.c2, DEFAULT_COLOR[1]);

        card.style.setProperty('--c1', c1);
        card.style.setProperty('--c2', c2);

        var hasUrl = !!String(f.url).trim();
        var isThanks = !!f.special;
        card.setAttribute('href', hasUrl ? f.url : '#');
        if (hasUrl) {
          card.removeAttribute('data-empty');
        } else {
          card.setAttribute('data-empty', '1');
        }
        // 特别鸣谢模式下允许没有链接，此时不算“空卡片”
        card.classList.toggle('is-empty', !String(f.name).trim() || (!hasUrl && !isThanks));
        card.classList.toggle('is-thanks', isThanks && !hasUrl);

        // 头像
        var avatar = String(f.avatar).trim();
        if (avatar) {
          if (cardImg.getAttribute('src') !== avatar) cardImg.setAttribute('src', avatar);
          cardImg.hidden = false;
        } else {
          cardImg.removeAttribute('src');
          cardImg.hidden = true;
        }

        // 首字母
        cardInitial.textContent = initialOf(f);

        // 名称
        cardName.textContent = String(f.name).trim() || (f.special ? '待填写昵称' : '未命名');

        // 描述
        var desc = String(f.desc).trim();
        cardDesc.textContent = desc;
        cardDesc.hidden = !desc;

        // 标签
        cardTags.textContent = '';
        if (f.tags.length) {
          f.tags.forEach(function (t) {
            var chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = t;
            cardTags.appendChild(chip);
          });
          cardTags.hidden = false;
        } else {
          cardTags.hidden = true;
        }
      }

      /* ============================================================
         渲染：JSON
         ============================================================ */
      function renderJSON() {
        $('json-out').textContent = JSON.stringify(serialize(), null, 2);
      }

      /* ============================================================
         渲染：状态提示 & 校验
         ============================================================ */
      function renderStatus() {
        var nameOk = !!String(state.name).trim();
        var urlOk = !!state.special || !!String(state.url).trim();

        $('field-name').classList.toggle('is-invalid', !nameOk);
        $('field-url').classList.toggle('is-invalid', !urlOk);
        $('field-url').classList.toggle('is-optional', !!state.special);

        var el = $('status-text');
        if (!nameOk && !urlOk) {
          el.textContent = '待填写名称和链接';
        } else if (!nameOk) {
          el.textContent = '还差站点名称';
        } else if (!urlOk) {
          el.textContent = '还差站点链接';
        } else if (state.special && !String(state.url).trim()) {
          el.textContent = '特别鸣谢模式 · 可以复制了';
        } else {
          el.textContent = '已完成，可以复制了';
        }
      }

      /* ============================================================
         统一更新
         ============================================================ */
      var saveTimer = null;

      function save() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(serialize()));
          } catch (e) { /* 隐私模式下忽略 */ }
        }, 280);
      }

      function update() {
        renderCard();
        renderJSON();
        renderStatus();
        renderLabels();
        save();
      }

      /* ============================================================
         表单事件
         ============================================================ */
      function bindText(el, key, transform) {
        el.addEventListener('input', function () {
          state[key] = transform ? transform(el.value) : el.value;
          update();
        });
      }

      bindText(els.name, 'name');
      bindText(els.url, 'url');
      bindText(els.desc, 'desc');
      bindText(els.initial, 'initial');
      bindText(els.avatar, 'avatar');
      bindText(els.tags, 'tags', toTags);

      // 特别鸣谢模式
      els.special.addEventListener('change', function () {
        state.special = els.special.checked;
        update();
      });

      // 颜色文本输入
      ['c1', 'c2'].forEach(function (key) {
        els[key].addEventListener('input', function () {
          state[key] = els[key].value;
          if (isHex6(els[key].value)) {
            els[key + 'Pick'].value = els[key].value.trim().toLowerCase();
          }
          update();
        });
      });

      // 颜色选择器
      [['c1', 'c1Pick'], ['c2', 'c2Pick']].forEach(function (pair) {
        var key = pair[0], pickId = pair[1];
        els[pickId].addEventListener('input', function () {
          state[key] = els[pickId].value;
          els[key].value = els[pickId].value;
          update();
        });
      });

      /* ============================================================
         随机配色 / 预设
         ============================================================ */
      function applyColor(pair) {
        state.c1 = pair[0];
        state.c2 = pair[1];
        els.c1.value = pair[0];
        els.c2.value = pair[1];
        els.c1Pick.value = pair[0].toLowerCase();
        els.c2Pick.value = pair[1].toLowerCase();
        update();
      }

      $('btn-random-color').addEventListener('click', function () {
        var current = state.c1 + state.c2;
        var pair = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        // 尽量避免随机到当前同一组
        var guard = 0;
        while (guard++ < 8 && (pair[0] + pair[1]) === current) {
          pair = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        }
        applyColor(pair);
      });

      (function buildSwatches() {
        var box = $('swatches');
        PALETTE.forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'swatch';
          b.title = pair[0] + ' → ' + pair[1];
          b.setAttribute('aria-label', '使用配色 ' + pair[0] + ' 到 ' + pair[1]);
          b.style.background = 'linear-gradient(135deg, ' + pair[0] + ', ' + pair[1] + ')';
          b.addEventListener('click', function () { applyColor(pair); });
          box.appendChild(b);
        });
      })();

      /* ============================================================
         顶栏操作
         ============================================================ */
      $('btn-sample').addEventListener('click', function () {
        setState(SAMPLE);
        fillForm();
        update();
        toast('已填入示例数据');
      });

      $('btn-clear').addEventListener('click', function () {
        if (!confirm('确定要清空当前所有内容吗？')) return;
        setState({
          name: '', url: '', desc: '', tags: [],
          avatar: '', initial: '',
          c1: DEFAULT_COLOR[0], c2: DEFAULT_COLOR[1],
          special: false
        });
        fillForm();
        update();
        toast('已清空');
      });

      /* ============================================================
         复制 / 下载
         ============================================================ */
      $('btn-copy-json').addEventListener('click', function () {
        copyText(JSON.stringify(serialize(), null, 2), '已复制 JSON 片段');
      });

      $('btn-copy-html').addEventListener('click', function () {
        copyText(buildCardHTML(), '已复制卡片 HTML');
      });

      $('btn-download').addEventListener('click', function () {
        var text = JSON.stringify(serialize(), null, 2) + '\n';
        var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = url;
        a.download = 'friend.json';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
        toast('已下载 friend.json');
      });

      /* ============================================================
         生成单张卡片的 HTML（与 build.py 输出格式一致）
         ============================================================ */
      var GO_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

      function buildCardHTML() {
        var f = state;
        var c1 = safeColor(f.c1, DEFAULT_COLOR[0]);
        var c2 = safeColor(f.c2, DEFAULT_COLOR[1]);
        var name = String(f.name).trim() || (f.special ? '待填写昵称' : '未命名');
        var desc = String(f.desc).trim();
        var avatar = String(f.avatar).trim();
        var url = String(f.url).trim();
        var isLink = !!url;

        var img = avatar
          ? '<img src="' + esc(avatar) + '" alt="" width="50" height="50" ' +
          'loading="lazy" onerror="this.remove()">'
          : '';

        var tags = f.tags.map(function (t) {
          return '<span class="chip">' + esc(t) + '</span>';
        }).join('');

        var style = ' style="--c1:' + c1 + ';--c2:' + c2 + ';--i:0"';

        // 无链接（特别鸣谢）时用 span，避免出现无效跳转
        var open = isLink
          ? '<a class="friend" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' + style + '>'
          : '<span class="friend is-thanks"' + style + '>';
        var close = isLink ? '</a>' : '</span>';

        var go = isLink
          ? '        <span class="friend__go" aria-hidden="true">' + GO_SVG + '</span>\n'
          : '';

        return open + '\n' +
          '        <span class="friend__avatar">' + img +
          '<span>' + esc(initialOf(f)) + '</span></span>\n' +
          '        <span class="friend__main">\n' +
          '          <span class="friend__top">\n' +
          '            <span class="friend__name">' + esc(name) + '</span>\n' +
          '          </span>\n' +
          '          <span class="friend__desc">' + esc(desc) + '</span>\n' +
          '          <span class="friend__tags">' + tags + '</span>\n' +
          '        </span>\n' +
          go +
          close;
      }

      /* ============================================================
         预览卡片：无链接时不跳转
         ============================================================ */
      card.addEventListener('click', function (e) {
        if (card.dataset.empty) e.preventDefault();
      });

      /* ============================================================
         初始化
         ============================================================ */
      (function init() {
        var data = null;
        try {
          var raw = localStorage.getItem(STORE_KEY);
          if (raw) data = JSON.parse(raw);
        } catch (e) { data = null; }

        if (!data || typeof data !== 'object') data = SAMPLE;

        setState(data);
        fillForm();
        update();
      })();

    })();
  </script>

</body>
