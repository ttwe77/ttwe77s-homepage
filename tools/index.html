<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#21a5e3">

  <!-- 主题初始化 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <title>实用工具 · 七七的折腾笔记</title>
  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml">

  <style>
    /* ============ 设计令牌 ============ */
    :root {
      --color-primary: #21a5e3;
      --color-primary-hover: #0E7AE0;
      --color-primary-active: #0B6BC5;
      --color-blue-light: #ABD7FF;
      --color-periwinkle: #BEC0EC;
      --color-orchid: #4454F8;

      --color-bg-white: #FFFFFF;
      --color-bg-light: #FAFAFA;
      --color-bg-soft: #F5F5F5;
      --color-border: #EDEDED;
      --color-border-strong: #D4D4D4;

      --color-text-primary: #1F1F1F;
      --color-text-body: #404040;
      --color-text-secondary: #737373;
      --color-text-disabled: #A3A3A3;

      --color-danger: #F21B28;
      --color-success: #169B5B;
      --color-warning: #FFD84D;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      --shadow-card: 0 2px 8px rgba(0, 0, 0, .06);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .1);
      --shadow-blue: 0 6px 20px rgba(18, 138, 250, .25);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

      --topbar-h: 56px;
      --btn-skew: -10deg;
    }

    /* ============ 基础 ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--topbar-h) + 16px);
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-light);
      color: var(--color-text-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    p,
    figure {
      margin: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* 背景氛围 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 4%, rgba(18, 138, 250, .12), transparent 42%),
        radial-gradient(circle at 92% -4%, rgba(171, 215, 255, .42), transparent 46%),
        radial-gradient(circle at 72% 96%, rgba(190, 192, 236, .22), transparent 46%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(18, 138, 250, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 138, 250, .035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ============ 顶栏 ============ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #3f568c;
      background: transparent;
      transition: background .18s ease, transform .12s ease, color .18s ease;
    }

    .icon-btn:hover {
      background: rgba(63, 86, 140, .08);
    }

    .icon-btn:active {
      transform: scale(.94);
    }

    .icon-btn--back {
      width: 38px;
      height: 38px;
      background: #3f568c;
      color: #fff;
    }

    .icon-btn--back:hover {
      background: #2d4070;
      color: #fff;
    }

    .topbar__logo {
      flex: 0 0 auto;
      display: block;
      width: 100px;
      height: 32px;
    }

    .topbar__logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .topbar__title {
      font-size: clamp(11px, 3vw, 16px);
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar__spacer {
      flex: 1 1 auto;
    }

    /* ============ 页面容器 ============ */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + 30px) 20px 64px;
    }

    /* ============ 页头 ============ */
    .page-head {
      margin-bottom: 26px;
    }

    .page-head__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--color-primary);
    }

    .page-head__eyebrow::before {
      content: "";
      width: 30px;
      height: 2px;
      border-radius: 2px;
      flex: 0 0 auto;
      background: linear-gradient(90deg, var(--color-primary), var(--color-blue-light));
    }

    .page-head__title {
      margin-top: 18px;
      font-size: clamp(30px, 5.4vw, 46px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(118deg, #0889ca 0%, #21a5e3 42%, #39bef8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .page-head__desc {
      margin-top: 14px;
      max-width: 680px;
      font-size: 14px;
      line-height: 1.85;
      color: var(--color-text-secondary);
    }

    .page-head__meta {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 8px 16px;
      flex-wrap: wrap;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .page-head__meta span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .page-head__meta span::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-blue-light);
    }

    .page-head__meta span:first-child::before {
      background: var(--color-primary);
    }

    .page-head__meta b {
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }

    /* ============ 工具条 ============ */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .search {
      position: relative;
      flex: 1 1 240px;
      min-width: 0;
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 12px;
      border-radius: var(--radius-lg);
      background: #fff;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .search:focus-within {
      border-color: var(--color-blue-light);
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .12);
    }

    .search__icon {
      flex: 0 0 auto;
      color: var(--color-text-disabled);
    }

    .search input {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      padding: 0 8px;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--color-text-primary);
    }

    .search input::placeholder {
      color: var(--color-text-disabled);
    }

    .search__clear {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--color-text-disabled);
      font-size: 15px;
      line-height: 1;
      transition: background .16s ease, color .16s ease;
    }

    .search__clear:hover {
      background: rgba(33, 165, 227, .1);
      color: var(--color-primary);
    }

    .search input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }

    /* ============ 工具网格 & 卡片 ============ */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 302px), 1fr));
      gap: 14px;
    }

    .tool-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px 20px;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      animation: cardIn .5s cubic-bezier(.22, .61, .36, 1) backwards;
      animation-delay: calc(var(--i, 0) * 45ms);
      transition: transform .18s cubic-bezier(.22, .61, .36, 1), box-shadow .2s ease, border-color .2s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        translate: 0 14px;
      }

      to {
        opacity: 1;
        translate: 0 0;
      }
    }

    .tool-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--c1, #21a5e3), var(--c2, #ABD7FF));
      opacity: 0;
      transform: scaleY(.35);
      transition: opacity .2s ease, transform .26s cubic-bezier(.22, .61, .36, 1);
    }

    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
      border-color: rgba(33, 165, 227, .42);
    }

    .tool-card:hover::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .tool-card:active {
      transform: translateY(-1px) scale(.992);
    }

    .tool-card:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .tool-card.is-hidden {
      display: none;
    }

    .tool-card__header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 图标容器与 SVG 样式 */
    .tool-card__icon {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      background: rgba(33, 165, 227, 0.08);
      color: var(--color-primary);
      transition: background .2s ease;
    }

    .tool-card:hover .tool-card__icon {
      background: rgba(33, 165, 227, 0.15);
    }

    .tool-card__icon svg {
      width: 24px;
      height: 24px;
    }

    .tool-card__name {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-card__desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--color-text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.6em;
    }

    .tool-card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      color: var(--color-primary);
      background: rgba(18, 138, 250, .09);
      white-space: nowrap;
    }

    .tool-card__go {
      position: absolute;
      right: 16px;
      bottom: 16px;
      color: var(--color-text-disabled);
      transition: color .2s ease, transform .2s ease;
    }

    .tool-card:hover .tool-card__go {
      color: var(--color-primary);
      transform: translate(2px, -2px);
    }

    /* 空状态 & 加载状态 */
    .empty-state {
      grid-column: 1 / -1;
      padding: 40px 22px;
      text-align: center;
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-lg);
      background: #fff;
      font-size: 13px;
      line-height: 1.85;
      color: var(--color-text-secondary);
    }

    .empty-state b {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
      color: var(--color-text-primary);
    }

    /* ============ 页脚 ============ */
    .footer {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    .footer a {
      color: var(--color-primary);
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* 备案行：与上一条说明拉开距离 */
    .footer__beian {
      margin-top: 6px;
    }

    .footer__beian-sep {
      margin: 0 6px;
      color: var(--color-border-strong);
      user-select: none;
    }

    /* 公安备案：图标 + 文字对齐 */
    .footer__beian-police {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
    }

    .footer__beian-police img {
      display: block;
      height: 12px;
      width: auto;
      flex: 0 0 auto;
    }

    @media (max-width: 640px) {
      .footer__beian-police img {
        height: 11px;
      }
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      left: 50%;
      top: calc(var(--topbar-h) + 16px);
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: min(86vw, 360px);
      padding: 10px 20px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card-hover);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.5;
      text-align: center;
      word-break: break-word;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -10px);
      transition: opacity .25s cubic-bezier(.22, .61, .36, 1), transform .25s cubic-bezier(.22, .61, .36, 1);
    }

    .toast::before {
      content: "";
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(18, 138, 250, .15);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 入场动画 */
    .js .reveal {
      opacity: 0;
      translate: 0 18px;
      transition: opacity .6s cubic-bezier(.22, .61, .36, 1), translate .6s cubic-bezier(.22, .61, .36, 1);
    }

    .js .reveal.is-visible {
      opacity: 1;
      translate: 0 0;
    }

    /* ============ 响应式 ============ */
    @media (max-width: 640px) {
      :root {
        --btn-skew: -6deg;
      }

      .topbar {
        padding: 0 12px;
        gap: 9px;
      }

      .topbar__logo {
        width: 62px;
        height: 28px;
      }

      .wrap {
        padding: calc(var(--topbar-h) + 18px) 12px 48px;
      }

      .page-head__eyebrow::before {
        width: 22px;
      }

      .page-head__desc {
        font-size: 13px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .search {
        flex: 1 1 auto;
        height: 44px;
      }

      .search input {
        font-size: 16px;
      }

      /* 避免 iOS 聚焦缩放 */
      .tool-card {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      html {
        scroll-behavior: auto;
      }

      .js .reveal {
        opacity: 1 !important;
        translate: none !important;
        transition: none !important;
      }

      .tool-card {
        animation: none !important;
        opacity: 1 !important;
      }
    }

    /* ============ 深色模式 ============ */
    .icon-btn__moon {
      display: none;
    }

    :root[data-theme="dark"] .topbar__logo img {
      filter: invert(1) hue-rotate(180deg) brightness(1.2);
    }

    :root[data-theme="dark"] .icon-btn__sun {
      display: none;
    }

    :root[data-theme="dark"] .icon-btn__moon {
      display: block;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-primary: #4FB8F0;
      --color-primary-hover: #7ACDFF;
      --color-primary-active: #35A0D8;
      --color-blue-light: #6FA8D6;
      --color-bg-white: #1B2230;
      --color-bg-light: #12161F;
      --color-bg-soft: #232B3A;
      --color-border: #2B3546;
      --color-border-strong: #3B465C;
      --color-text-primary: #EAF2FA;
      --color-text-body: #C6D2E0;
      --color-text-secondary: #93A3B8;
      --color-text-disabled: #6B7A8E;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, .38);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .5);
    }

    :root[data-theme="dark"] body::before {
      background:
        radial-gradient(circle at 10% 4%, rgba(79, 184, 240, .16), transparent 42%),
        radial-gradient(circle at 92% -4%, rgba(68, 84, 248, .18), transparent 46%),
        radial-gradient(circle at 72% 96%, rgba(140, 155, 255, .12), transparent 46%);
    }

    :root[data-theme="dark"] body::after {
      background-image:
        linear-gradient(rgba(79, 184, 240, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 184, 240, .05) 1px, transparent 1px);
    }

    :root[data-theme="dark"] .topbar {
      background: rgba(18, 22, 31, .92);
      border-bottom-color: rgba(255, 255, 255, .07);
    }

    :root[data-theme="dark"] .topbar__title {
      color: var(--color-text-primary);
    }

    :root[data-theme="dark"] .icon-btn {
      color: #AFC4DD;
    }

    :root[data-theme="dark"] .icon-btn:hover {
      background: rgba(175, 196, 221, .1);
    }

    :root[data-theme="dark"] .page-head__title {
      background: linear-gradient(118deg, #67C8F5 0%, #8FD8FF 52%, #B4E4FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    :root[data-theme="dark"] .search,
    :root[data-theme="dark"] .empty-state {
      background: var(--color-bg-white);
    }

    :root[data-theme="dark"] .tool-card__icon {
      background: rgba(79, 184, 240, .1);
    }

    :root[data-theme="dark"] .tool-card:hover .tool-card__icon {
      background: rgba(79, 184, 240, .2);
    }

    :root[data-theme="dark"] .toast {
      background: rgba(27, 34, 48, .94);
    }
  </style>
</head>

<body>
  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <button class="icon-btn icon-btn--back" type="button" id="btn-back" aria-label="返回">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>

    <picture class="topbar__logo">
      <source srcset="/src/bloglogo.avif" type="image/avif">
      <img src="/src/bloglogo.avif" alt="七七的折腾笔记" onerror="this.closest('picture').style.display='none'">
    </picture>

    <div class="topbar__title">实用工具</div>
    <div class="topbar__spacer"></div>

    <button class="icon-btn" type="button" id="btn-theme" aria-label="切换到深色模式" title="切换到深色模式" aria-pressed="false">
      <svg class="icon-btn__sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
      <svg class="icon-btn__moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
      </svg>
    </button>

    <a class="icon-btn" href="/" aria-label="返回首页" title="返回首页">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5" />
        <path d="M5 9.5V21h14V9.5" />
      </svg>
    </a>
  </header>

  <main class="wrap">
    <!-- ============ 页头 ============ -->
    <section class="page-head reveal">
      <p class="page-head__eyebrow">TOOL BOX</p>
      <h1 class="page-head__title">实用工具</h1>
      <p class="page-head__desc">
        这里收集了一些我在折腾过程中写的小工具。都是一些轻量级的小玩意，希望能帮到你。
      </p>
      <div class="page-head__meta">
        <span>共 <b id="tool-total">0</b> 个工具</span>
        <span>数据动态加载中</span>
      </div>
    </section>

    <!-- ============ 工具条 ============ -->
    <div class="toolbar reveal">
      <div class="search">
        <svg class="search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.2-3.2" />
        </svg>
        <input id="tool-search" type="search" placeholder="搜索工具名称 / 描述 / 标签" autocomplete="off" aria-label="搜索工具">
        <button class="search__clear" id="tool-clear" type="button" aria-label="清空搜索" hidden>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ============ 工具网格 ============ -->
    <section class="tools-grid reveal" id="tools-grid" aria-label="工具列表">
      <!-- 初始 Loading 状态 -->
      <div class="empty-state" id="tools-loading">
        <b>正在加载工具列表...</b>
        <span>请稍等片刻。</span>
      </div>
    </section>

    <!-- ============ 页脚 ============ -->
    <footer class="footer">
      <footer class="footer">
        <p>© 2026 ttwe77 · 本站源码采用 <a href="https://gitee.com/ttwe77/ttwe77s-homepage/blob/main/LICENSE" target="_blank"
            rel="noopener noreferrer">MIT License</a> 开源协议。</p>
        <p class="footer__beian">
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">桂ICP备2026023217号-1</a>
          <span class="footer__beian-sep" aria-hidden="true">·</span>
          <a class="footer__beian-police" href="https://beian.mps.gov.cn/#/query/webSearch?code=45020002000311"
            target="_blank" rel="noreferrer"><img src="/src/beian.png" alt="公安备案">桂公网安备45020002000311号</a>
        </p>
      </footer>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      document.documentElement.classList.add('js');

      /* ============================================================
         轻提示 Toast
         ============================================================ */
      function showToast(msg) {
        var old = document.getElementById('__toast__');
        if (old) old.remove();

        var el = document.createElement('div');
        el.id = '__toast__';
        el.className = 'toast';
        el.textContent = msg;
        document.body.appendChild(el);

        void el.offsetWidth;
        el.classList.add('is-visible');

        setTimeout(function () {
          el.classList.remove('is-visible');
          setTimeout(function () { el.remove(); }, 320);
        }, 1800);
      }

      /* ============================================================
         返回按钮
         ============================================================ */
      var backBtn = document.getElementById('btn-back');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            location.href = '/';
          }
        });
      }

      /* ============================================================
         主题切换
         ============================================================ */
      var root = document.documentElement;
      var btnTheme = document.getElementById('btn-theme');
      var metaThemeColor = document.querySelector('meta[name="theme-color"]');

      function isDark() { return root.getAttribute('data-theme') === 'dark'; }

      function syncThemeBtn() {
        var dark = isDark();
        if (btnTheme) {
          var label = dark ? '切换到浅色模式' : '切换到深色模式';
          btnTheme.setAttribute('aria-label', label);
          btnTheme.setAttribute('title', label);
          btnTheme.setAttribute('aria-pressed', dark ? 'true' : 'false');
        }
        if (metaThemeColor) {
          metaThemeColor.setAttribute('content', dark ? '#12161F' : '#21a5e3');
        }
      }

      function applyTheme(theme, persist) {
        root.setAttribute('data-theme', theme);
        if (persist) {
          try { localStorage.setItem('theme', theme); } catch (e) { }
        }
        syncThemeBtn();
      }

      syncThemeBtn();

      if (btnTheme) {
        btnTheme.addEventListener('click', function () {
          var theme = isDark() ? 'light' : 'dark';
          if (typeof document.startViewTransition === 'function') {
            document.startViewTransition(function () { applyTheme(theme, true); });
          } else {
            applyTheme(theme, true);
          }
        });
      }

      /* ============================================================
         入场动画
         ============================================================ */
      var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            io.unobserve(entry.target);
            entry.target.classList.add('is-visible');
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
        reveals.forEach(function (el) { io.observe(el); });
      } else {
        reveals.forEach(function (el) { el.classList.add('is-visible'); });
      }

      /* ============================================================
         动态加载并渲染工具列表
         ============================================================ */
      var grid = document.getElementById('tools-grid');
      var loadingEl = document.getElementById('tools-loading');
      var totalEl = document.getElementById('tool-total');
      var searchInput = document.getElementById('tool-search');
      var searchClear = document.getElementById('tool-clear');
      var allCards = [];

      // 默认兜底图标（如果 JSON 里没写）
      var defaultIcon = "<svg width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'></circle><line x1='12' y1='16' x2='12' y2='12'></line><line x1='12' y1='8' x2='12.01' y2='8'></line></svg>";

      fetch('/tools/app/app.json')
        .then(function (res) {
          if (!res.ok) throw new Error('Network response was not ok');
          return res.json();
        })
        .then(function (data) {
          if (loadingEl) loadingEl.remove();

          if (!Array.isArray(data) || data.length === 0) {
            grid.innerHTML = '<div class="empty-state"><b>暂无工具</b><span>作者还没有添加任何工具。</span></div>';
            return;
          }

          if (totalEl) totalEl.textContent = data.length;

          data.forEach(function (tool, index) {
            var card = document.createElement('a');
            card.className = 'tool-card';
            card.href = tool.url || '#';
            card.style.setProperty('--i', index);

            // 如果是外部链接，新窗口打开
            if (tool.url && (tool.url.startsWith('http') || tool.url.startsWith('//'))) {
              card.target = '_blank';
              card.rel = 'noopener noreferrer';
            }

            var tagsHtml = (tool.tags || []).map(function (tag) {
              return '<span class="chip">' + tag + '</span>';
            }).join('');

            card.innerHTML =
              '<div class="tool-card__header">' +
              '<div class="tool-card__icon">' + (tool.icon || defaultIcon) + '</div>' +
              '<div class="tool-card__name">' + (tool.name || '未命名工具') + '</div>' +
              '</div>' +
              '<div class="tool-card__desc">' + (tool.desc || '暂无描述') + '</div>' +
              '<div class="tool-card__tags">' + tagsHtml + '</div>' +
              '<div class="tool-card__go">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M7 17 17 7" />' +
              '<path d="M8 7h9v9" />' +
              '</svg>' +
              '</div>';

            grid.appendChild(card);
            allCards.push(card);
          });

          // 渲染完成后初始化搜索
          initSearch();
        })
        .catch(function (err) {
          console.error('Failed to load tools:', err);
          if (loadingEl) loadingEl.remove();
          grid.innerHTML = '<div class="empty-state"><b>加载失败</b><span>无法读取工具列表，请稍后重试。</span></div>';
        });

      /* ============================================================
         搜索过滤逻辑
         ============================================================ */
      function initSearch() {
        // 缓存搜索关键词
        allCards.forEach(function (card) {
          var text = card.textContent || '';
          card.dataset.searchKey = text.replace(/\s+/g, ' ').toLowerCase();
        });

        function applyFilter() {
          if (!searchInput) return;
          var q = searchInput.value.trim().toLowerCase();
          var shown = 0;

          allCards.forEach(function (card) {
            var hit = !q || card.dataset.searchKey.indexOf(q) !== -1;
            card.classList.toggle('is-hidden', !hit);
            if (hit) shown++;
          });

          // 处理无结果的状态
          var emptyState = document.getElementById('search-empty');
          if (shown === 0 && q !== '') {
            if (!emptyState) {
              emptyState = document.createElement('div');
              emptyState.id = 'search-empty';
              emptyState.className = 'empty-state';
              emptyState.innerHTML = '<b>没有找到匹配的工具</b><span>换个关键词试试吧。</span>';
              grid.appendChild(emptyState);
            }
          } else if (emptyState) {
            emptyState.remove();
          }

          if (searchClear) searchClear.hidden = !q;
        }

        if (searchInput) {
          searchInput.addEventListener('input', applyFilter);
          searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
              searchInput.value = '';
              applyFilter();
            }
          });
        }

        if (searchClear) {
          searchClear.addEventListener('click', function () {
            searchInput.value = '';
            applyFilter();
            searchInput.focus();
          });
        }
      }

    })();
  </script>
</body>
