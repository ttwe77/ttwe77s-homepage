<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>校园睡 · 娱乐睡眠打卡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#e9eaf2;color:#1c1c28}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#f2f3f8;position:relative;overflow-x:hidden}
.hidden{display:none!important}
input,button{font-family:inherit}
::-webkit-scrollbar{width:0}

/* ============ 通用 ============ */
.page{padding-bottom:92px;min-height:100vh}
.page-inner{padding:16px 16px 0}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(30,30,60,.05);margin-top:14px}
.card-head{font-size:13px;font-weight:700;color:#5a5a72;margin-bottom:12px;letter-spacing:.5px}
.mt{margin-top:14px}
.btn-primary{width:100%;border:none;background:linear-gradient(135deg,#7C6CF0,#5B4BD6);color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:14px;margin-top:16px;cursor:pointer;box-shadow:0 8px 20px rgba(108,92,231,.28);transition:.15s}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{width:100%;border:1.5px dashed #d6d2ee;background:#faf9ff;color:#6C5CE7;font-size:14px;font-weight:600;padding:13px;border-radius:14px;margin-top:10px;cursor:pointer;transition:.15s}
.btn-ghost:active{transform:scale(.98)}
.btn-ghost.danger{color:#e03131;border-color:#ffd6d6;background:#fff5f5}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:rgba(28,28,40,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:500;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 注册 ============ */
.reg-wrap{padding:46px 20px 40px}
.reg-logo{font-size:58px;text-align:center;line-height:1;filter:drop-shadow(0 8px 16px rgba(108,92,231,.3))}
.reg-title{text-align:center;font-size:28px;font-weight:800;margin:12px 0 6px;letter-spacing:3px}
.reg-sub{text-align:center;color:#8a8aa0;font-size:13px;margin-bottom:26px}
.reg-card{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 10px 34px rgba(30,30,60,.08)}
.reg-card label{display:block;font-size:12px;color:#8a8aa0;margin:14px 0 6px;font-weight:600;letter-spacing:.5px}
.reg-card label:first-child{margin-top:0}
.reg-card input{width:100%;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:13px 14px;font-size:15px;outline:none;transition:.2s;color:#1c1c28}
.reg-card input:focus{border-color:#6C5CE7;background:#fff}
.fine{font-size:11px;color:#a8a8bc;text-align:center;line-height:1.7;margin:16px 0 0}

/* ============ 顶部栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.hi{font-size:20px;font-weight:800;letter-spacing:.5px}
.hi-sub{font-size:12px;color:#8a8aa0;margin-top:4px}
.logo-mini{font-size:28px;line-height:1}

/* ============ 进展页 ============ */
.hero-card{background:linear-gradient(150deg,#6C5CE7,#8B7BF0 60%,#9F8CF5);border-radius:22px;padding:22px 20px 18px;color:#fff;box-shadow:0 14px 32px rgba(108,92,231,.32);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.09);right:-70px;top:-80px}
.hero-row{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1}
.hero-num{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2.5px;font-variant-numeric:tabular-nums}
.hero-goal{font-size:14px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.3}
.hero-goal span{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:1px}
.hero-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.22);margin:16px 0 14px;overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:6px;background:#fff;transition:width .5s ease}
.hero-meta{display:flex;justify-content:space-between;position:relative;z-index:1}
.hero-meta>div{display:flex;flex-direction:column;gap:3px}
.hero-meta b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-meta span{font-size:10.5px;color:rgba(255,255,255,.62)}

.tip-banner{margin-top:14px;border:1.5px solid #b6e8d2;background:#effcf6;border-radius:16px;padding:14px 16px}
.tip-banner>div{font-size:13.5px;font-weight:600;color:#0e7a56;line-height:1.5}
.tip-banner button{margin-top:10px;width:100%;border:none;border-radius:11px;background:linear-gradient(135deg,#22c98d,#12b886);color:#fff;font-size:13.5px;font-weight:700;padding:11px;cursor:pointer;box-shadow:0 6px 16px rgba(18,184,134,.28)}
.tip-banner button:active{transform:scale(.98)}

.best-row{display:flex;gap:10px}
.best-box{flex:1;background:#f7f7fd;border-radius:14px;padding:14px 6px;text-align:center}
.best-box .bv{font-size:17px;font-weight:800;color:#3b3b58;font-variant-numeric:tabular-nums}
.best-box .bl{font-size:10.5px;color:#9a9ab0;margin-top:6px}

.ad-banner{margin-top:14px;border-radius:18px;padding:18px 18px;background:linear-gradient(115deg,#ff7a59,#ff9f43 55%,#ffd166);color:#fff;box-shadow:0 12px 28px rgba(255,122,89,.32);cursor:pointer;position:relative;overflow:hidden}
.ad-banner::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);right:-50px;bottom:-70px}
.ad-main{font-size:19px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 6px rgba(180,60,0,.2)}
.ad-sub{font-size:12px;margin-top:7px;opacity:.92;font-weight:600}

.rec-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f2f2f8}
.rec-row:last-child{border-bottom:none}
.rec-icon{width:36px;height:36px;border-radius:12px;background:#f4f2ff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.rec-main{flex:1;min-width:0}
.rec-date{font-size:12.5px;font-weight:600;color:#3b3b58}
.rec-loc{font-size:11px;color:#9a9ab0;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-val{font-size:14px;font-weight:800;color:#3b3b58;font-variant-numeric:tabular-nums;text-align:right}
.rec-val.bad{color:#f03e3e}
.rec-val.warn{color:#f59f00}
.rec-tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.rec-tag.bad{background:#ffe3e3;color:#f03e3e}
.rec-tag.warn{background:#fff4e0;color:#e8890c}
.foot-note{text-align:center;font-size:10.5px;color:#b0b0c4;padding:22px 0 10px;letter-spacing:.5px}

/* ============ 睡觉页 ============ */
.loc-bar{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px rgba(30,30,60,.05);display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:1.5px solid transparent;transition:.2s}
.loc-bar:active{transform:scale(.99);border-color:#ded9f8}
.loc-text{font-size:13.5px;font-weight:600;color:#3b3b58;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.loc-edit{font-size:11px;color:#6C5CE7;background:#f2efff;padding:3px 9px;border-radius:8px;font-weight:700}
.dial-wrap{display:flex;justify-content:center;align-items:center;padding:46px 0 30px}
.dial{width:246px;height:246px;border-radius:50%;background:linear-gradient(150deg,#8B7BF0,#6C5CE7 45%,#5142C9);display:flex;align-items:center;justify-content:center;box-shadow:0 22px 48px rgba(108,92,231,.38),inset 0 -8px 24px rgba(0,0,0,.12);cursor:pointer;transition:.25s;position:relative;user-select:none}
.dial:active{transform:scale(.97)}
.dial.sleeping{background:linear-gradient(150deg,#2E4BA8,#1B2A6B 55%,#101B4A);box-shadow:0 22px 48px rgba(27,42,107,.45),inset 0 -8px 24px rgba(0,0,0,.25)}
.dial.sleeping::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(46,75,168,.28);animation:pulseRing 2.4s ease-out infinite}
@keyframes pulseRing{0%{transform:scale(.96);opacity:.9}100%{transform:scale(1.16);opacity:0}}
.dial-inner{text-align:center;color:#fff;position:relative;z-index:1;padding:0 14px}
.dial-timer{font-size:36px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s}
.dial-timer.over{color:#ff6b6b;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.dial-label{font-size:24px;font-weight:900;letter-spacing:3px;margin-top:12px}
.dial-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:8px;letter-spacing:1px}
.dial-tip{text-align:center;font-size:11.5px;color:#a0a0b6;line-height:1.7;padding:0 30px;min-height:32px}
.hint-line{font-size:12.5px;color:#7a7a92;line-height:2}

/* ============ 广场页 ============ */
.sq-tabs{display:flex;background:#fff;border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(30,30,60,.05);margin-bottom:14px}
.sq-tab{flex:1;text-align:center;font-size:12.5px;font-weight:700;color:#8a8aa0;padding:10px 4px;border-radius:10px;cursor:pointer;transition:.2s}
.sq-tab.on{background:linear-gradient(135deg,#7C6CF0,#5B4BD6);color:#fff;box-shadow:0 6px 14px rgba(108,92,231,.3)}
.board-list{background:#fff;border-radius:18px;padding:6px 14px;box-shadow:0 6px 20px rgba(30,30,60,.05)}
.rank-row{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #f4f4fa}
.rank-row:last-child{border-bottom:none}
.rank-row.me{background:linear-gradient(90deg,#f6f3ff,#fbfaff);border-radius:12px;padding-left:8px;padding-right:8px;margin:4px -6px;border-bottom:none}
.rank-no{width:26px;text-align:center;font-size:13px;font-weight:800;color:#b6b6cc;flex:none}
.rank-row:nth-child(1) .rank-no,.rank-row:nth-child(2) .rank-no,.rank-row:nth-child(3) .rank-no{font-size:18px}
.rank-av{width:34px;height:34px;border-radius:50%;background:#f4f2ff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.rank-name{flex:1;font-size:13.5px;font-weight:600;color:#3b3b58;display:flex;align-items:center;gap:6px;min-width:0}
.rank-name span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-tag{background:#6C5CE7;color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;flex:none}
.rank-val{font-size:14px;font-weight:800;color:#3b3b58;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-val.warn{color:#f03e3e}
.swap-btn{width:100%;margin-top:16px;border:none;background:#fff;border-radius:14px;padding:14px;font-size:13.5px;font-weight:700;color:#6C5CE7;cursor:pointer;box-shadow:0 6px 20px rgba(30,30,60,.05)}
.swap-btn:active{transform:scale(.99)}

/* ============ 我的页 ============ */
.profile-card{background:linear-gradient(140deg,#fff,#f8f6ff);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(30,30,60,.05)}
.avatar{width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,#8B7BF0,#5B4BD6);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;box-shadow:0 8px 18px rgba(108,92,231,.3)}
.pf-name{font-size:17px;font-weight:800;letter-spacing:.5px}
.pf-sub{font-size:11.5px;color:#8a8aa0;margin-top:5px;line-height:1.5}
.pf-edit{margin-left:auto;font-size:11px;font-weight:700;color:#6C5CE7;background:#f2efff;padding:8px 12px;border-radius:10px;cursor:pointer;flex:none}
.ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ach{background:#f7f7fd;border-radius:14px;padding:10px 4px 8px;text-align:center;position:relative;opacity:.42;filter:grayscale(1);transition:.25s;cursor:pointer}
.ach.on{opacity:1;filter:none;background:linear-gradient(160deg,#f2efff,#fff);box-shadow:0 4px 12px rgba(108,92,231,.12)}
.ach-icon{font-size:22px;line-height:1.2}
.ach-name{font-size:9.5px;font-weight:700;color:#5a5a72;margin-top:5px;line-height:1.25;letter-spacing:-.2px}
.ach-lock{position:absolute;top:4px;right:5px;font-size:9px}
.dev-entry{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#b0b0c4;font-weight:700;cursor:pointer;letter-spacing:1px}
.dev-entry span{font-size:11px;color:#c8c8da;font-weight:600}
.dev-body{margin-top:14px;padding-top:14px;border-top:1px dashed #ececf6}
.dev-body label{display:block;font-size:11.5px;color:#8a8aa0;font-weight:600;margin:12px 0 6px}
.dev-body label:first-child{margin-top:0}
.dev-body input{width:100%;border:1.5px solid #eceaf6;background:#fafaff;border-radius:11px;padding:11px 13px;font-size:14px;outline:none;color:#1c1c28}
.dev-body input:focus{border-color:#6C5CE7;background:#fff}
.disclaimer{font-size:10px;color:#b8b8ca;line-height:1.9;padding:22px 6px 10px;text-align:center}

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(15,15,35,.52);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:#fff;border-radius:22px;width:100%;max-width:370px;max-height:84vh;overflow-y:auto;padding:22px;animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{font-size:16px;font-weight:800;margin-bottom:6px;letter-spacing:.5px}
.modal-sub{font-size:12px;color:#9a9ab0;line-height:1.6;margin-bottom:14px}
.loc-item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:#f8f8fd;margin-bottom:9px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
.loc-item.on{border-color:#6C5CE7;background:#f4f1ff}
.loc-item:active{transform:scale(.99)}
.li-icon{font-size:19px;width:26px;text-align:center;flex:none}
.li-main{flex:1;min-width:0}
.li-name{font-size:13.5px;font-weight:700;color:#3b3b58;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sub{font-size:10.5px;color:#a8a8bc;margin-top:3px}
.li-check{font-size:14px;color:#6C5CE7;font-weight:800;opacity:0}
.loc-item.on .li-check{opacity:1}
.divider{font-size:11.5px;color:#a8a8bc;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.divider::after{content:"";flex:1;height:1px;background:#f0f0f8}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:11px;background:#f6f6fc;color:#7a7a92;cursor:pointer;border:1.5px solid transparent;transition:.15s}
.chip.on{background:#f2efff;color:#6C5CE7;border-color:#c9c0f8}
.gps-status{font-size:11.5px;color:#8a8aa0;line-height:1.6;margin-top:8px;min-height:16px}

/* 战报海报 */
.poster{background:linear-gradient(160deg,#1B2A6B,#2E4BA8 55%,#6C5CE7);border-radius:18px;padding:24px 20px;color:#fff;text-align:center;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-70px}
.poster-title{font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.7);font-weight:700}
.poster-num{font-size:48px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.poster-num small{font-size:16px;font-weight:700;opacity:.7;margin-left:4px}
.poster-date{font-size:11px;color:rgba(255,255,255,.62);letter-spacing:.5px}
.poster-loc{font-size:12px;color:rgba(255,255,255,.82);margin-top:12px}
.poster-line{height:1px;background:rgba(255,255,255,.16);margin:16px 0}
.poster-award{font-size:13px;line-height:1.8;color:rgba(255,255,255,.94);position:relative;z-index:1}
.poster-award b{font-size:15px;color:#ffd166}
.poster-foot{font-size:9.5px;color:rgba(255,255,255,.45);margin-top:16px;letter-spacing:1px}
.screenshot-tip{font-size:11.5px;color:#f59f00;background:#fff8e6;border-radius:11px;padding:10px 12px;text-align:center;margin-top:14px;font-weight:600;line-height:1.6}
.ad-emoji{font-size:52px;text-align:center;line-height:1}
.ad-modal h3{text-align:center;font-size:19px;margin:12px 0 8px;letter-spacing:1px}
.ad-modal p{text-align:center;font-size:13px;color:#6a6a82;line-height:1.8;margin:0}
.ad-modal p.small{font-size:11px;color:#b0b0c4;margin-top:10px}

/* ============ 底部 Tab ============ */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:64px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #ececf6;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#a8a8bc;transition:.2s}
.tab-item span{font-size:20px;line-height:1;filter:grayscale(.6);transition:.2s}
.tab-item b{font-size:10px;font-weight:700;letter-spacing:.5px}
.tab-item.on{color:#6C5CE7}
.tab-item.on span{filter:none;transform:translateY(-1px) scale(1.08)}
</style>
</head>
<body>
<div id="app">

  <!-- ================= 注册页 ================= -->
  <div id="registerScreen" class="screen">
    <div class="reg-wrap">
      <div class="reg-logo">😴</div>
      <div class="reg-title">校园睡</div>
      <div class="reg-sub">用校园跑的方式，认真睡觉</div>
      <div class="reg-card">
        <label>学校</label>
        <input id="regSchool" placeholder="例：霍格沃茨魔法学院" autocomplete="off">
        <label>学院</label>
        <input id="regCollege" placeholder="例：睡觉系" autocomplete="off">
        <label>学号</label>
        <input id="regId" placeholder="例：000000" autocomplete="off">
        <label>昵称</label>
        <input id="regNick" placeholder="例：匿名睡友" autocomplete="off">
        <button id="presetBtn" class="btn-ghost" onclick="fillPreset()">✨ 填入预设信息</button>
        <button class="btn-primary" onclick="doRegister()">进入校园睡</button>
        <p class="fine">本产品纯属娱乐，不接入任何教务系统<br>昵称可匿名，不强制真实姓名</p>
      </div>
    </div>
  </div>

  <!-- ================= 主界面 ================= -->
  <div id="mainScreen" class="screen hidden">
    <div class="page" id="page-progress"></div>
    <div class="page hidden" id="page-sleep"></div>
    <div class="page hidden" id="page-square"></div>
    <div class="page hidden" id="page-me"></div>

    <nav class="tabbar">
      <div class="tab-item" data-tab="progress" onclick="switchTab('progress')"><span>📊</span><b>进展</b></div>
      <div class="tab-item" data-tab="sleep" onclick="switchTab('sleep')"><span>😴</span><b>睡觉</b></div>
      <div class="tab-item" data-tab="square" onclick="switchTab('square')"><span>🏆</span><b>广场</b></div>
      <div class="tab-item" data-tab="me" onclick="switchTab('me')"><span>👤</span><b>我的</b></div>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
</div>

<script>
/* ==================================================================
   校园睡 · 纯前端娱乐睡眠打卡
   ================================================================== */

var LS_KEY = 'campus_sleep_v1';

var LOC_TYPES = {
  '宿舍': '🛏',
  '教学楼': '🏫',
  '食堂': '🍜',
  '图书馆': '📚',
  '操场': '🏃',
  '其他': '📍'
};

var PRESETS = [

/* ---------------- 小工具 ---------------- */
function $(s){ return document.querySelector(s); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}
function dateKey(ts){
  var d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function parseKey(k){
  var p = k.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]).getTime();
}
function fmtHMS(ms){
  var t = Math.max(0, Math.floor(ms / 1000));
  var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}
function fmtDur(ms){
  var m = Math.round(ms / 60000);
  var h = Math.floor(m / 60), mm = m % 60;
  return (h > 0 ? h + 'h ' : '') + mm + 'm';
}
function fmtDateTime(ts){
  var d = new Date(ts);
  return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function startOfWeek(ts){
  var d = new Date(ts);
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  return x.getTime();
}
/* 入睡时刻映射：把 0:00-11:59 视作次日，方便比较"早晚" */
function bedMinOf(ts){
  var d = new Date(ts);
  var m = d.getHours() * 60 + d.getMinutes();
  if (m < 720) m += 1440;
  return m;
}
function wakeMinOf(ts){
  var d = new Date(ts);
  var m = d.getHours() * 60 + d.getMinutes();
  if (m < 720) m += 1440;
  return m;
}
function minToHM(m){
  if (m == null || m === 9999) return '--';
  m = m % 1440;
  return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
}

/* ---------------- 单条记录计算 ---------------- */
function calcSession(s){
  var ms = Math.max(0, s.end - s.start);
  var hrs = ms / 3600000;
  var tooLong  = hrs > (+state.settings.maxSleep || 12);
  var tooShort = ms < (+state.settings.minSleep || 15) * 60000;
  return { ms: ms, hours: hrs, tooLong: tooLong, tooShort: tooShort, counted: !tooLong && !tooShort };
}

/* ---------------- 连续天数 ---------------- */
function streakInfo(){
  var daysSet = {};
  state.sessions.forEach(function(s){
    if (s.end) daysSet[dateKey(s.start)] = 1;
  });
  var days = Object.keys(daysSet).sort();
  if (!days.length) return { current: 0, max: 0 };

  var max = 1, run = 1;
  for (var i = 1; i < days.length; i++) {
    if (parseKey(days[i]) - parseKey(days[i-1]) === 86400000) { run++; if (run > max) max = run; }
    else run = 1;
  }

  var today = dateKey(Date.now());
  var yest  = dateKey(Date.now() - 86400000);
  var last  = days[days.length - 1];
  if (last !== today && last !== yest) return { current: 0, max: max };

  var cur = 1;
  for (var j = days.length - 1; j > 0; j--) {
    if (parseKey(days[j]) - parseKey(days[j-1]) === 86400000) cur++;
    else break;
  }
  return { current: cur, max: max };
}

/* ---------------- 统计 ---------------- */
function computeStats(){
  var all = state.sessions.filter(function(s){ return s.end; });
  var ss = state.settings.semesterStart;
  var se = state.settings.semesterEnd;
  var monday = startOfWeek(Date.now());

  var totalMs = 0, semMs = 0, weekMs = 0, count = all.length;
  var longest = 0, earliest = null, latest = null;

  all.forEach(function(s){
    var c = calcSession(s);
    totalMs += c.ms;

    var k = dateKey(s.start);
    var inSem = (!ss || k >= ss) && (!se || k <= se);
    if (inSem && c.counted) semMs += c.ms;

    if (s.start >= monday) {
      weekMs += c.ms;
      if (c.hours > longest) longest = c.hours;
      var b = bedMinOf(s.start);
      if (earliest === null || b < earliest) earliest = b;
      var w = wakeMinOf(s.end);
      if (latest === null || w > latest) latest = w;
    }
  });

  return {
    totalMs: totalMs, semMs: semMs, weekMs: weekMs, count: count,
    weekBest: { longest: longest, earliest: earliest, latest: latest }
  };
}
function totalMsAll(){
  return state.sessions.reduce(function(a, s){
    return a + (s.end ? Math.max(0, s.end - s.start) : 0);
  }, 0);
}

/* ---------------- 开始/结束睡眠 ---------------- */
function startSleep(){
  var loc = getCurrentLocation();
  if (!loc) {
    toast('请先选择你的睡眠位置');
    openLocPicker();
    return;
  }
  state.active = {
    start: Date.now(),
    locType: loc.type,
    locName: loc.name,
    coord: loc.coord || null
  };
  save();
  renderSleep();
  toast('开始睡觉，晚安 🌙');
}

function endSleep(){
  if (!state.active) return;
  var a = state.active;
  var end = Date.now();

  if (end - a.start < 60 * 1000) {
    if (!confirm('才睡了不到 1 分钟，确定要结束吗？')) return;
  }

  var s = {
    id: 's' + Date.now(),
    start: a.start,
    end: end,
    locType: a.locType,
    locName: a.locName
  };
  state.sessions.push(s);
  state.active = null;
  save();
  renderAll();
  showReport(s);
}

/* ==================================================================
   位置管理
   ================================================================== */
function openLocPicker(){
  pendingCoord = null;
  pendingType = '宿舍';
  renderLocPicker();
}

function renderLocPicker(){
  var listHtml = state.locations.map(function(l){
    return '<div class="loc-item ' + (l.id === state.currentLocId ? 'on' : '') + '" onclick="pickLoc(\'' + l.id + '\')">' +
      '<div class="li-icon">' + (LOC_TYPES[l.type] || '📍') + '</div>' +
      '<div class="li-main">' +
        '<div class="li-name">' + esc(l.type) + ' · ' + esc(l.name) + '</div>' +
        '<div class="li-sub">' + (l.coord ? '已绑定定位坐标（本地保存）' : '未绑定坐标') + '</div>' +
      '</div>' +
      '<div class="li-check">✓</div>' +
    '</div>';
  }).join('');

  if (!state.locations.length) {
    listHtml = '<div class="li-sub" style="padding:6px 2px 10px">还没有常用位置，先在下面添加一个吧</div>';
  }

  var chips = Object.keys(LOC_TYPES).map(function(t){
    return '<div class="chip ' + (t === pendingType ? 'on' : '') + '" onclick="selectLocType(\'' + t + '\')">' +
      LOC_TYPES[t] + ' ' + t + '</div>';
  }).join('');

  openModal(
    '<div class="modal-head">选择睡眠位置</div>' +
    '<div class="modal-sub">位置仅保存在本机浏览器，界面只显示类型和名称。</div>' +
    listHtml +
    '<div class="divider">新增常用位置</div>' +
    '<div class="type-chips">' + chips + '</div>' +
    '<input id="newLocName" placeholder="给位置起个名，如：3号楼402床" autocomplete="off" ' +
      'style="width:100%;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;color:#1c1c28">' +
    '<button class="btn-ghost" onclick="grabGPS()">📍 获取当前定位（可选，非强制）</button>' +
    '<div class="gps-status" id="gpsStatus"></div>' +
    '<button class="btn-primary" onclick="saveNewLoc()">保存并使用</button>' +
    (state.locations.length ? '<button class="btn-ghost" onclick="closeModal()">取消</button>' : '')
  );
}

function selectLocType(t){
  pendingType = t;
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(el){
    el.classList.toggle('on', el.textContent.indexOf(t) > -1);
  });
}

function grabGPS(){
  var el = document.getElementById('gpsStatus');
  if (!el) return;
  if (!navigator.geolocation) {
    el.textContent = '❌ 当前浏览器不支持定位，请手动选择位置类型并填写名称';
    return;
  }
  el.textContent = '定位中…';
  navigator.geolocation.getCurrentPosition(
    function(pos){
      pendingCoord = {
        lat: +pos.coords.latitude.toFixed(5),
        lng: +pos.coords.longitude.toFixed(5)
      };
      el.textContent = '✅ 已绑定坐标（仅保存在本地，界面不显示具体坐标）';
    },
    function(){
      pendingCoord = null;
      el.textContent = '❌ 定位失败或已拒绝授权，请手动选择位置类型并填写名称';
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

function saveNewLoc(){
  var input = document.getElementById('newLocName');
  var name = (input && input.value || '').trim();
  if (!name) { toast('给位置起个名字吧'); return; }

  var loc = {
    id: 'loc' + Date.now(),
    type: pendingType,
    name: name,
    coord: pendingCoord
  };
  state.locations.push(loc);
  state.currentLocId = loc.id;
  save();
  closeModal();
  renderSleep();
  renderMe();
  toast('位置已保存：' + loc.type + ' · ' + loc.name);
}

function pickLoc(id){
  state.currentLocId = id;
  save();
  closeModal();
  renderSleep();
  var l = getCurrentLocation();
  if (l) toast('当前位置：' + l.type + ' · ' + l.name);
}

/* ==================================================================
   广场
   ================================================================== */
function ensureBoard(){
  if (!state.board || !state.board.list || !state.board.list.length) {
    state.board = { list: genBoard() };
    save();
  }
}

function genBoard(){
  var names = V_NAMES.slice();
  for (var i = names.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = names[i]; names[i] = names[j]; names[j] = tmp;
  }
  var out = [];
  for (var k = 0; k < 14; k++) {
    out.push({
      id: 'v' + k,
      name: names[k],
      avatar: V_AVATARS[Math.floor(Math.random() * V_AVATARS.length)],
      maxSleep: +(4 + Math.random() * 13).toFixed(1),
      bedMin: Math.floor(1140 + Math.random() * 480),   // 19:00 ~ 03:00
      streak: Math.floor(Math.random() * 22)
    });
  }
  return out;
}

function buildBoardRows(tab){
  ensureBoard();
  var rows = state.board.list.map(function(v){
    return {
      id: v.id,
      name: v.name,
      avatar: v.avatar,
      isMe: false,
      value: tab === 'duration' ? v.maxSleep : (tab === 'early' ? v.bedMin : v.streak)
    };
  });

  var all = state.sessions.filter(function(s){ return s.end; });
  var myMax = 0;
  all.forEach(function(s){
    var h = calcSession(s).hours;
    if (h > myMax) myMax = h;
  });
  var myBed = null;
  all.forEach(function(s){
    var b = bedMinOf(s.start);
    if (myBed === null || b < myBed) myBed = b;
  });
  var myStreak = streakInfo().current;

  var myValue;
  if (tab === 'duration') myValue = myMax;
  else if (tab === 'early') myValue = (myBed === null ? 9999 : myBed);
  else myValue = myStreak;

  rows.push({
    id: 'me',
    name: state.user.nickname,
    avatar: '😴',
    isMe: true,
    value: myValue,
    hasData: all.length > 0
  });

  rows.sort(function(a, b){
    return tab === 'early' ? a.value - b.value : b.value - a.value;
  });
  return rows;
}

function renderSquare(){
  ensureBoard();
  var tab = state.boardTab;
  var rows = buildBoardRows(tab);

  var html = rows.map(function(r, i){
    var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    var valHtml = '', warnCls = '';

    if (!r.isMe || r.hasData !== false) {
      if (tab === 'duration') {
        if (r.value > 0) {
          valHtml = r.value.toFixed(1) + 'h';
          if (r.value > (+state.settings.maxSleep || 12)) { valHtml += ' ⚠️'; warnCls = 'warn'; }
        } else valHtml = '--';
      } else if (tab === 'early') {
        valHtml = (r.value >= 9999 || r.value === 0) ? '--' : minToHM(r.value);
      } else {
        valHtml = r.value > 0 ? r.value + '天' : '--';
      }
    } else {
      valHtml = '--';
    }

    return '<div class="rank-row ' + (r.isMe ? 'me' : '') + '">' +
      '<div class="rank-no">' + medal + '</div>' +
      '<div class="rank-av">' + r.avatar + '</div>' +
      '<div class="rank-name"><span class="nm">' + esc(r.name) + '</span>' +
        (r.isMe ? '<span class="me-tag">我</span>' : '') + '</div>' +
      '<div class="rank-val ' + warnCls + '">' + valHtml + '</div>' +
    '</div>';
  }).join('');

  $('#page-square').innerHTML =
  '<div class="page-inner">' +
    '<div class="topbar">' +
      '<div>' +
        '<div class="hi">广场</div>' +
        '<div class="hi-sub">虚拟睡友，仅供娱乐</div>' +
      '</div>' +
    '</div>' +

    '<div class="sq-tabs">' +
      '<div class="sq-tab ' + (tab === 'duration' ? 'on' : '') + '" onclick="setBoardTab(\'duration\')">睡眠时长榜</div>' +
      '<div class="sq-tab ' + (tab === 'early' ? 'on' : '') + '" onclick="setBoardTab(\'early\')">最早入睡榜</div>' +
      '<div class="sq-tab ' + (tab === 'streak' ? 'on' : '') + '" onclick="setBoardTab(\'streak\')">连续天数榜</div>' +
    '</div>' +

    '<div class="board-list">' + html + '</div>' +

    '<button class="swap-btn" onclick="swapBoard()">🔄 换一批睡友</button>' +
    '<div class="foot-note">榜单数据为随机生成的虚拟数据<br>换一批后本轮榜单将固定保存</div>' +
  '</div>';
}

function setBoardTab(t){
  state.boardTab = t;
  save();
  renderSquare();
}

function swapBoard(){
  state.board = { list: genBoard() };
  save();
  renderSquare();
  toast('已换一批睡友 🔄');
}

function saveSettings(){
  var t  = +document.getElementById('setTarget').value;
  var mx = +document.getElementById('setMax').value;
  var mn = +document.getElementById('setMin').value;

  if (t > 0)  state.settings.target   = t;
  if (mx > 0) state.settings.maxSleep = mx;
  if (mn >= 0) state.settings.minSleep = mn;
  state.settings.semesterStart = document.getElementById('setStart').value || '';
  state.settings.semesterEnd   = document.getElementById('setEnd').value || '';

  save();
  renderAll();
  devOpen = true;
  renderMe();
  toast('设置已保存 ✅');
}

function clearAll(){
  if (!confirm('确定清空全部睡眠记录吗？此操作不可恢复。')) return;
  state.sessions = [];
  state.active = null;
  state.showAllRecords = false;
  save();
  renderAll();
  toast('记录已清空');
}

/* ==================================================================
   实时计时器
   ================================================================== */
setInterval(function(){
  if (!state.active) return;
  var el = document.getElementById('dialTimer');
  if (!el) return;

  var ms = Date.now() - state.active.start;
  el.textContent = fmtHMS(ms);

  var maxH = +state.settings.maxSleep || 12;
  var over = ms / 3600000 > maxH;
  el.classList.toggle('over', over);

  var tip = document.getElementById('dialTip');
  if (tip) {
    tip.textContent = over
      ? '⚠️ 已超过上限，本次将按「昏迷」记录，不计入学期成绩'
      : '注意：单次睡眠上限 ' + maxH + ' 小时，超时将按「昏迷」处理。';
  }
}, 500);

/* ==================================================================
   启动
   ================================================================== */
(function init(){
  load();
  if (state.user) {
    renderAll();
  } else {
    $('#registerScreen').classList.remove('hidden');
    $('#mainScreen').classList.add('hidden');
  }
  // 防意外退出丢失进行中的睡眠：每次进入都检查
  if (state.active) {
    var hrs = (Date.now() - state.active.start) / 3600000;
    if (hrs > 48) {
      // 极端异常情况（电脑长期挂起），提示用户
      setTimeout(function(){ toast('检测到一条超长睡眠记录，记得去结账 😴'); }, 800);
    }
  }
})();

window.addEventListener('beforeunload', save);
