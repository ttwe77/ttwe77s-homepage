<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>校园睡</title>
    <script type="module">
        import { BAClickFX } from '/libs/ba-click-fx.js';
        const fx = new BAClickFX();
        fx.setCompositingReference({ hostCompositing: 'screen' });
        fx.setThemeColor('#80c1ff');
    </script>
    <link rel="icon" href="/tools/app/src/campus-sleep.svg">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #e9eaf2;
            color: #1c1c28
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f2f3f8;
            position: relative;
            overflow-x: hidden
        }

        .hidden {
            display: none !important
        }

        input,
        button {
            font-family: inherit
        }

        ::-webkit-scrollbar {
            width: 0
        }

        /* ============ 通用 ============ */
        .page {
            padding-bottom: 92px;
            min-height: 100vh
        }

        /* ==== 页面切换动画 ==== */
        .page.page-in {
            animation: pageIn .5s cubic-bezier(.22, .9, .3, 1) both;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translate3d(0, 0, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* 无障碍：系统开启"减少动态效果"时直接关掉 */
        @media (prefers-reduced-motion: reduce) {
            .page.page-in {
                animation: none !important;
            }
        }

        .page-inner {
            padding: 16px 16px 0
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05);
            margin-top: 14px
        }

        .card-head {
            font-size: 13px;
            font-weight: 700;
            color: #5a5a72;
            margin-bottom: 12px;
            letter-spacing: .5px
        }

        .mt {
            margin-top: 14px
        }

        .btn-primary {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #7C6CF0, #5B4BD6);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 15px;
            border-radius: 14px;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, .28);
            transition: .15s
        }

        .btn-primary:active {
            transform: scale(.98)
        }

        .btn-ghost {
            width: 100%;
            border: 1.5px dashed #d6d2ee;
            background: #faf9ff;
            color: #6C5CE7;
            font-size: 14px;
            font-weight: 600;
            padding: 13px;
            border-radius: 14px;
            margin-top: 10px;
            cursor: pointer;
            transition: .15s
        }

        .btn-ghost:active {
            transform: scale(.98)
        }

        .btn-ghost.danger {
            color: #e03131;
            border-color: #ffd6d6;
            background: #fff5f5
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(28, 28, 40, .92);
            color: #fff;
            font-size: 13px;
            padding: 10px 18px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 500;
            white-space: nowrap;
            max-width: 90vw
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        /* ============ 注册 ============ */
        .reg-wrap {
            padding: 46px 20px 40px
        }

        .reg-logo {
            font-size: 58px;
            text-align: center;
            line-height: 1;
            filter: drop-shadow(0 8px 16px rgba(108, 92, 231, .3))
        }

        .reg-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin: 12px 0 6px;
            letter-spacing: 3px
        }

        .reg-sub {
            text-align: center;
            color: #8a8aa0;
            font-size: 13px;
            margin-bottom: 26px
        }

        .reg-card {
            background: #fff;
            border-radius: 22px;
            padding: 22px 18px;
            box-shadow: 0 10px 34px rgba(30, 30, 60, .08)
        }

        .reg-card label {
            display: block;
            font-size: 12px;
            color: #8a8aa0;
            margin: 14px 0 6px;
            font-weight: 600;
            letter-spacing: .5px
        }

        .reg-card label:first-child {
            margin-top: 0
        }

        .reg-card input {
            width: 100%;
            border: 1.5px solid #eceaf6;
            background: #fafaff;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            transition: .2s;
            color: #1c1c28
        }

        .reg-card input:focus {
            border-color: #6C5CE7;
            background: #fff
        }

        .fine {
            font-size: 11px;
            color: #a8a8bc;
            text-align: center;
            line-height: 1.7;
            margin: 16px 0 0
        }

        /* ============ 顶部栏 ============ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px 14px
        }

        .hi {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: .5px
        }

        .hi-sub {
            font-size: 12px;
            color: #8a8aa0;
            margin-top: 4px
        }

        .logo-mini {
            font-size: 28px;
            line-height: 1
        }

        /* ============ 进展页 ============ */
        .hero-card {
            background: linear-gradient(150deg, #6C5CE7, #8B7BF0 60%, #9F8CF5);
            border-radius: 22px;
            padding: 22px 20px 18px;
            color: #fff;
            box-shadow: 0 14px 32px rgba(108, 92, 231, .32);
            position: relative;
            overflow: hidden
        }

        .hero-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .09);
            right: -70px;
            top: -80px
        }

        .hero-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            position: relative;
            z-index: 1
        }

        .hero-num {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2.5px;
            font-variant-numeric: tabular-nums
        }

        .hero-goal {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, .75);
            line-height: 1.3
        }

        .hero-goal span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255, 255, 255, .55);
            margin-top: 2px;
            letter-spacing: 1px
        }

        .hero-bar {
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .22);
            margin: 16px 0 14px;
            overflow: hidden
        }

        .hero-bar i {
            display: block;
            height: 100%;
            border-radius: 6px;
            background: #fff;
            transition: width .5s ease
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 1
        }

        .hero-meta>div {
            display: flex;
            flex-direction: column;
            gap: 3px
        }

        .hero-meta b {
            font-size: 17px;
            font-weight: 800;
            font-variant-numeric: tabular-nums
        }

        .hero-meta span {
            font-size: 10.5px;
            color: rgba(255, 255, 255, .62)
        }

        .tip-banner {
            margin-top: 14px;
            border: 1.5px solid #b6e8d2;
            background: #effcf6;
            border-radius: 16px;
            padding: 14px 16px
        }

        .tip-banner>div {
            font-size: 13.5px;
            font-weight: 600;
            color: #0e7a56;
            line-height: 1.5
        }

        .tip-banner button {
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #22c98d, #12b886);
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            padding: 11px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(18, 184, 134, .28)
        }

        .tip-banner button:active {
            transform: scale(.98)
        }

        .best-row {
            display: flex;
            gap: 10px
        }

        .best-box {
            flex: 1;
            background: #f7f7fd;
            border-radius: 14px;
            padding: 14px 6px;
            text-align: center
        }

        .best-box .bv {
            font-size: 17px;
            font-weight: 800;
            color: #3b3b58;
            font-variant-numeric: tabular-nums
        }

        .best-box .bl {
            font-size: 10.5px;
            color: #9a9ab0;
            margin-top: 6px
        }

        .notice-banner {
            margin-top: 14px;
            border-radius: 18px;
            padding: 18px 18px;
            background: linear-gradient(115deg, #ff7a59, #ff9f43 55%, #ffd166);
            color: #fff;
            box-shadow: 0 12px 28px rgba(255, 122, 89, .32);
            cursor: pointer;
            position: relative;
            overflow: hidden
        }

        .notice-banner::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .16);
            right: -50px;
            bottom: -70px
        }

        .notice-main {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(180, 60, 0, .2)
        }

        .notice-sub {
            font-size: 12px;
            margin-top: 7px;
            opacity: .92;
            font-weight: 600
        }

        .rec-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 0;
            border-bottom: 1px solid #f2f2f8
        }

        .rec-row:last-child {
            border-bottom: none
        }

        .rec-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #f4f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex: none
        }

        .rec-main {
            flex: 1;
            min-width: 0
        }

        .rec-date {
            font-size: 12.5px;
            font-weight: 600;
            color: #3b3b58
        }

        .rec-loc {
            font-size: 11px;
            color: #9a9ab0;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .rec-val {
            font-size: 14px;
            font-weight: 800;
            color: #3b3b58;
            font-variant-numeric: tabular-nums;
            text-align: right
        }

        .rec-val.bad {
            color: #f03e3e
        }

        .rec-val.warn {
            color: #f59f00
        }

        .rec-tag {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 4px;
            vertical-align: middle
        }

        .rec-tag.bad {
            background: #ffe3e3;
            color: #f03e3e
        }

        .rec-tag.warn {
            background: #fff4e0;
            color: #e8890c
        }

        .foot-note {
            text-align: center;
            font-size: 10.5px;
            color: #b0b0c4;
            padding: 22px 0 10px;
            letter-spacing: .5px
        }

        /* ============ 睡觉页 ============ */
        .loc-bar {
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: .2s
        }

        .loc-bar:active {
            transform: scale(.99);
            border-color: #ded9f8
        }

        .loc-text {
            font-size: 13.5px;
            font-weight: 600;
            color: #3b3b58;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap
        }

        .loc-edit {
            font-size: 11px;
            color: #6C5CE7;
            background: #f2efff;
            padding: 3px 9px;
            border-radius: 8px;
            font-weight: 700
        }

        .loc-quick {
            width: 100%;
            margin-top: 10px;
            border: 1.5px dashed #d6d2ee;
            background: #faf9ff;
            color: #6C5CE7;
            font-size: 13px;
            font-weight: 700;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: .15s
        }

        .loc-quick:active {
            transform: scale(.99)
        }

        .loc-quick:disabled {
            opacity: .55;
            cursor: not-allowed;
            background: #f3f3f8;
            color: #a8a8bc;
            border-color: #e6e6f0
        }

        .dial-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 46px 0 30px
        }

        .dial {
            width: 246px;
            height: 246px;
            border-radius: 50%;
            background: linear-gradient(150deg, #8B7BF0, #6C5CE7 45%, #5142C9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 22px 48px rgba(108, 92, 231, .38), inset 0 -8px 24px rgba(0, 0, 0, .12);
            cursor: pointer;
            transition: .25s;
            position: relative;
            user-select: none
        }

        .dial:active {
            transform: scale(.97)
        }

        .dial.sleeping {
            background: linear-gradient(150deg, #2E4BA8, #1B2A6B 55%, #101B4A);
            box-shadow: 0 22px 48px rgba(27, 42, 107, .45), inset 0 -8px 24px rgba(0, 0, 0, .25)
        }

        .dial.sleeping::before {
            content: "";
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid rgba(46, 75, 168, .28);
            animation: pulseRing 2.4s ease-out infinite
        }

        @keyframes pulseRing {
            0% {
                transform: scale(.96);
                opacity: .9
            }

            100% {
                transform: scale(1.16);
                opacity: 0
            }
        }

        .dial-inner {
            text-align: center;
            color: #fff;
            position: relative;
            z-index: 1;
            padding: 0 14px
        }

        .dial-timer {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            transition: color .3s
        }

        .dial-timer.over {
            color: #ff6b6b;
            animation: blink 1.2s infinite
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .45
            }
        }

        .dial-label {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-top: 12px
        }

        .dial-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, .6);
            margin-top: 8px;
            letter-spacing: 1px
        }

        .dial-tip {
            text-align: center;
            font-size: 11.5px;
            color: #a0a0b6;
            line-height: 1.7;
            padding: 0 30px;
            min-height: 32px
        }

        .hint-line {
            font-size: 12.5px;
            color: #7a7a92;
            line-height: 2
        }

        /* ============ 广场页 ============ */
        .sq-tabs {
            display: flex;
            background: #fff;
            border-radius: 14px;
            padding: 5px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05);
            margin-bottom: 14px
        }

        .sq-tab {
            flex: 1;
            text-align: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #8a8aa0;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s
        }

        .sq-tab.on {
            background: linear-gradient(135deg, #7C6CF0, #5B4BD6);
            color: #fff;
            box-shadow: 0 6px 14px rgba(108, 92, 231, .3)
        }

        .board-list {
            background: #fff;
            border-radius: 18px;
            padding: 6px 14px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05)
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px 2px;
            border-bottom: 1px solid #f4f4fa
        }

        .rank-row:last-child {
            border-bottom: none
        }

        .rank-row.me {
            background: linear-gradient(90deg, #f6f3ff, #fbfaff);
            border-radius: 12px;
            padding-left: 8px;
            padding-right: 8px;
            margin: 4px -6px;
            border-bottom: none
        }

        .rank-no {
            width: 26px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #b6b6cc;
            flex: none
        }

        .rank-row:nth-child(1) .rank-no,
        .rank-row:nth-child(2) .rank-no,
        .rank-row:nth-child(3) .rank-no {
            font-size: 18px
        }

        .rank-av {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f4f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex: none
        }

        .rank-name {
            flex: 1;
            font-size: 13.5px;
            font-weight: 600;
            color: #3b3b58;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0
        }

        .rank-name span.nm {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .me-tag {
            background: #6C5CE7;
            color: #fff;
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            flex: none
        }

        .rank-val {
            font-size: 14px;
            font-weight: 800;
            color: #3b3b58;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .rank-val.warn {
            color: #f03e3e
        }

        .swap-btn {
            width: 100%;
            margin-top: 16px;
            border: none;
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            font-size: 13.5px;
            font-weight: 700;
            color: #6C5CE7;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05)
        }

        .swap-btn:active {
            transform: scale(.99)
        }

        /* ---- 广场 · 睡友动态 ---- */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .feed-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px 15px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05)
        }

        .feed-top {
            display: flex;
            align-items: center;
            gap: 9px
        }

        .feed-av {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f4f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex: none
        }

        .feed-owner {
            flex: 1;
            min-width: 0
        }

        .feed-name {
            font-size: 13px;
            font-weight: 700;
            color: #3b3b58;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .feed-time {
            font-size: 10.5px;
            color: #a8a8bc;
            margin-top: 2px
        }

        .feed-tag {
            background: #f2efff;
            color: #6C5CE7;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 7px;
            flex: none
        }

        .feed-text {
            font-size: 13px;
            color: #4a4a66;
            line-height: 1.75;
            margin-top: 10px;
            word-break: break-word
        }

        /* 长动态折叠：默认 6 行 */
        .feed-text.folded {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 6;
            line-clamp: 6;
            overflow: hidden;
        }

        .feed-expand {
            display: block;
            margin: 8px 0 0;
            padding: 4px 2px;
            border: none;
            background: none;
            color: #6C5CE7;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .feed-expand:active {
            opacity: .65
        }

        .feed-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 11px;
            font-size: 11px;
            color: #a8a8bc
        }

        /* ---- 广场 · 动态互动（点赞 / 踩 / 举报） ---- */
        .feed-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 11px;
            padding-top: 10px;
            border-top: 1px dashed #f2f2f8;
            overflow: hidden
        }

        .feed-act {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: none;
            background: #f7f7fd;
            color: #9a9ab0;
            font-size: 11.5px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
            transition: .15s;
            font-family: inherit
        }

        .feed-act:active {
            transform: scale(.94)
        }

        .feed-act.on {
            background: #f2efff;
            color: #6C5CE7
        }

        .feed-act.on.down {

        /* ============ 我的页 ============ */
        .profile-card {

            align-items: center;

        .avatar {

        .pf-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: .5px
        }

        .pf-sub {
            font-size: 11.5px;
            color: #8a8aa0;
            margin-top: 5px;
            line-height: 1.5
        }

        .pf-edit {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: #6C5CE7;
            background: #f2efff;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            flex: none
        }

        .ach-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        .ach {
            background: #f7f7fd;
            border-radius: 14px;
            padding: 10px 4px 8px;
            text-align: center;
            position: relative;
            opacity: .42;
            filter: grayscale(1);
            transition: .25s;
            cursor: pointer
        }

        .ach.on {
            opacity: 1;
            filter: none;
            background: linear-gradient(160deg, #f2efff, #fff);
            box-shadow: 0 4px 12px rgba(108, 92, 231, .12)
        }

        .ach-icon {
            font-size: 22px;
            line-height: 1.2
        }

        .ach-name {
            font-size: 9.5px;
            font-weight: 700;
            color: #5a5a72;
            margin-top: 5px;
            line-height: 1.25;
            letter-spacing: -.2px
        }

        .ach-lock {
            position: absolute;
            top: 4px;
            right: 5px;
            font-size: 9px
        }

        .dev-entry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12.5px;
            color: #b0b0c4;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px
        }

        .dev-entry span {
            font-size: 11px;
            color: #c8c8da;
            font-weight: 600
        }

        .dev-body {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #ececf6
        }

        .dev-body label {
            display: block;
            font-size: 11.5px;
            color: #8a8aa0;
            font-weight: 600;
            margin: 12px 0 6px
        }

        .dev-body label:first-child {
            margin-top: 0
        }

        .dev-body input {
            width: 100%;
            border: 1.5px solid #eceaf6;
            background: #fafaff;
            border-radius: 11px;
            padding: 11px 13px;
            font-size: 14px;
            outline: none;
            color: #1c1c28
        }

        .dev-body input:focus {
            border-color: #6C5CE7;
            background: #fff
        }

        /* ---- 折叠面板：展开 / 收起动画 ---- */
        .collapse {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 1.5s cubic-bezier(.22, .9, .3, 1);
        }

        .collapse.open {
            grid-template-rows: 1fr;
        }

        .collapse>.collapse-inner {
            overflow: hidden;
            min-height: 0;
        }

        /* 无障碍：系统开启「减少动态效果」时直接关掉 */
        @media (prefers-reduced-motion: reduce) {
            .collapse {
                transition: none !important;
            }
        }

        .disclaimer {
            font-size: 10px;
            color: #b8b8ca;
            line-height: 1.9;
            padding: 22px 6px 10px;
            text-align: center
        }

        /* ---- 关于列表 ---- */
        .about-list {
            padding-top: 12px
        }

        .about-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 2px;
            border-bottom: 1px solid #f4f4fa;
            font-size: 12.5px;
            color: #5a5a72;
            line-height: 1.6;
            text-decoration: none;

        }

        .about-item:last-child {

        a.about-item:hover {
            color: #6C5CE7
        }

        .about-item .ai-icon {
            flex: none;
            width: 18px;
            text-align: center;
            font-size: 14px
        }

        .about-item .ai-text {
            flex: 1;
            min-width: 0;
            word-break: break-all
        }

        .about-item .ai-arrow {
            flex: none;
            font-size: 11px;
            color: #c0c0d0
        }

        /* ============ 弹窗 ============ */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 35, .52);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
            animation: fadeIn .2s
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .modal-card {
            background: #fff;
            border-radius: 22px;
            width: 100%;
            max-width: 370px;
            max-height: 84vh;
            overflow-y: auto;
            padding: 22px;
            animation: pop .26s cubic-bezier(.2, .9, .3, 1.2)
        }

        @keyframes pop {
            from {
                transform: scale(.9);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .modal-head {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: .5px
        }

        .modal-sub {
            font-size: 12px;
            color: #9a9ab0;
            line-height: 1.6;
            margin-bottom: 14px
        }

        /* 举报理由列表：限高独立滚动，滚动条明显可见 */
        .report-reasons {
            max-height: 44vh;
            overflow-y: auto;
            margin: 0 -4px;
            padding: 2px 4px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;

            /* 右侧留出一条滚动条专用位，避免遮住内容 */
            scrollbar-width: thin;
            /* Firefox */
            scrollbar-color: #6C5CE7 #eceaf6;
            /* Firefox：滑块 / 轨道 */
        }

        /* WebKit：把被全局隐藏的滚动条重新显示出来 */
        .report-reasons::-webkit-scrollbar {
            width: 8px;
        }

        .report-reasons::-webkit-scrollbar-track {
            background: #eceaf6;
            border-radius: 8px;
        }

        .report-reasons::-webkit-scrollbar-thumb {
            background: linear-gradient(#8B7BF0, #6C5CE7);
            border-radius: 8px;
            border: 2px solid #eceaf6;
            /* 让滑块细一点、有留白 */
            background-clip: padding-box;
        }

        .report-reasons::-webkit-scrollbar-thumb:hover {
            background: #5B4BD6;
            background-clip: padding-box;
        }

        .report-reasons .loc-item:last-child {
            margin-bottom: 0;
        }

        .loc-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px;
            border-radius: 14px;
            background: #f8f8fd;
            margin-bottom: 9px;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: .15s
        }

        .loc-item.on {
            border-color: #6C5CE7;
            background: #f4f1ff
        }

        .loc-item:active {
            transform: scale(.99)
        }

        .li-icon {
            font-size: 19px;
            width: 26px;
            text-align: center;
            flex: none
        }

        .li-main {
            flex: 1;
            min-width: 0
        }

        .li-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #3b3b58;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .li-sub {
            font-size: 10.5px;
            color: #a8a8bc;
            margin-top: 3px
        }

        .li-check {
            font-size: 14px;
            color: #6C5CE7;
            font-weight: 800;
            opacity: 0
        }

        .loc-item.on .li-check {
            opacity: 1
        }

        .divider {
            font-size: 11.5px;
            color: #a8a8bc;
            font-weight: 700;
            margin: 16px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #f0f0f8
        }

        .type-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px
        }

        .chip {
            font-size: 12.5px;
            font-weight: 700;
            padding: 9px 13px;
            border-radius: 11px;
            background: #f6f6fc;
            color: #7a7a92;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: .15s
        }

        .chip.on {
            background: #f2efff;
            color: #6C5CE7;
            border-color: #c9c0f8
        }

        .gps-status {
            font-size: 11.5px;
            color: #8a8aa0;
            line-height: 1.6;
            margin-top: 8px;
            min-height: 16px
        }

        /* 战报海报 */
        .poster {
            background: linear-gradient(160deg, #1B2A6B, #2E4BA8 55%, #6C5CE7);
            border-radius: 18px;
            padding: 24px 20px;
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden
        }

        .poster::after {
            content: "";
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            right: -60px;
            top: -70px
        }

        .poster-title {
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, .7);
            font-weight: 700
        }

        .poster-num {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1;
            margin: 14px 0 4px;
            font-variant-numeric: tabular-nums;
            position: relative;
            z-index: 1
        }

        .poster-num small {
            font-size: 16px;
            font-weight: 700;
            opacity: .7;
            margin-left: 4px
        }

        .poster-date {
            font-size: 11px;
            color: rgba(255, 255, 255, .62);
            letter-spacing: .5px
        }

        .poster-loc {
            font-size: 12px;
            color: rgba(255, 255, 255, .82);
            margin-top: 12px
        }

        .poster-line {
            height: 1px;
            background: rgba(255, 255, 255, .16);
            margin: 16px 0
        }

        .poster-award {
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255, 255, 255, .94);
            position: relative;
            z-index: 1
        }

        .poster-award b {
            font-size: 15px;
            color: #ffd166
        }

        .poster-foot {
            font-size: 9.5px;
            color: rgba(255, 255, 255, .45);
            margin-top: 16px;
            letter-spacing: 1px
        }

        .screenshot-tip {
            font-size: 11.5px;
            color: #f59f00;
            background: #fff8e6;
            border-radius: 11px;
            padding: 10px 12px;
            text-align: center;
            margin-top: 14px;
            font-weight: 600;
            line-height: 1.6
        }

        .notice-emoji {
            font-size: 52px;
            text-align: center;
            line-height: 1
        }

        .notice-modal h3 {
            text-align: center;
            font-size: 19px;
            margin: 12px 0 8px;
            letter-spacing: 1px
        }

        .notice-modal p {
            text-align: center;
            font-size: 13px;
            color: #6a6a82;
            line-height: 1.8;
            margin: 0
        }

        .notice-modal p.small {
            font-size: 11px;
            color: #b0b0c4;
            margin-top: 10px
        }

        /* ============ 底部 Tab ============ */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 64px;
            background: rgba(255, 255, 255, .97);
            backdrop-filter: blur(12px);
            border-top: 1px solid #ececf6;
            display: flex;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom)
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            color: #a8a8bc;
            transition: .2s
        }

        .tab-item span {
            font-size: 20px;
            line-height: 1;
            filter: grayscale(.6);
            transition: .2s
        }

        .tab-item b {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px
        }

        .tab-item.on {
            color: #6C5CE7
        }

        .tab-item.on span {
            filter: none;
            transform: translateY(-1px) scale(1.08)
        }

        .li-main {
            cursor: pointer
        }

        .li-op {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            border: none;
            background: #eef0ff;
            color: #5B4BD6;
            font-size: 13px;
            cursor: pointer;
            flex: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1
        }

        .li-op.danger {
            background: #fff0f0;
            color: #e03131
        }

        .li-op:active {
            transform: scale(.93)
        }

        .coord-row {
            display: flex;
            gap: 9px
        }

        .coord-row>div {
            flex: 1;
            min-width: 0
        }

        .coord-row label {
            display: block;
            font-size: 11px;
            color: #8a8aa0;
            font-weight: 600;
            margin: 0 0 6px
        }

        .coord-row input {
            width: 100%;
            border: 1.5px solid #eceaf6;
            background: #fafaff;
            border-radius: 11px;
            padding: 11px 12px;
            font-size: 13.5px;
            outline: none;
            color: #1c1c28
        }

        .coord-row input:focus {
            border-color: #6C5CE7;
            background: #fff
        }

        .nearby-tip {
            font-size: 12.5px;
            color: #0e7a56;
            background: #effcf6;
            border: 1.5px solid #b6e8d2;
            border-radius: 12px;
            padding: 10px 12px;
            margin-top: 10px;
            line-height: 1.6
        }

        /* ---- 位置列表空状态 & 添加引导 ---- */
        .loc-empty {
            background: #f7f6ff;
            border: 1.5px dashed #cfc7f5;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            margin: 2px 0 4px
        }

        .loc-empty .le-icon {
            font-size: 34px;
            line-height: 1
        }

        .loc-empty .le-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #5B4BD6;
            margin-top: 10px
        }

        .loc-empty .le-sub {
            font-size: 11.5px;
            color: #9a9ab0;
            line-height: 1.8;
            margin-top: 7px
        }

        .add-loc-big {
            width: 100%;
            margin-top: 14px;
            border: 1.5px dashed #b9b0f0;
            background: linear-gradient(135deg, #f4f1ff, #fbfaff);
            color: #6C5CE7;
            font-size: 15px;
            font-weight: 800;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .15s
        }

        .add-loc-big:active {
            transform: scale(.98);
            background: #efeaff
        }

        /* ---- 新建位置窗口：弱化 GPS ---- */
        .opt-label {
            font-size: 11px;
            color: #b0b0c4;
            font-weight: 600;
            margin: 16px 0 0;
            letter-spacing: .3px
        }

        .adv-entry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #8a8aa0;
            font-weight: 600;
            cursor: pointer;
            padding: 13px 0 9px;
            margin-top: 14px;
            border-top: 1px dashed #ececf6;
        }

        .adv-entry span:last-child {
            font-size: 10px;
            color: #b0b0c4;
        }

        .gps-link {
            width: 100%;
            margin-top: 6px;
            border: none;
            background: none;
            color: #b0b0c4;
            font-size: 12px;
            font-weight: 600;
            padding: 9px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px
        }

        .gps-link:active {
            color: #6C5CE7
        }

        /* ---- 睡觉页无位置时的醒目引导 ---- */
        .loc-bar.empty {
            border-color: #cfc7f5;
            border-style: dashed;
            background: #faf9ff
        }

        /* ============ 备案信息 ============ */
        .beian-foot {
            text-align: center;
            font-size: 10px;
            line-height: 1.8;
            color: #b8b8ca;
            padding: 0 6px 18px;
        }

        .beian-foot a {
            color: #b8b8ca;
            text-decoration: none;
            transition: color .2s ease;
        }

        .beian-foot a:hover {
            color: #6C5CE7;
        }

        .beian-sep {
            margin: 0 6px;
            color: #d0d0e0;
            user-select: none;
        }

        .beian-police {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            vertical-align: middle;
        }

        .beian-police img {
            display: block;
            height: 12px;
            width: auto;
            flex: 0 0 auto;
        }

        #registerScreen:not(.hidden) {
            animation: pageIn .3s cubic-bezier(.22, .9, .3, 1) both;
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- ================= 注册页 ================= -->
        <div id="registerScreen" class="screen">
            <div class="reg-wrap">
                <div class="reg-logo">😴</div>
                <div class="reg-title">校园睡</div>
                <div class="reg-sub">用校园跑的方式，认真睡觉</div>
                <div class="reg-card">
                    <label>学校</label>
                    <input id="regSchool" placeholder="例：霍格沃茨魔法学校" autocomplete="off">
                    <label>学院</label>
                    <input id="regCollege" placeholder="例：赫奇帕奇学院" autocomplete="off">
                    <label>学号</label>
                    <input id="regId" placeholder="例：777777" autocomplete="off">
                    <label>昵称</label>
                    <input id="regNick" placeholder="例：匿名睡友" autocomplete="off">
                    <button id="presetBtn" class="btn-ghost" onclick="fillPreset()">✨ 填入预设信息</button>
                    <button class="btn-primary" onclick="doRegister()">进入校园睡</button>
                    <p class="fine">本产品纯属娱乐，不接入任何教务系统<br>昵称可匿名，不强制真实姓名</p>
                    <div class="beian-foot" style="margin-top:14px;padding-bottom:0">
                        <a href="https://beian.miit.gov.cn/" target="_blank"
                            rel="noopener noreferrer">桂ICP备2026023217号-1</a>
                        <span class="beian-sep">/</span>
                        <a class="beian-police" href="https://beian.mps.gov.cn/#/query/webSearch?code=45020002000311"
                            target="_blank" rel="noreferrer"><img src="/src/beian.png"
                                alt="公安备案">桂公网安备45020002000311号</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 主界面 ================= -->
        <div id="mainScreen" class="screen hidden">
            <div class="page" id="page-progress"></div>
            <div class="page hidden" id="page-sleep"></div>
            <div class="page hidden" id="page-square"></div>
            <div class="page hidden" id="page-me"></div>

            <nav class="tabbar">
                <div class="tab-item" data-tab="progress" onclick="switchTab('progress')"><span>📊</span><b>进展</b></div>
                <div class="tab-item" data-tab="sleep" onclick="switchTab('sleep')"><span>😴</span><b>睡觉</b></div>
                <div class="tab-item" data-tab="square" onclick="switchTab('square')"><span>🏆</span><b>广场</b></div>
                <div class="tab-item" data-tab="me" onclick="switchTab('me')"><span>👤</span><b>我的</b></div>
            </nav>
        </div>

        <div id="modalRoot"></div>
        <div id="toast" class="toast"></div>
    </div>

                if (s.end) daysSet[dateKey(s.start)] = 1;
            });
            var days = Object.keys(daysSet).sort();
            if (!days.length) return { current: 0, max: 0 };

            var max = 1, run = 1;
            for (var i = 1; i < days.length; i++) {
                if (parseKey(days[i]) - parseKey(days[i - 1]) === 86400000) { run++; if (run > max) max = run; }
                else run = 1;
            }

            var today = dateKey(Date.now());
            var yest = dateKey(Date.now() - 86400000);
            var last = days[days.length - 1];
            if (last !== today && last !== yest) return { current: 0, max: max };

            var cur = 1;
            for (var j = days.length - 1; j > 0; j--) {
                if (parseKey(days[j]) - parseKey(days[j - 1]) === 86400000) cur++;
                else break;
            }
            return { current: cur, max: max };
        }

        /* ---------------- 统计 ---------------- */
        function computeStats() {
            var all = state.sessions.filter(function (s) { return s.end; });
            var ss = state.settings.semesterStart;
            var se = state.settings.semesterEnd;
            var monday = startOfWeek(Date.now());

            var totalMs = 0, semMs = 0, weekMs = 0, count = all.length;
            var longest = 0, earliest = null, latest = null;

            all.forEach(function (s) {
                var c = calcSession(s);
                totalMs += c.ms;

                var k = dateKey(s.start);
                var inSem = (!ss || k >= ss) && (!se || k <= se);
                if (inSem && c.counted) semMs += c.ms;

                if (s.start >= monday) {
                    weekMs += c.ms;
                    if (c.hours > longest) longest = c.hours;
                    var b = bedMinOf(s.start);
                    if (earliest === null || b < earliest) earliest = b;
                    var w = wakeMinOf(s.end);
                    if (latest === null || w > latest) latest = w;
                }
            });

            return {
                totalMs: totalMs, semMs: semMs, weekMs: weekMs, count: count,
                weekBest: { longest: longest, earliest: earliest, latest: latest }
            };
        }
        function totalMsAll() {
            return state.sessions.reduce(function (a, s) {
                return a + (s.end ? Math.max(0, s.end - s.start) : 0);
            }, 0);
        }

        /* ---- 距离计算（米），用于“查找附近已存位置” ---- */
        function distanceM(a, b) {
            if (!a || !b) return Infinity;
            var R = 6371000, rad = Math.PI / 180;
            var dLat = (b.lat - a.lat) * rad;
            var dLng = (b.lng - a.lng) * rad;
            var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(a.lat * rad) * Math.cos(b.lat * rad) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
        }
        function findNearbyLoc(coord, radius) {
            if (!coord) return null;
            var best = null, bestD = radius;
            state.locations.forEach(function (l) {
                if (!l.coord) return;
                var d = distanceM(coord, l.coord);
                if (d <= bestD) { bestD = d; best = l; }
            });
            return best;
        }

            if (isNaN(a) || isNaN(b)) return null;
            if (a < -90 || a > 90 || b < -180 || b > 180) return null;
            return { lat: +a.toFixed(5), lng: +b.toFixed(5) };
        }

            return !la.value.trim() && !ln.value.trim();

                    '<div class="li-check">✓</div>' +
                    '</div>';
            }).join('');

            if (!state.locations.length) {
                listHtml =
                    '<div class="loc-empty">' +
                    '<div class="le-icon">🛏️</div>' +
                    '<div class="le-title">还没有常用位置</div>' +
                    '<div class="le-sub">先添加一个常用位置，之后睡觉一键选中<br>例如：3号楼402床、图书馆3楼靠窗</div>' +
                    '</div>';
            }

            openModal(
                '<div class="modal-head">选择睡眠位置</div>' +
                '<div class="modal-sub">位置仅保存在本机浏览器，界面只显示类型和名称。</div>' +
                listHtml +
                '<button class="add-loc-big" onclick="openNewLoc()">＋ 添加常用位置</button>' +
                '<button class="btn-ghost" onclick="closeModal()">完成</button>'

        /* ---- 新增常用位置：独立窗口 ---- */
        function openNewLoc() {
            pendingCoord = null;
            pendingType = '宿舍';
            pendingName = '';
            advOpen = false;
            renderNewLoc();
        }

        function renderNewLoc() {
            openModal(
                '<div class="modal-head">添加常用位置</div>' +
                '<div class="modal-sub">选个类型，起个名字就够用了。</div>' +
                typeChipsHtml() +
                '<input id="newLocName" placeholder="位置名称，如：3号楼402床" autocomplete="off" ' +
                'value="' + esc(pendingName || '') + '" ' +
                'style="width:100%;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;color:#1c1c28">' +
                '<div class="adv-entry" onclick="toggleAdv()">' +
                '<span>⚙️ 高级设置 · 绑定坐标</span>' +
                '<span id="advArrow">' + (advOpen ? '▲' : '▼') + '</span>' +
                '</div>' +
                '<div id="advBox"' + (advOpen ? '' : ' class="hidden"') + '>' +
                '<div class="opt-label">可选 · 绑定坐标后可使用「定位匹配最近位置」</div>' +
                '<button class="gps-link" onclick="grabGPS()">📍 使用当前定位自动填入</button>' +
                '<div class="gps-status" id="gpsStatus"></div>' +
                coordRowHtml('locLat', 'locLng', pendingCoord) +
                '</div>' +

                '<button class="btn-ghost" onclick="openLocPicker()">← 返回位置列表</button>'
            );

            if (pendingCoord) {
                var st = document.getElementById('gpsStatus');
                if (st) st.textContent = '✅ 当前坐标：' + pendingCoord.lat.toFixed(5) + ', ' + pendingCoord.lng.toFixed(5);

        /* ---- 类型选择 ---- */
        function selectLocType(t) {
            pendingType = t;
            Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (el) {
                el.classList.toggle('on', el.textContent.indexOf(t) > -1);
            });
        }

        function toggleAdv() {
            advOpen = !advOpen;
            var box = document.getElementById('advBox');
            var arrow = document.getElementById('advArrow');
            if (box) box.classList.toggle('hidden', !advOpen);
            if (arrow) arrow.textContent = advOpen ? '▲' : '▼';
        }

        /* ---- 定位：获取当前位置 → 查找附近已存位置 → 填入坐标 ---- */
        function grabGPS(latId, lngId, statusId) {
            latId = latId || 'locLat';
            lngId = lngId || 'locLng';
            statusId = statusId || 'gpsStatus';

            var el = document.getElementById(statusId);
            if (!el) return;

            if (!navigator.geolocation) {
                el.textContent = '❌ 当前浏览器不支持定位，可手动填写经纬度';
                return;
            }

            el.textContent = '⏳ 正在获取你的位置…';

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var lat = +pos.coords.latitude.toFixed(5);
                    var lng = +pos.coords.longitude.toFixed(5);
                    var acc = pos.coords.accuracy ? Math.round(pos.coords.accuracy) : null;

                    var la = document.getElementById(latId);
                    var ln = document.getElementById(lngId);
                    if (la) la.value = lat;
                    if (ln) ln.value = lng;

                    if (latId === 'locLat') {
                        pendingCoord = { lat: lat, lng: lng };
                    }

                    el.textContent = '✅ 已获取：' + lat + ', ' + lng +
                        (acc ? '（精度约 ' + acc + ' 米）' : '') + '，可直接保存';
                },
                function (err) {
                    var msg = '❌ 定位失败';
                    if (err && err.code === 1) msg = '❌ 你拒绝了定位授权';
                    else if (err && err.code === 2) msg = '❌ 暂时无法获取位置';
                    else if (err && err.code === 3) msg = '❌ 定位超时';
                    el.textContent = msg + '，可手动填写经纬度或选择已有位置';
                },
                { timeout: 12000, maximumAge: 0, enableHighAccuracy: true }
            );
        }

        /* ---- 定位后：查找附近已存位置（300 米内） ---- */
        function showNearbyMatch() {
        }

        /* ---- 手动改坐标时实时同步 ---- */
        function onCoordInput() {
            var c = parseCoord('locLat', 'locLng');
            pendingCoord = c;
            var st = document.getElementById('gpsStatus');
            if (st) st.textContent = c
                ? '✅ 当前坐标：' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5)
                : '';
        }

        /* ---- 新增位置 ---- */
        function saveNewLoc() {
            var input = document.getElementById('newLocName');
            var name = (input && input.value || '').trim();
            if (!name) { toast('给位置起个名字吧'); return; }

            var coord = null;
            if (!coordEmpty('locLat', 'locLng')) {
                coord = parseCoord('locLat', 'locLng');
                if (!coord) { toast('经纬度格式不正确（或两栏都清空）'); return; }
            }

            var loc = {
                id: 'loc' + Date.now(),
                type: pendingType,
                name: name,
                coord: coord
            };
            state.locations.push(loc);
            state.currentLocId = loc.id;
            pendingCoord = null;
            pendingType = '宿舍';
            pendingName = '';
            save();
            renderSleep();
            renderMe();
            renderLocPicker();          // 保存后回到列表，新位置已高亮选中
            toast('位置已保存：' + loc.type + ' · ' + loc.name);
        }

        /* ---- 编辑已有位置（含查看/改经纬度） ---- */
        function openLocEditor(id) {
            var l = getLocById(id);
            if (!l) return;
            pendingType = l.type || '宿舍';
            pendingCoord = l.coord ? { lat: l.coord.lat, lng: l.coord.lng } : null;

            openModal(
                '<div class="modal-head">编辑位置</div>' +
                '<div class="modal-sub">可修改类型、名称和经纬度。</div>' +
                typeChipsHtml() +
                '<input id="editLocName" placeholder="位置名称" autocomplete="off" ' +
                'value="' + esc(l.name) + '" ' +
                'style="width:100%;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;color:#1c1c28">' +
                '<button class="btn-ghost" onclick="grabGPS(\'eLat\',\'eLng\',\'editGpsStatus\')">📍 重新定位并填入</button>' +
                '<div class="gps-status" id="editGpsStatus"></div>' +
                coordRowHtml('eLat', 'eLng', pendingCoord) +
                '<button class="btn-ghost" onclick="clearLocCoord()">清空坐标</button>' +
                '<button class="btn-primary" onclick="saveLocEdit(\'' + id + '\')">保存修改</button>' +
                '<button class="btn-ghost" onclick="openLocPicker()">返回列表</button>'

        function clearLocCoord() {
            var a = document.getElementById('eLat'), b = document.getElementById('eLng');
            if (a) a.value = '';
            if (b) b.value = '';
            pendingCoord = null;
            var st = document.getElementById('editGpsStatus');
            if (st) st.textContent = '坐标已清空，保存后该位置不带坐标';
        }

        function saveLocEdit(id) {
            var l = getLocById(id);
            if (!l) return;

            var nameEl = document.getElementById('editLocName');
            var name = (nameEl && nameEl.value || '').trim();
            if (!name) { toast('给位置起个名字吧'); return; }

            var coord = null;
            if (!coordEmpty('eLat', 'eLng')) {
                coord = parseCoord('eLat', 'eLng');
                if (!coord) { toast('经纬度格式不正确（或两栏都清空）'); return; }
            }

            l.name = name;
            l.type = pendingType;
            l.coord = coord;
            save();
            renderSleep();
            toast('位置已更新');
            pendingCoord = null;
            pendingType = '宿舍';
            openLocPicker();
        }

        /* ---- 删除位置 ---- */
        function deleteLoc(id) {
            var l = getLocById(id);
            if (!l) return;
            if (!confirm('删除位置「' + l.type + ' · ' + l.name + '」？')) return;

            state.locations = state.locations.filter(function (x) { return x.id !== id; });
            if (state.currentLocId === id) {
                state.currentLocId = state.locations.length ? state.locations[0].id : null;
            }
            save();
            renderLocPicker();
            renderSleep();
            renderMe();
            toast('已删除该位置');
        }

        /* ---- 选中某位置 ---- */
        function pickLoc(id) {
            state.currentLocId = id;
            save();
            closeModal();
            renderSleep();
            var l = getCurrentLocation();
            if (l) toast('当前位置：' + l.type + ' · ' + l.name);
        }

        /* ---- 睡觉页一键定位：匹配最近已存位置 ---- */
        var MATCH_RADIUS = 800; // 800 米内自动切换，超过则弹窗确认

        function quickLocate() {
            if (state.active) { toast('睡眠中不能切换位置，请先结账'); return; }

            if (!state.locations.length) {
                toast('还没有保存的位置，先添加一个吧（需要绑定坐标）');
                openLocPicker();
                return;
            }
            if (!navigator.geolocation) {
                toast('当前浏览器不支持定位，请手动选择位置');
                return;
            }

            var btn = document.getElementById('quickLocBtn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ 正在获取你的位置…'; }

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var me = {
                        lat: +pos.coords.latitude.toFixed(5),
                        lng: +pos.coords.longitude.toFixed(5)
                    };

                    // 在所有已存位置中找最近的
                    var best = null, bestD = Infinity;
                    state.locations.forEach(function (l) {
                        if (!l.coord) return;
                        var d = distanceM(me, l.coord);
                        if (d < bestD) { bestD = d; best = l; }
                    });

                    restoreQuickBtn();

                    if (!best) {
                        toast('已存位置都没有坐标，点「切换」进去补个定位吧');
                        return;
                    }

                    if (bestD <= MATCH_RADIUS) {
                        state.currentLocId = best.id;
                        save();
                        renderSleep();
                        toast('已定位到最近位置：' + best.type + ' · ' + best.name +
                            '（约 ' + Math.round(bestD) + ' 米）');
                    } else {
                        openModal(
                            '<div class="modal-head">最近的建筑有点远</div>' +
                            '<div class="modal-sub">离你最近的已存位置是：' +
                            (LOC_TYPES[best.type] || '📍') + ' ' + esc(best.type) + ' · ' + esc(best.name) +
                            '，约 <b>' + Math.round(bestD) + '</b> 米。<br>要使用它，还是添加一个新位置？</div>' +
                            '<button class="btn-primary" onclick="pickLoc(\'' + best.id + '\')">就选这个（' + Math.round(bestD) + ' 米）</button>' +
                            '<button class="btn-ghost" onclick="closeModal();openLocPicker()">添加新位置</button>'
                        );
                    }
                },
                function (err) {
                    restoreQuickBtn();
                    var msg = '定位失败或未授权，请手动选择位置';
                    if (err && err.code === 1) msg = '你拒绝了定位授权，请手动选择位置';
                    else if (err && err.code === 3) msg = '定位超时，请手动选择位置';
                    toast(msg);
                },
                { timeout: 12000, maximumAge: 0, enableHighAccuracy: true }
            );

            function restoreQuickBtn() {
                var b = document.getElementById('quickLocBtn');
                if (b) {
                    b.disabled = false;
                    b.textContent = '📍 定位匹配最近位置';
                }
            }
        }

        /* ==================================================================
        广场
        ================================================================== */
        function ensureBoard() {
            if (!state.board || !state.board.list || !state.board.list.length) {
                state.board = { list: genBoard() };
                save();
            }
        }

        function genBoard() {
            var names = V_NAMES.slice();
            for (var i = names.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = names[i]; names[i] = names[j]; names[j] = tmp;
            }
            var out = [];
            for (var k = 0; k < 29; k++) {
                out.push({
                    id: 'v' + k,
                    name: names[k],
                    avatar: V_AVATARS[Math.floor(Math.random() * V_AVATARS.length)],
                    maxSleep: +(4 + Math.random() * 13).toFixed(1),
                    bedMin: Math.floor(1140 + Math.random() * 480),   // 19:00 ~ 03:00
                    streak: Math.floor(Math.random() * 120)
                });
            }
            return out;
        }

        function buildBoardRows(tab) {
            ensureBoard();
            var rows = state.board.list.map(function (v) {
                return {
                    id: v.id,
                    name: v.name,
                    avatar: v.avatar,
                    isMe: false,
                    value: tab === 'duration' ? v.maxSleep : (tab === 'early' ? v.bedMin : v.streak)
                };
            });

            var all = state.sessions.filter(function (s) { return s.end; });
            var myMax = 0;
            all.forEach(function (s) {
                var h = calcSession(s).hours;
                if (h > myMax) myMax = h;
            });
            var myBed = null;
            all.forEach(function (s) {
                var b = bedMinOf(s.start);
                // 仅统计 19:00 ~ 03:00 入睡的记录
                // bedMinOf 规则：19:00 = 1140，23:59 = 1439，00:00 = 1440，03:00 = 1620
                if (b < 1140 || b > 1620) return;
                if (myBed === null || b < myBed) myBed = b;
            });
            var myStreak = streakInfo().current;

            var myValue;
            if (tab === 'duration') myValue = myMax;
            else if (tab === 'early') myValue = (myBed === null ? 9999 : myBed);
            else myValue = myStreak;

            rows.push({
                id: 'me',
                name: state.user.nickname,
                avatar: '😴',
                isMe: true,
                value: myValue,
                hasData: all.length > 0
            });

            rows.sort(function (a, b) {
                return tab === 'early' ? a.value - b.value : b.value - a.value;
            });
            return rows;
        }

        function squareTabsHtml(tab) {
            return '<div class="sq-tabs">' +
                '<div class="sq-tab ' + (tab === 'feed' ? 'on' : '') + '" onclick="setBoardTab(\'feed\')">睡友动态</div>' +
                '<div class="sq-tab ' + (tab === 'duration' ? 'on' : '') + '" onclick="setBoardTab(\'duration\')">睡眠时长榜</div>' +
                '<div class="sq-tab ' + (tab === 'early' ? 'on' : '') + '" onclick="setBoardTab(\'early\')">最早入睡榜</div>' +
                '<div class="sq-tab ' + (tab === 'streak' ? 'on' : '') + '" onclick="setBoardTab(\'streak\')">连续天数榜</div>' +
                '</div>';
        }

        /* ---- 睡友动态：渲染（含点赞 / 踩 / 举报） ---- */
        function getFeedReaction(id) {
            if (!state.feedReactions) state.feedReactions = {};
            if (!state.feedReactions[id]) {
                state.feedReactions[id] = { like: false, dislike: false, report: false, reportReason: '' };
            }
            return state.feedReactions[id];
        }

        /* ---- 长动态折叠 ---- */
        function feedTextHtml(f) {
            var expanded = !!(state.feedExpanded && state.feedExpanded[f.id]);
            return '<div class="feed-text' + (expanded ? '' : ' folded') + '"' +
                ' id="feedText-' + f.id + '" data-fid="' + f.id + '">' +
                esc(f.text) +
                '</div>' +
                '<button class="feed-expand" id="feedExpand-' + f.id + '" style="display:none"' +
                ' onclick="toggleFeedExpand(\'' + f.id + '\')">' +
                (expanded ? '收起' : '展开全文') +
                '</button>';
        }

        function toggleFeedExpand(id) {
            if (!state.feedExpanded) state.feedExpanded = {};
            var on = !state.feedExpanded[id];
            state.feedExpanded[id] = on;
            save();

            var el = document.getElementById('feedText-' + id);
            var btn = document.getElementById('feedExpand-' + id);
            if (el) el.classList.toggle('folded', !on);
            if (btn) btn.textContent = on ? '收起' : '展开全文';
            if (!on) requestAnimationFrame(applyFeedFold);
        }

        /* 渲染后检测：只有真正溢出才显示「展开全文」 */
        function applyFeedFold() {
            var els = document.querySelectorAll('.feed-text[data-fid]');
            Array.prototype.forEach.call(els, function (el) {
                var id = el.getAttribute('data-fid');
                var btn = document.getElementById('feedExpand-' + id);
                if (!btn) return;
                if (el.offsetParent === null) return;          // 页面不可见，跳过

                var expanded = !!(state.feedExpanded && state.feedExpanded[id]);
                if (expanded) { btn.style.display = ''; return; }

                var overflow = el.scrollHeight - el.clientHeight > 2;
                btn.style.display = overflow ? '' : 'none';
                if (!overflow) el.classList.remove('folded');
            });
        }

        function feedListHtml() {
            return '<div class="feed-list">' + FEED_DATA.map(function (f) {
                var r = getFeedReaction(f.id);
                var folded = !!(r.dislike || r.report);
                var likeCount = f.likes + (r.like ? 1 : 0);

                var bodyHtml = folded
                    ? '<div class="feed-folded">' +
                    '<span class="ff-icon">ⓘ</span>' +
                    '<span class="ff-text">该内容已折叠，将不会为您优化后续评论展示</span>' +
                    '<button class="ff-undo" onclick="undoFeedFold(\'' + f.id + '\')">' +
                    (r.report ? '撤销举报' : '取消踩') +
                    '</button>' +
                    '</div>'
                    : feedTextHtml(f);

                return '<div class="feed-card">' +
                    '<div class="feed-top">' +
                    '<div class="feed-av">' + f.avatar + '</div>' +
                    '<div class="feed-owner">' +
                    '<div class="feed-name">' + esc(f.name) + '</div>' +
                    '</div>' +
                    (f.tag ? '<div class="feed-tag">' + esc(f.tag) + '</div>' : '') +
                    '</div>' +
                    bodyHtml +
                    '<div class="feed-actions">' +
                    '<button class="feed-act like' + (r.like ? ' on' : '') + '" onclick="toggleFeedLike(\'' + f.id + '\')">👍 ' + likeCount + '</button>' +
                    '<button class="feed-act down' + (r.dislike ? ' on' : '') + '" onclick="toggleFeedDislike(\'' + f.id + '\')">👎 ' + (r.dislike ? '已踩' : '踩') + '</button>' +
                    '<button class="feed-act report' + (r.report ? ' on' : '') + '" onclick="openFeedReport(\'' + f.id + '\')">🚩 ' + (r.report ? '已举报' : '举报') + '</button>' +
                    '<span class="feed-meta-right">' + (f.loc ? '📍 ' + esc(f.loc) + ' · ' : '') + '💬 ' + f.comments + '</span>' +
                    '</div>' +
                    '</div>';
            }).join('') + '</div>';
        }

        /* ---- 点赞 ---- */
        function toggleFeedLike(id) {
            var r = getFeedReaction(id);
            r.like = !r.like;
            if (r.like) r.dislike = false;   // 点赞与踩互斥
            save();
            renderSquare();
            toast(r.like ? '已点赞 👍' : '已取消点赞');
        }

        /* ---- 踩（踩后折叠内容） ---- */
        function toggleFeedDislike(id) {
            var r = getFeedReaction(id);
            r.dislike = !r.dislike;
            if (r.dislike) r.like = false;   // 点赞与踩互斥
            save();
            renderSquare();
            toast(r.dislike ? '已踩，内容已折叠' : '已取消踩');
        }

        /* ---- 举报入口：已举报则撤销，未举报则选理由 ---- */
        function openFeedReport(id) {
            var r = getFeedReaction(id);

            if (r.report) {
                if (!confirm('撤销对该内容的举报？')) return;
                r.report = false;
                r.reportReason = '';
                save();
                renderSquare();
                toast('已撤销举报');
                return;
            }

            selectedReportReason = 0;
            openModal(
                '<div class="modal-head">举报该动态</div>' +
                '<div class="modal-sub">请选择举报理由（纯属娱乐，不会提交给任何人）。</div>' +
                '<div class="report-reasons">' +
                REPORT_REASONS.map(function (t, i) {
                    return '<div class="loc-item' + (i === selectedReportReason ? ' on' : '') + '" id="reportReason' + i + '" onclick="selectReportReason(' + i + ')">' +
                        '<div class="li-icon">🚩</div>' +
                        '<div class="li-main"><div class="li-name">' + esc(t) + '</div></div>' +
                        '<div class="li-check">✓</div>' +
                        '</div>';
                }).join('') +
                '</div>' +
                '<button class="btn-primary" onclick="submitFeedReport(\'' + id + '\')">提交举报</button>' +
                '<button class="btn-ghost" onclick="closeModal()">取消</button>'
            );
        }

        function selectReportReason(i) {
            selectedReportReason = i;
            REPORT_REASONS.forEach(function (_, k) {
                var el = document.getElementById('reportReason' + k);
                if (el) el.classList.toggle('on', k === i);
            });
        }

        /* ---- 提交举报：折叠内容 ---- */
        function submitFeedReport(id) {
            var r = getFeedReaction(id);
            r.report = true;
            r.reportReason = REPORT_REASONS[selectedReportReason] || REPORT_REASONS[0];
            save();
            closeModal();
            renderSquare();
            toast('举报已提交，内容已折叠');
        }

        /* ---- 折叠条上的撤销：优先撤销举报，其次取消踩 ---- */

        /* ---------------- 数据管理：导出 / 导入 / 注销 ---------------- */

        /* 中文安全 Base64 编解码 */
        function b64Encode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (_, p) {
                return String.fromCharCode(parseInt(p, 16));
            }));
        }
        function b64Decode(str) {
            return decodeURIComponent(atob(str).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        /* 复制到剪贴板（含降级方案） */
        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, text.length);
                var ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
                ok ? resolve() : reject(new Error('copy failed'));
            });
        }

        /* 导出：整个 state 序列化后 Base64 复制到剪贴板 */
        function exportData() {
            if (!state.user) { toast('当前没有可导出的数据'); return; }

            var payload;
            try {
                payload = b64Encode(JSON.stringify(state));
            } catch (e) {
                toast('导出失败，请稍后重试');
                return;
            }

            copyText(payload).then(function () {
                toast('已复制到剪贴板，共 ' + payload.length + ' 字符');
            }).catch(function () {
                openModal(
                    '<div class="modal-head">手动复制</div>' +
                    '<div class="modal-sub">自动复制失败，请长按下方文本框全选后复制。</div>' +
                    '<textarea id="exportArea" readonly style="width:100%;min-height:110px;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:10px;font-size:12px;color:#1c1c28;outline:none;resize:vertical;word-break:break-all">' + payload + '</textarea>' +
                    '<button class="btn-primary" onclick="closeModal()">完成</button>'
                );
                var el = document.getElementById('exportArea');
                if (el) { el.focus(); el.select(); }
            });
        }

        /* 打开导入面板 */
        function openImport() {
            openModal(
                '<div class="modal-head">导入数据</div>' +
                '<div class="modal-sub">粘贴之前导出的 Base64 字符串。<b style="color:#e03131">导入会覆盖本机现有数据</b>，请谨慎操作。</div>' +
                '<textarea id="importArea" placeholder="在此粘贴 Base64 数据…" style="width:100%;min-height:110px;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:10px;font-size:12px;color:#1c1c28;outline:none;resize:vertical;word-break:break-all"></textarea>' +
                '<button class="btn-ghost" onclick="pasteFromClipboard()">📋 从剪贴板读取</button>' +
                '<button class="btn-primary" onclick="doImport()">确认导入</button>' +
                '<button class="btn-ghost" onclick="closeModal()">取消</button>'
            );
        }

        function pasteFromClipboard() {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                toast('当前浏览器不支持读取剪贴板，请手动粘贴');
                return;
            }
            navigator.clipboard.readText().then(function (txt) {
                var el = document.getElementById('importArea');
                if (el) el.value = (txt || '').trim();
                toast('已读取剪贴板内容');
            }).catch(function () {
                toast('读取失败，请手动粘贴');
            });
        }

        /* 执行导入 */
        function doImport() {
            var el = document.getElementById('importArea');
            var raw = ((el && el.value) || '').replace(/\s+/g, '');
            if (!raw) { toast('请先粘贴导出的数据'); return; }

            var d = null;
            try {
                d = JSON.parse(b64Decode(raw));
            } catch (e) {
                toast('数据无法解析，请检查是否完整');
                return;
            }
            if (!d || typeof d !== 'object' || Array.isArray(d)) {
                toast('数据格式不正确');
                return;
            }
            if (!('user' in d) && !('sessions' in d)) {
                toast('这似乎不是「校园睡」的数据');
                return;
            }

            if (!confirm('导入将覆盖当前本机所有数据，确定继续吗？')) return;

            state.user = d.user || null;
            state.sessions = Array.isArray(d.sessions) ? d.sessions : [];
            state.active = d.active || null;
            state.locations = Array.isArray(d.locations) ? d.locations : [];
            state.currentLocId = d.currentLocId || null;
            state.board = d.board || null;
            state.boardTab = d.boardTab || 'duration';
            state.tab = d.tab || 'progress';
            state.presetIdx = d.presetIdx || 0;
            state.showAllRecords = false;
            state.settings = Object.assign(
                { target: 100, maxSleep: 12, minSleep: 15, semesterStart: '', semesterEnd: '' },
                d.settings || {}
            );

            save();
            closeModal();
            renderAll();
            toast(state.user ? '导入成功 ✅' : '导入完成，请重新填写信息');
        }
