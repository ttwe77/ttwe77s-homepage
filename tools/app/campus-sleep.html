<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>校园睡</title>
    <script type="module">
        import { BAClickFX } from '/libs/ba-click-fx.js';
        const fx = new BAClickFX();
        fx.setCompositingReference({ hostCompositing: 'screen' });
        fx.setThemeColor('#80c1ff');
    </script>
    <link rel="icon" href="/tools/app/src/campus-sleep.svg">

    <!-- ============ PWA ============ -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="description" content="用校园跑的方式，认真睡觉。娱乐向睡眠打卡页面，数据保存在本地浏览器。">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="校园睡">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #e9eaf2;
            color: #1c1c28
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f2f3f8;
            position: relative;
            overflow-x: hidden
        }

        .hidden {
            display: none !important
        }

        input,
        button {
            font-family: inherit
        }

        ::-webkit-scrollbar {
            width: 0
        }

        /* ============ 通用 ============ */
        .page {
            padding-bottom: 92px;
            min-height: 100vh
        }

        /* ==== 页面切换动画 ==== */
        .page.page-in {
            animation: pageIn .5s cubic-bezier(.22, .9, .3, 1) both;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translate3d(0, 0, 0);
            }

            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* 无障碍：系统开启"减少动态效果"时直接关掉 */
        @media (prefers-reduced-motion: reduce) {
            .page.page-in {
                animation: none !important;
            }
        }

        .page-inner {
            padding: 16px 16px 0
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05);
            margin-top: 14px
        }

        .card-head {
            font-size: 13px;
            font-weight: 700;
            color: #5a5a72;
            margin-bottom: 12px;
            letter-spacing: .5px
        }

        .mt {
            margin-top: 14px
        }

        .btn-primary {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #7C6CF0, #5B4BD6);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 15px;
            border-radius: 14px;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, .28);
            transition: .15s
        }

        .btn-primary:active {
            transform: scale(.98)
        }

        .btn-ghost {
            width: 100%;
            border: 1.5px dashed #d6d2ee;
            background: #faf9ff;
            color: #6C5CE7;
            font-size: 14px;
            font-weight: 600;
            padding: 13px;
            border-radius: 14px;
            margin-top: 10px;
            cursor: pointer;
            transition: .15s
        }

        .btn-ghost:active {
            transform: scale(.98)
        }

        .btn-ghost.danger {
            color: #e03131;
            border-color: #ffd6d6;
            background: #fff5f5
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(28, 28, 40, .92);
            color: #fff;
            font-size: 13px;
            padding: 10px 18px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 500;
            white-space: nowrap;
            max-width: 90vw
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        /* ============ 注册 ============ */
        .reg-wrap {
            padding: 46px 20px 40px
        }

        .reg-logo {
            font-size: 58px;
            text-align: center;
            line-height: 1;
            filter: drop-shadow(0 8px 16px rgba(108, 92, 231, .3))
        }

        .reg-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin: 12px 0 6px;
            letter-spacing: 3px
        }

        .reg-sub {
            text-align: center;
            color: #8a8aa0;
            font-size: 13px;
            margin-bottom: 26px
        }

        .reg-card {
            background: #fff;
            border-radius: 22px;
            padding: 22px 18px;
            box-shadow: 0 10px 34px rgba(30, 30, 60, .08)
        }

        .reg-card label {
            display: block;
            font-size: 12px;
            color: #8a8aa0;
            margin: 14px 0 6px;
            font-weight: 600;
            letter-spacing: .5px
        }

        .reg-card label:first-child {
            margin-top: 0
        }

        .reg-card input {
            width: 100%;
            border: 1.5px solid #eceaf6;
            background: #fafaff;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            transition: .2s;
            color: #1c1c28
        }

        .reg-card input:focus {
            border-color: #6C5CE7;
            background: #fff
        }

        .fine {
            font-size: 11px;
            color: #a8a8bc;
            text-align: center;
            line-height: 1.7;
            margin: 16px 0 0
        }

        /* ============ 顶部栏 ============ */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px 14px
        }

        .hi {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: .5px
        }

        .hi-sub {
            font-size: 12px;
            color: #8a8aa0;
            margin-top: 4px
        }

        .logo-mini {
            font-size: 28px;
            line-height: 1
        }

        /* ============ 进展页 ============ */
        .hero-card {
            background: linear-gradient(150deg, #6C5CE7, #8B7BF0 60%, #9F8CF5);
            border-radius: 22px;
            padding: 22px 20px 18px;
            color: #fff;
            box-shadow: 0 14px 32px rgba(108, 92, 231, .32);
            position: relative;
            overflow: hidden
        }

        .hero-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .09);
            right: -70px;
            top: -80px
        }

        .hero-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            position: relative;
            z-index: 1
        }

        .hero-num {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2.5px;
            font-variant-numeric: tabular-nums
        }

        .hero-goal {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, .75);
            line-height: 1.3
        }

        .hero-goal span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255, 255, 255, .55);
            margin-top: 2px;
            letter-spacing: 1px
        }

        .hero-bar {
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .22);
            margin: 16px 0 14px;
            overflow: hidden
        }

        .hero-bar i {
            display: block;
            height: 100%;
            border-radius: 6px;
            background: #fff;
            transition: width .5s ease
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 1
        }

        .hero-meta>div {
            display: flex;
            flex-direction: column;
            gap: 3px
        }

        .hero-meta b {
            font-size: 17px;
            font-weight: 800;
            font-variant-numeric: tabular-nums
        }

        .hero-meta span {
            font-size: 10.5px;
            color: rgba(255, 255, 255, .62)
        }

        .tip-banner {
            margin-top: 14px;
            border: 1.5px solid #b6e8d2;
            background: #effcf6;
            border-radius: 16px;
            padding: 14px 16px
        }

        .tip-banner>div {
            font-size: 13.5px;
            font-weight: 600;
            color: #0e7a56;
            line-height: 1.5
        }

        .tip-banner button {
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #22c98d, #12b886);
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            padding: 11px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(18, 184, 134, .28)
        }

        .tip-banner button:active {
            transform: scale(.98)
        }

        .best-row {
            display: flex;
            gap: 10px
        }

        .best-box {
            flex: 1;
            background: #f7f7fd;
            border-radius: 14px;
            padding: 14px 6px;
            text-align: center
        }

        .best-box .bv {
            font-size: 17px;
            font-weight: 800;
            color: #3b3b58;
            font-variant-numeric: tabular-nums
        }

        .best-box .bl {
            font-size: 10.5px;
            color: #9a9ab0;
            margin-top: 6px
        }

        .notice-banner {
            margin-top: 14px;
            border-radius: 18px;
            padding: 18px 18px;
            background: linear-gradient(115deg, #ff7a59, #ff9f43 55%, #ffd166);
            color: #fff;
            box-shadow: 0 12px 28px rgba(255, 122, 89, .32);
            cursor: pointer;
            position: relative;
            overflow: hidden
        }

        .notice-banner::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .16);
            right: -50px;
            bottom: -70px
        }

        .notice-main {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(180, 60, 0, .2)
        }

        .notice-sub {
            font-size: 12px;
            margin-top: 7px;
            opacity: .92;
            font-weight: 600
        }

        .rec-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 0;
            border-bottom: 1px solid #f2f2f8
        }

        .rec-row:last-child {
            border-bottom: none
        }

        .rec-row {
            cursor: pointer;
            transition: background .15s;
        }

        .rec-row:active {
            background: #f7f5ff;
        }

        .rec-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #f4f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex: none
        }

        .rec-main {
            flex: 1;
            min-width: 0
        }

        .rec-date {
            font-size: 12.5px;
            font-weight: 600;
            color: #3b3b58
        }

        .rec-loc {
            font-size: 11px;
            color: #9a9ab0;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .rec-val {
            font-size: 14px;
            font-weight: 800;
            color: #3b3b58;
            font-variant-numeric: tabular-nums;
            text-align: right
        }

        .rec-val.bad {
            color: #f03e3e
        }

        .rec-val.warn {
            color: #f59f00
        }

        .rec-tag {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 4px;
            vertical-align: middle
        }

        .rec-tag.bad {
            background: #ffe3e3;
            color: #f03e3e
        }

        .rec-tag.warn {
            background: #fff4e0;
            color: #e8890c
        }

        .foot-note {
            text-align: center;
            font-size: 10.5px;
            color: #b0b0c4;
            padding: 22px 0 10px;
            letter-spacing: .5px
        }

        /* ============ 睡觉页 ============ */
        .loc-bar {
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: .2s
        }

        .loc-bar:active {
            transform: scale(.99);
            border-color: #ded9f8
        }

        .loc-text {
            font-size: 13.5px;
            font-weight: 600;
            color: #3b3b58;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap
        }

        .loc-edit {
            font-size: 11px;
            color: #6C5CE7;
            background: #f2efff;
            padding: 3px 9px;
            border-radius: 8px;
            font-weight: 700
        }

        .loc-quick {
            width: 100%;
            margin-top: 10px;
            border: 1.5px dashed #d6d2ee;
            background: #faf9ff;
            color: #6C5CE7;
            font-size: 13px;
            font-weight: 700;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: .15s
        }

        .loc-quick:active {
            transform: scale(.99)
        }

        .loc-quick:disabled {
            opacity: .55;
            cursor: not-allowed;
            background: #f3f3f8;
            color: #a8a8bc;
            border-color: #e6e6f0
        }

        .dial-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 46px 0 30px
        }

        .dial {
            width: 246px;
            height: 246px;
            border-radius: 50%;
            background: linear-gradient(150deg, #8B7BF0, #6C5CE7 45%, #5142C9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 22px 48px rgba(108, 92, 231, .38), inset 0 -8px 24px rgba(0, 0, 0, .12);
            cursor: pointer;
            transition: .25s;
            position: relative;
            user-select: none
        }

        .dial:active {
            transform: scale(.97)
        }

        .dial.sleeping {
            background: linear-gradient(150deg, #2E4BA8, #1B2A6B 55%, #101B4A);
            box-shadow: 0 22px 48px rgba(27, 42, 107, .45), inset 0 -8px 24px rgba(0, 0, 0, .25)
        }

        .dial.sleeping::before {
            content: "";
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid rgba(46, 75, 168, .28);
            animation: pulseRing 2.4s ease-out infinite
        }

        @keyframes pulseRing {
            0% {
                transform: scale(.96);
                opacity: .9
            }

            100% {
                transform: scale(1.16);
                opacity: 0
            }
        }

        .dial-inner {
            text-align: center;
            color: #fff;
            position: relative;
            z-index: 1;
            padding: 0 14px
        }

        .dial-timer {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            transition: color .3s
        }

        .dial-timer.over {
            color: #ff6b6b;
            animation: blink 1.2s infinite
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .45
            }
        }

        .dial-label {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-top: 12px
        }

        .dial-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, .6);
            margin-top: 8px;
            letter-spacing: 1px
        }

        .dial-tip {
            text-align: center;
            font-size: 11.5px;
            color: #a0a0b6;
            line-height: 1.7;
            padding: 0 30px;
            min-height: 32px
        }

        .hint-line {
            font-size: 12.5px;
            color: #7a7a92;
            line-height: 2
        }

        /* ============ 广场页 ============ */
        .sq-tabs {
            display: flex;
            background: #fff;
            border-radius: 14px;
            padding: 5px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05);
            margin-bottom: 14px
        }

        .sq-tab {
            flex: 1;
            text-align: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #8a8aa0;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s
        }

        .sq-tab.on {
            background: linear-gradient(135deg, #7C6CF0, #5B4BD6);
            color: #fff;
            box-shadow: 0 6px 14px rgba(108, 92, 231, .3)
        }

        .board-list {
            background: #fff;
            border-radius: 18px;
            padding: 6px 14px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05)
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px 2px;
            border-bottom: 1px solid #f4f4fa
        }

        .rank-row:last-child {
            border-bottom: none
        }

        .rank-row.me {
            background: linear-gradient(90deg, #f6f3ff, #fbfaff);
            border-radius: 12px;
            padding-left: 8px;
            padding-right: 8px;
            margin: 4px -6px;
            border-bottom: none
        }

        .rank-no {
            width: 26px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #b6b6cc;
            flex: none
        }

        .rank-row:nth-child(1) .rank-no,
        .rank-row:nth-child(2) .rank-no,
        .rank-row:nth-child(3) .rank-no {
            font-size: 18px
        }

        .rank-av {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f4f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex: none
        }

        .rank-name {
            flex: 1;
            font-size: 13.5px;
            font-weight: 600;
            color: #3b3b58;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0
        }

        .rank-name span.nm {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .me-tag {
            background: #6C5CE7;
            color: #fff;
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            flex: none
        }

        .rank-val {
            font-size: 14px;
            font-weight: 800;
            color: #3b3b58;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .rank-val.warn {
            color: #f03e3e
        }

        .swap-btn {
            width: 100%;
            margin-top: 16px;
            border: none;
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            font-size: 13.5px;
            font-weight: 700;
            color: #6C5CE7;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05)
        }

        .swap-btn:active {
            transform: scale(.99)
        }

        /* ---- 广场 · 睡友动态 ---- */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .feed-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px 15px;
            box-shadow: 0 6px 20px rgba(30, 30, 60, .05)
        }

        .feed-top {
            display: flex;
            align-items: center;
            gap: 9px
        }

        .feed-av {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f4f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex: none
        }

        .feed-owner {
            flex: 1;
            min-width: 0
        }

        .feed-name {
            font-size: 13px;
            font-weight: 700;
            color: #3b3b58;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .feed-time {
            font-size: 10.5px;
            color: #a8a8bc;
            margin-top: 2px
        }

        .feed-tag {
            background: #f2efff;
            color: #6C5CE7;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 7px;
            flex: none
        }

        .feed-text {
            font-size: 13px;
            color: #4a4a66;
            line-height: 1.75;
            margin-top: 10px;
            word-break: break-word;
            overflow: hidden;
            transition: max-height .38s cubic-bezier(.22, .9, .3, 1)
        }

        /* 长动态折叠：默认 6 行（折叠高度由 JS 按行高计算，见 applyFeedFold） */
        /* 无障碍：系统开启「减少动态效果」时关掉过渡 */
        @media (prefers-reduced-motion: reduce) {
            .feed-text {
                transition: none !important;
            }
        }

        .feed-expand {
            display: block;
            margin: 8px 0 0;
            padding: 4px 2px;
            border: none;
            background: none;
            color: #6C5CE7;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .feed-expand:active {
            opacity: .65
        }

        .feed-meta {
            display: flex;
            align-items: center;
            gap: 14px;

        /* ---- 折叠面板：展开 / 收起动画 ---- */
        .collapse {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 1.5s cubic-bezier(.22, .9, .3, 1);
        }

        .collapse.open {
            grid-template-rows: 1fr;
        }

        .collapse>.collapse-inner {
            overflow: hidden;
            min-height: 0;
        }

        /* ============ 睡眠战报详细数据动画 ============ */

        .report-details-collapse {
            margin-top: 0;
            transition:
                grid-template-rows .55s cubic-bezier(.22, .9, .3, 1),
                margin-top .55s cubic-bezier(.22, .9, .3, 1);
        }

        .report-details-collapse.open {
            margin-top: 10px;
        }

        /* 详细数据卡片逐个淡入、上浮 */
        @keyframes reportDetailIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 所有详细数据块 */
        .report-details-collapse.open .report-details>.pr-block {
            animation: reportDetailIn .42s cubic-bezier(.22, .9, .3, 1) both;
        }

        /* 依次错开，实现逐个出现的效果 */
        .report-details-collapse.open .report-details>.pr-block:nth-of-type(2) {
            animation-delay: .04s;
        }

        .report-details-collapse.open .report-details>.pr-block:nth-of-type(3) {
            animation-delay: .10s;
        }

        .report-details-collapse.open .report-details>.pr-block:nth-of-type(4) {
            animation-delay: .16s;
        }

        .report-details-collapse.open .report-details>.pr-block:nth-of-type(5) {
            animation-delay: .22s;
        }

        .report-details-collapse.open .report-details>.pr-block:nth-of-type(6) {
            animation-delay: .28s;
        }

        /* 尊重系统减少动态效果设置 */
        @media (prefers-reduced-motion: reduce) {
            .report-details-collapse.open .report-details>.pr-block {
                animation: none !important;
            }
        }

        /* 无障碍：系统开启「减少动态效果」时直接关掉 */
        @media (prefers-reduced-motion: reduce) {
            .collapse {
                transition: none !important;
            }
        }

        /* ---------------- 小工具 ---------------- */
        function $(s) { return document.querySelector(s); }

        function dateKey(ts) {
            var d = new Date(ts);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }
        function parseKey(k) {
            var p = k.split('-');
            return new Date(+p[0], +p[1] - 1, +p[2]).getTime();
        }
        function fmtHMS(ms) {
            var t = Math.max(0, Math.floor(ms / 1000));
            var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
            return pad(h) + ':' + pad(m) + ':' + pad(s);
        }
        function fmtDur(ms) {
            var m = Math.round(ms / 60000);
            var h = Math.floor(m / 60), mm = m % 60;
            return (h > 0 ? h + 'h ' : '') + mm + 'm';
        }
        function fmtDateTime(ts) {
            var d = new Date(ts);
            return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function startOfWeek(ts) {
            var d = new Date(ts);
            var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            var day = (x.getDay() + 6) % 7;
            x.setDate(x.getDate() - day);
            return x.getTime();
        }
        /* 入睡时刻映射：把 0:00-11:59 视作次日，方便比较"早晚" */
        function bedMinOf(ts) {
            var d = new Date(ts);
            var m = d.getHours() * 60 + d.getMinutes();
            if (m < 720) m += 1440;
            return m;
        }
        function wakeMinOf(ts) {
            var d = new Date(ts);
            var m = d.getHours() * 60 + d.getMinutes();
            if (m < 720) m += 1440;
            return m;
        }
        function minToHM(m) {
            if (m == null || m === 9999) return '--';
            m = m % 1440;
            return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
        }

        /* ---------------- 单条记录计算 ---------------- */
        function calcSession(s) {
            var ms = Math.max(0, s.end - s.start);
            var hrs = ms / 3600000;
            var tooLong = hrs > (+state.settings.maxSleep || 12);
            var tooShort = ms < (+state.settings.minSleep || 15) * 60000;
            return { ms: ms, hours: hrs, tooLong: tooLong, tooShort: tooShort, counted: !tooLong && !tooShort };
        }

        /* ---------------- 连续天数 ---------------- */
        function streakInfo() {
            var daysSet = {};
            state.sessions.forEach(function (s) {
                if (s.end) daysSet[dateKey(s.start)] = 1;
            });
            var days = Object.keys(daysSet).sort();
            if (!days.length) return { current: 0, max: 0 };

            var max = 1, run = 1;
            for (var i = 1; i < days.length; i++) {
                if (parseKey(days[i]) - parseKey(days[i - 1]) === 86400000) { run++; if (run > max) max = run; }
                else run = 1;
            }

            var today = dateKey(Date.now());
            var yest = dateKey(Date.now() - 86400000);
            var last = days[days.length - 1];
            if (last !== today && last !== yest) return { current: 0, max: max };

            var cur = 1;
            for (var j = days.length - 1; j > 0; j--) {
                if (parseKey(days[j]) - parseKey(days[j - 1]) === 86400000) cur++;
                else break;
            }
            return { current: cur, max: max };
        }

        /* ---------------- 统计 ---------------- */
        function computeStats() {
            var all = state.sessions.filter(function (s) { return s.end; });
            var ss = state.settings.semesterStart;
            var se = state.settings.semesterEnd;
            var monday = startOfWeek(Date.now());

            var totalMs = 0, semMs = 0, weekMs = 0, count = all.length;
            var longest = 0, earliest = null, latest = null;

            all.forEach(function (s) {
                var c = calcSession(s);
                totalMs += c.ms;

                var k = dateKey(s.start);
                var inSem = (!ss || k >= ss) && (!se || k <= se);
                if (inSem && c.counted) semMs += c.ms;

                if (s.start >= monday) {
                    weekMs += c.ms;
                    if (c.hours > longest) longest = c.hours;
                    var b = bedMinOf(s.start);
                    if (earliest === null || b < earliest) earliest = b;
                    var w = wakeMinOf(s.end);
                    if (latest === null || w > latest) latest = w;
                }
            });

            return {
                totalMs: totalMs, semMs: semMs, weekMs: weekMs, count: count,
                weekBest: { longest: longest, earliest: earliest, latest: latest }
            };
        }

        /* ---------------- 战报扩展：周期 / 评级 / 上课 / 修仙 ---------------- */
        var CYCLE_MIN = 90;
        var GRADE_LIST = ['C', 'B', 'A', 'S', 'SS', 'SSS'];

        function clockHM(ts) {
            var d = new Date(ts);
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        /* 睡眠周期：每 90 分钟一个周期，看余数判断醒来状态 */
        function cycleInfo(ms) {
            var mins = Math.max(0, Math.round(ms / 60000));
            var cycles = Math.floor(mins / CYCLE_MIN);
            var rem = mins % CYCLE_MIN;
            var status, cls;
            if (rem === 0) { status = '正好睡满整周期，完美收尾'; cls = 'good'; }
            else if (rem >= 75) { status = '在周期末尾醒来，状态最佳'; cls = 'good'; }
            else if (rem <= 15) { status = '刚进入新周期被叫醒，容易昏沉'; cls = 'bad'; }
            else { status = '处于周期中段'; cls = 'mid'; }
            return { mins: mins, cycles: cycles, rem: rem, status: status, cls: cls };
        }

        /* 推荐起床点：睡满下一整个周期的时间 */
        function wakeAdvice(s, cyc) {
            if (cyc.rem === 0) return null;
            var n = cyc.cycles + 1;
            var targetTs = s.start + n * CYCLE_MIN * 60000;
            var diff = Math.round((targetTs - s.end) / 60000);
            var pts = [];
            for (var i = 0; i < 3; i++) {
                pts.push(clockHM(s.start + (n + i) * CYCLE_MIN * 60000));
            }
            return { cycles: n, at: clockHM(targetTs), diff: diff, pts: pts };
        }

        /* 入睡时刻评级 */
        function bedRating(ts) {
            var h = new Date(ts).getHours();
            if (h >= 6 && h < 20) return { txt: '白天补觉', cls: 'mid', night: false };
            if (h >= 20 && h < 23) return { txt: '早睡标兵', cls: 'good', night: true };
            if (h >= 23 || h < 1) return { txt: '正常作息', cls: 'good', night: true };
            if (h < 3) return { txt: '熬夜边缘', cls: 'mid', night: true };
            return { txt: '修仙党', cls: 'bad', night: true };
        }

        /* 起床时段标签 */
        function wakeLabel(ts) {
            var h = new Date(ts).getHours();
            if (h >= 6 && h < 9) return { txt: '早八幸存', cls: 'good' };
            if (h >= 9 && h < 11) return { txt: '自然醒', cls: 'mid' };
            if (h >= 11 && h < 13) return { txt: '睡到中午', cls: 'mid' };
            if (h >= 13 && h < 18) return { txt: '睡到下午', cls: 'bad' };
            if (h >= 18) return { txt: '睡到夜里', cls: 'bad' };
            return { txt: '凌晨起床', cls: 'bad' };
        }

        /* 上课睡眠：8:00-20:00 之间开始的睡眠 */
        function isClassSleep(s) {
            var h = new Date(s.start).getHours();
            return h >= 8 && h < 20;
        }
        function classPeriods(ms) {
            var cm = +state.settings.classMin || 40;
            var bm = state.settings.breakMin == null ? 5 : +state.settings.breakMin;

            if (bm < 0) bm = 0;

            // 总睡眠分钟数
            var totalMin = Math.max(0, ms / 60000);

            // 每经过一个完整的「上课 + 课间」周期，扣除课间时间
            var cycleMin = cm + bm;
            var breakCount = cycleMin > 0
                ? Math.floor(totalMin / cycleMin)
                : 0;

            // 实际上课睡眠时间，不计算课间
            var classSleepMin = Math.max(0, totalMin - breakCount * bm);

            // 换算成课时，保留真实小数
            return classSleepMin / cm;
        }

        /* 同一位置的累计次数与时长 */
        function locStatsOf(s) {
            var key = (s.locType || '') + '|' + (s.locName || '');
            var count = 0, ms = 0;
            state.sessions.forEach(function (x) {
                if (!x.end) return;
                if (((x.locType || '') + '|' + (x.locName || '')) !== key) return;
                count++;
                ms += Math.max(0, x.end - x.start);
            });
            return { count: count, hours: ms / 3600000 };
        }

        /* 学期进度：按学期起止日期计算，未设置时退回学期目标进度 */
        function semesterProgress() {
            var ss = state.settings.semesterStart, se = state.settings.semesterEnd;
            if (!ss || !se) return null;
            var a = parseKey(ss), b = parseKey(se) + 86400000;
            if (b <= a) return null;
            return Math.max(0, Math.min(100, (Date.now() - a) / (b - a) * 100));
        }

        /* 修仙值：22:00 入睡为 0，03:00 入睡为 100 */
        function immortalScore(ts) {
            var d = new Date(ts);
            var m = d.getHours() * 60 + d.getMinutes();
            if (m < 720) m += 1440;
            return Math.max(0, Math.min(100, Math.round((m - 1320) / 300 * 100)));
        }

        /* 综合评级：区分上课睡眠与晚上睡眠 */
        function gradeOf(c, cyc, bed, isClass, periods) {
            var g;
            if (isClass) {
                // 课时数可能带小数（如 1.7 节课），先取整再映射档位，否则查表得到 undefined
                g = Math.min(6, Math.floor(periods));
            } else {
                g = c.hours < 5 ? 1
                    : c.hours < 7 ? 2
                        : c.hours < 8 ? 3
                            : c.hours < 9 ? 4
                                : c.hours < 10 ? 5
                                    : 6;
                if (cyc.rem === 0 || cyc.rem >= 75) g++;
                else if (cyc.rem <= 15) g--;
                if (bed.txt === '早睡标兵') g++;
                else if (bed.txt === '修仙党') g--;
                if (c.tooLong) g = 1;
            }
            if (c.tooShort) g = 1;
            return GRADE_LIST[Math.max(1, Math.min(6, g)) - 1];
        }

        /* ---------------- 战报海报 ---------------- */
        function showReport(s) {

            var tlHtml = '<div class="pr-tl">' +

            // 将详细统计集中起来
            var detailHtml =

            openModal(

        // 睡眠战报详细数据展开 / 收起
        function toggleReportDetails() {
            var panel = document.getElementById('reportDetails');
            var btn = document.getElementById('reportDetailsBtn');

            if (!panel || !btn) return;

            // 判断当前是否处于折叠状态
            var willExpand = !panel.classList.contains('open');

            // 切换展开状态
            panel.classList.toggle('open', willExpand);

                ? '收起详细数据 ▲'

        /* ==================================================================
        位置管理（多位置存储 + 定位获取 + 坐标查看/编辑）
        ================================================================== */
        function getLocById(id) {
            for (var i = 0; i < state.locations.length; i++) {
                if (state.locations[i].id === id) return state.locations[i];
            }
            return null;
        }

        /* ---- 距离计算（米），用于“查找附近已存位置” ---- */
        function distanceM(a, b) {
            if (!a || !b) return Infinity;
            var R = 6371000, rad = Math.PI / 180;
            var dLat = (b.lat - a.lat) * rad;
            var dLng = (b.lng - a.lng) * rad;
            var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(a.lat * rad) * Math.cos(b.lat * rad) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
        }
        function findNearbyLoc(coord, radius) {
            if (!coord) return null;
            var best = null, bestD = radius;
            state.locations.forEach(function (l) {
                if (!l.coord) return;
                var d = distanceM(coord, l.coord);
                if (d <= bestD) { bestD = d; best = l; }
            });
            return best;
        }

        /* ---- 坐标输入框读写 ---- */
        function parseCoord(latId, lngId) {
            var la = document.getElementById(latId), ln = document.getElementById(lngId);
            if (!la || !ln) return null;
            var a = parseFloat(la.value), b = parseFloat(ln.value);
            if (isNaN(a) || isNaN(b)) return null;
            if (a < -90 || a > 90 || b < -180 || b > 180) return null;
            return { lat: +a.toFixed(5), lng: +b.toFixed(5) };
        }
        function coordEmpty(latId, lngId) {
            var la = document.getElementById(latId), ln = document.getElementById(lngId);
            if (!la || !ln) return true;
            return !la.value.trim() && !ln.value.trim();
        }

        /* ---- 定位：获取当前位置 → 查找附近已存位置 → 填入坐标 ---- */
        function grabGPS(latId, lngId, statusId) {
            latId = latId || 'locLat';
            lngId = lngId || 'locLng';
            statusId = statusId || 'gpsStatus';

            var el = document.getElementById(statusId);
            if (!el) return;

            if (!navigator.geolocation) {
                el.textContent = '❌ 当前浏览器不支持定位，可手动填写经纬度';
                return;
            }

            el.textContent = '⏳ 正在获取你的位置…';

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var lat = +pos.coords.latitude.toFixed(5);
                    var lng = +pos.coords.longitude.toFixed(5);
                    var acc = pos.coords.accuracy ? Math.round(pos.coords.accuracy) : null;

                    var la = document.getElementById(latId);
                    var ln = document.getElementById(lngId);
                    if (la) la.value = lat;
                    if (ln) ln.value = lng;

                    if (latId === 'locLat') {
                        pendingCoord = { lat: lat, lng: lng };
                    }

                    el.textContent = '✅ 已获取：' + lat + ', ' + lng +
                        (acc ? '（精度约 ' + acc + ' 米）' : '') + '，可直接保存';
                },
                function (err) {
                    var msg = '❌ 定位失败';
                    if (err && err.code === 1) msg = '❌ 你拒绝了定位授权';
                    else if (err && err.code === 2) msg = '❌ 暂时无法获取位置';
                    else if (err && err.code === 3) msg = '❌ 定位超时';
                    el.textContent = msg + '，可手动填写经纬度或选择已有位置';
                },
                { timeout: 12000, maximumAge: 0, enableHighAccuracy: true }
            );
        }

        /* ---- 睡觉页一键定位：匹配最近已存位置 ---- */
        var MATCH_RADIUS = 800; // 800 米内自动切换，超过则弹窗确认

        function quickLocate() {
            if (state.active) { toast('睡眠中不能切换位置，请先起床'); return; }

            if (!state.locations.length) {
                toast('还没有保存的位置，先添加一个吧（需要绑定坐标）');
                openLocPicker();
                return;
            }
            if (!navigator.geolocation) {
                toast('当前浏览器不支持定位，请手动选择位置');
                return;
            }

            var btn = document.getElementById('quickLocBtn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ 正在获取你的位置…'; }

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var me = {
                        lat: +pos.coords.latitude.toFixed(5),
                        lng: +pos.coords.longitude.toFixed(5)
                    };

                    // 在所有已存位置中找最近的
                    var best = null, bestD = Infinity;
                    state.locations.forEach(function (l) {
                        if (!l.coord) return;
                        var d = distanceM(me, l.coord);
                        if (d < bestD) { bestD = d; best = l; }
                    });

                    restoreQuickBtn();

                    if (!best) {
                        toast('已存位置都没有坐标，点「切换」进去补个定位吧');
                        return;
                    }

                    if (bestD <= MATCH_RADIUS) {
                        state.currentLocId = best.id;
                        save();
                        renderSleep();
                        toast('已定位到最近位置：' + best.type + ' · ' + best.name +
                            '（约 ' + Math.round(bestD) + ' 米）');
                    } else {
                        openModal(
                            '<div class="modal-head">最近的建筑有点远</div>' +
                            '<div class="modal-sub">离你最近的已存位置是：' +
                            (LOC_TYPES[best.type] || '📍') + ' ' + esc(best.type) + ' · ' + esc(best.name) +
                            '，约 <b>' + Math.round(bestD) + '</b> 米。<br>要使用它，还是添加一个新位置？</div>' +
                            '<button class="btn-primary" onclick="pickLoc(\'' + best.id + '\')">就选这个（' + Math.round(bestD) + ' 米）</button>' +
                            '<button class="btn-ghost" onclick="closeModal();openLocPicker()">添加新位置</button>'
                        );
                    }
                },
                function (err) {
                    restoreQuickBtn();
                    var msg = '定位失败或未授权，请手动选择位置';
                    if (err && err.code === 1) msg = '你拒绝了定位授权，请手动选择位置';
                    else if (err && err.code === 3) msg = '定位超时，请手动选择位置';
                    toast(msg);
                },
                { timeout: 12000, maximumAge: 0, enableHighAccuracy: true }
            );

            function restoreQuickBtn() {
                var b = document.getElementById('quickLocBtn');
                if (b) {
                    b.disabled = false;
                    b.textContent = '📍 定位匹配最近位置';
                }
            }
        }

        /* ==================================================================
        广场
        ================================================================== */
        function ensureBoard() {
            if (!state.board || !state.board.list || !state.board.list.length) {
                state.board = { list: genBoard() };
                save();
            }
        }

        function genBoard() {
            var names = V_NAMES.slice();
            for (var i = names.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = names[i]; names[i] = names[j]; names[j] = tmp;
            }
            var out = [];
            for (var k = 0; k < 29; k++) {
                out.push({
                    id: 'v' + k,
                    name: names[k],
                    avatar: V_AVATARS[Math.floor(Math.random() * V_AVATARS.length)],
                    maxSleep: +(4 + Math.random() * 13).toFixed(1),
                    bedMin: Math.floor(1140 + Math.random() * 480),   // 19:00 ~ 03:00
                    streak: Math.floor(Math.random() * 120)
                });
            }
            return out;
        }

        function buildBoardRows(tab) {
            ensureBoard();
            var rows = state.board.list.map(function (v) {
                return {
                    id: v.id,
                    name: v.name,
                    avatar: v.avatar,
                    isMe: false,
                    value: tab === 'duration' ? v.maxSleep : (tab === 'early' ? v.bedMin : v.streak)
                };
            });

            var all = state.sessions.filter(function (s) { return s.end; });
            var myMax = 0;
            all.forEach(function (s) {
                var h = calcSession(s).hours;
                if (h > myMax) myMax = h;
            });
            var myBed = null;
            all.forEach(function (s) {
                var b = bedMinOf(s.start);
                // 仅统计 19:00 ~ 03:00 入睡的记录
                // bedMinOf 规则：19:00 = 1140，23:59 = 1439，00:00 = 1440，03:00 = 1620
                if (b < 1140 || b > 1620) return;
                if (myBed === null || b < myBed) myBed = b;
            });
            var myStreak = streakInfo().current;

            var myValue;
            if (tab === 'duration') myValue = myMax;
            else if (tab === 'early') myValue = (myBed === null ? 9999 : myBed);
            else myValue = myStreak;

            rows.push({
                id: 'me',
                name: state.user.nickname,
                avatar: '😴',
                isMe: true,
                value: myValue,
                hasData: all.length > 0
            });

            rows.sort(function (a, b) {
                return tab === 'early' ? a.value - b.value : b.value - a.value;
            });
            return rows;
        }

        function squareTabsHtml(tab) {
            return '<div class="sq-tabs">' +
                '<div class="sq-tab ' + (tab === 'feed' ? 'on' : '') + '" onclick="setBoardTab(\'feed\')">睡友动态</div>' +
                '<div class="sq-tab ' + (tab === 'duration' ? 'on' : '') + '" onclick="setBoardTab(\'duration\')">睡眠时长榜</div>' +
                '<div class="sq-tab ' + (tab === 'early' ? 'on' : '') + '" onclick="setBoardTab(\'early\')">最早入睡榜</div>' +
                '<div class="sq-tab ' + (tab === 'streak' ? 'on' : '') + '" onclick="setBoardTab(\'streak\')">连续天数榜</div>' +
                '</div>';

        /* ---- 睡友动态：渲染（含点赞 / 踩 / 举报） ---- */
        function getFeedReaction(id) {
            if (!state.feedReactions) state.feedReactions = {};
            if (!state.feedReactions[id]) {
                state.feedReactions[id] = { like: false, dislike: false, report: false, reportReason: '' };
            }

        /* ---- 长动态折叠 ---- */
        function feedTextHtml(f) {
            var expanded = !!feedExpanded[f.id];
            return '<div class="feed-text' + (expanded ? '' : ' folded') + '"' +
                ' id="feedText-' + f.id + '" data-fid="' + f.id + '">' +
                esc(f.text) +
                '</div>' +
                '<button class="feed-expand" id="feedExpand-' + f.id + '" style="display:none"' +
                ' onclick="toggleFeedExpand(\'' + f.id + '\')">' +
                (expanded ? '收起' : '展开全文') +
                '</button>';
        }

        function foldedHeight(el) {
            var lh = parseFloat(getComputedStyle(el).lineHeight);
            if (!lh || isNaN(lh)) lh = 22.75;   // 13px * 1.75 的兜底
            return lh * 6;                       // 折叠 6 行
        }

        function toggleFeedExpand(id) {
            var el = document.getElementById('feedText-' + id);
            var btn = document.getElementById('feedExpand-' + id);
            if (!el) return;

            var on = !feedExpanded[id];
            feedExpanded[id] = on;               // 只存内存，不 save()

            if (on) {
                // 展开：从 6 行高度过渡到完整高度
                var full = el.scrollHeight;
                el.classList.remove('folded');
                el.style.maxHeight = full + 'px';

                // 过渡结束后解除限制，避免窗口缩放后内容被截断
                clearTimeout(el._mhTimer);
                el._mhTimer = setTimeout(function () {
                    if (feedExpanded[id]) el.style.maxHeight = 'none';
                }, 420);
            } else {
                // 收起：先落到完整高度，再过渡回 6 行
                el.style.maxHeight = el.scrollHeight + 'px';
                void el.offsetHeight;            // 强制重排，保证过渡生效
                el.classList.add('folded');
                el.style.maxHeight = foldedHeight(el) + 'px';
            }

            if (btn) btn.textContent = on ? '收起' : '展开全文';
        }

        /* 渲染后检测：只有真正溢出才显示「展开全文」 */
        function applyFeedFold() {
            var els = document.querySelectorAll('.feed-text[data-fid]');
            Array.prototype.forEach.call(els, function (el) {
                var id = el.getAttribute('data-fid');
                var btn = document.getElementById('feedExpand-' + id);
                if (!btn) return;
                if (el.offsetParent === null) return;          // 页面不可见，跳过

                // 先解除高度限制，测得完整内容高度
                el.style.maxHeight = 'none';
                var full = el.scrollHeight;
                var foldedH = foldedHeight(el);
                var expanded = !!feedExpanded[id];

                // 内容不超过 6 行：不折叠、不显示按钮
                if (full <= foldedH + 2) {
                    el.classList.remove('folded');
                    el.style.maxHeight = '';
                    btn.style.display = 'none';
                    return;
                }

                btn.style.display = '';
                btn.textContent = expanded ? '收起' : '展开全文';

                if (expanded) {
                    el.classList.remove('folded');
                    el.style.maxHeight = 'none';
                } else {
                    // 初始折叠：从 none 到具体值不会触发过渡，直接落位
                    el.classList.add('folded');
                    el.style.maxHeight = foldedH + 'px';
                }
            });
        }

        /* ---- 睡友动态：评论（默认折叠，点击展开） ---- */
        function feedCommentsHtml(f) {
            var list = FEED_COMMENTS[f.id] || [];
            if (!list.length) return '';

            var open = !!feedCommentsOpen[f.id];
            return '<div class="feed-comments' + (open ? ' open' : '') + '" id="feedComments-' + f.id + '">' +
                '<div class="feed-comments-inner">' +
                '<div class="feed-cmt-title">热门评论</div>' +
                list.map(function (c) {
                    return '<div class="feed-cmt">' +
                        '<div class="feed-cmt-av">' + (c.avatar || '🙂') + '</div>' +
                        '<div class="feed-cmt-body">' +
                        '<div class="feed-cmt-head">' +
                        '<span class="feed-cmt-name">' + esc(c.name) + '</span>' +
                        '<span class="feed-cmt-time">' + esc(c.time || '') + '</span>' +
                        '</div>' +
                        '<div class="feed-cmt-text">' + esc(c.text) + '</div>' +
                        '</div>' +
                        '</div>';
                }).join('') +
                '</div>' +
                '</div>';
        }

        function toggleFeedComments(id) {
            var el = document.getElementById('feedComments-' + id);
            var btn = document.getElementById('feedCommentBtn-' + id);
            if (!el) return;

            var on = !feedCommentsOpen[id];
            feedCommentsOpen[id] = on;            // 只存内存，不 save()
            if (btn) btn.classList.toggle('on', on);

            clearTimeout(el._mhTimer);
            if (on) {
                // 展开：从 0 过渡到内容高度
                el.classList.add('open');
                el.style.maxHeight = el.scrollHeight + 'px';
                el._mhTimer = setTimeout(function () {
                    if (feedCommentsOpen[id]) el.style.maxHeight = 'none';
                }, 320);
            } else {
                // 收起：先固定当前高度，再过渡回 0
                el.style.maxHeight = el.scrollHeight + 'px';
                void el.offsetHeight;            // 强制重排，保证过渡生效
                el.classList.remove('open');
                el.style.maxHeight = '0px';
            }
        }

        /* ---------------- 数据管理：导出 / 导入 / 注销 ---------------- */

        /* 中文安全 Base64 编解码 */
        function b64Encode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (_, p) {
                return String.fromCharCode(parseInt(p, 16));
            }));
        }
        function b64Decode(str) {
            return decodeURIComponent(atob(str).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        /* 复制到剪贴板（含降级方案） */
        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, text.length);
                var ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
                ok ? resolve() : reject(new Error('copy failed'));
            });
        }

        /* 导出：整个 state 序列化后 Base64 复制到剪贴板 */
        function exportData() {
            if (!state.user) { toast('当前没有可导出的数据'); return; }

            var payload;
            try {
                payload = b64Encode(JSON.stringify(state));
            } catch (e) {
                toast('导出失败，请稍后重试');
                return;
            }

            copyText(payload).then(function () {
                toast('已复制到剪贴板，共 ' + payload.length + ' 字符');
            }).catch(function () {
                openModal(
                    '<div class="modal-head">手动复制</div>' +
                    '<div class="modal-sub">自动复制失败，请长按下方文本框全选后复制。</div>' +
                    '<textarea id="exportArea" readonly style="width:100%;min-height:110px;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:10px;font-size:12px;color:#1c1c28;outline:none;resize:vertical;word-break:break-all">' + payload + '</textarea>' +
                    '<button class="btn-primary" onclick="closeModal()">完成</button>'
                );
                var el = document.getElementById('exportArea');
                if (el) { el.focus(); el.select(); }
            });
        }

        /* 打开导入面板 */
        function openImport() {
            openModal(
                '<div class="modal-head">导入数据</div>' +
                '<div class="modal-sub">粘贴之前导出的 Base64 字符串。<b style="color:#e03131">导入会覆盖本机现有数据</b>，请谨慎操作。</div>' +
                '<textarea id="importArea" placeholder="在此粘贴 Base64 数据…" style="width:100%;min-height:110px;border:1.5px solid #eceaf6;background:#fafaff;border-radius:12px;padding:10px;font-size:12px;color:#1c1c28;outline:none;resize:vertical;word-break:break-all"></textarea>' +
                '<button class="btn-ghost" onclick="pasteFromClipboard()">📋 从剪贴板读取</button>' +
                '<button class="btn-primary" onclick="doImport()">确认导入</button>' +
                '<button class="btn-ghost" onclick="closeModal()">取消</button>'
            );
        }

        function pasteFromClipboard() {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                toast('当前浏览器不支持读取剪贴板，请手动粘贴');
                return;
            }
            navigator.clipboard.readText().then(function (txt) {
                var el = document.getElementById('importArea');
                if (el) el.value = (txt || '').trim();
                toast('已读取剪贴板内容');
            }).catch(function () {
                toast('读取失败，请手动粘贴');
            });
        }

        /* 执行导入 */
        function doImport() {
            var el = document.getElementById('importArea');
            var raw = ((el && el.value) || '').replace(/\s+/g, '');
            if (!raw) { toast('请先粘贴导出的数据'); return; }

            var d = null;
            try {
                d = JSON.parse(b64Decode(raw));
            } catch (e) {
                toast('数据无法解析，请检查是否完整');
                return;
            }
            if (!d || typeof d !== 'object' || Array.isArray(d)) {
                toast('数据格式不正确');
                return;
            }
            if (!('user' in d) && !('sessions' in d)) {
                toast('这似乎不是「校园睡」的数据');
                return;
            }

            if (!confirm('导入将覆盖当前本机所有数据，确定继续吗？')) return;

            state.user = d.user || null;
            state.sessions = Array.isArray(d.sessions) ? d.sessions : [];
            state.active = d.active || null;
            state.locations = Array.isArray(d.locations) ? d.locations : [];
            state.currentLocId = d.currentLocId || null;
            state.board = d.board || null;
            state.boardTab = d.boardTab || 'feed';
            state.tab = d.tab || 'progress';
            feedExpanded = {};
            state.presetIdx = d.presetIdx || 0;
            state.showAllRecords = false;
            state.settings = Object.assign(
                { target: 100, maxSleep: 12, minSleep: 15, classMin: 40, breakMin: 5, semesterStart: '', semesterEnd: '' },
                d.settings || {}
            );

            save();
            closeModal();
            renderAll();
            toast(state.user ? '导入成功 ✅' : '导入完成，请重新填写信息');
        }

            try { localStorage.removeItem(LS_KEY); } catch (e) { }

            state = {
                user: null,
                settings: { target: 100, maxSleep: 12, minSleep: 5, classMin: 40, breakMin: 5, semesterStart: '', semesterEnd: '' },
                sessions: [],
                active: null,
                locations: [],
                currentLocId: null,
                board: null,
                boardTab: 'feed',
                feedReactions: {},
                tab: 'progress',
                presetIdx: 0,
                showAllRecords: false
            };

            devOpen = false;
            dataOpen = false;
            feedExpanded = {};
            pendingCoord = null;
            pendingType = '宿舍';
            pendingName = '';

            closeModal();

            ['regSchool', 'regCollege', 'regId', 'regNick'].forEach(function (id) {

            document.getElementById('epSchool').value = p.school;

        function doRegister() {
            var school = (document.getElementById('regSchool').value || '').trim();
            var college = (document.getElementById('regCollege').value || '').trim();
            var sid = (document.getElementById('regId').value || '').trim();
            var nick = (document.getElementById('regNick').value || '').trim();

            if (!nick) { toast('给自己起个昵称吧 🙂'); return; }

            state.user = {
                school: school || '社会大学',
                college: college || '躺平学院',
                studentId: sid || '------',
                nickname: nick
            };
            save();
            renderAll();
            toast('欢迎来到校园睡 🌙');
        }

        /* ==================================================================
        实时计时器
        ================================================================== */
        setInterval(function () {
            if (!state.active) return;
            var el = document.getElementById('dialTimer');
            if (!el) return;

            var ms = Date.now() - state.active.start;
            el.textContent = fmtHMS(ms);

            var maxH = +state.settings.maxSleep || 12;
            var over = ms / 3600000 > maxH;
            el.classList.toggle('over', over);

            var tip = document.getElementById('dialTip');
            if (tip) {
                tip.textContent = over
                    ? '⚠️ 已超过上限，本次将按「昏迷」记录，不计入学期成绩'
                    : '注意：单次睡眠上限 ' + maxH + ' 小时，超时将按「昏迷」处理。';
            }
        }, 500);

        /* ==================================================================
        启动
        ================================================================== */
        (function init() {
            load();
            if (state.user) {
                renderAll();
            } else {
                $('#registerScreen').classList.remove('hidden');
                $('#mainScreen').classList.add('hidden');
            }
            // 防意外退出丢失进行中的睡眠：每次进入都检查
            if (state.active) {
                var hrs = (Date.now() - state.active.start) / 3600000;
                if (hrs > 48) {
                    // 极端异常情况（电脑长期挂起），提示用户
                    setTimeout(function () { toast('检测到一条超长睡眠记录，记得去起床 😴'); }, 800);
                }
            }
        })();

        window.addEventListener('beforeunload', save);

        /* ==================================================================
        PWA：注册 Service Worker（可安装 / 离线可用）
        ================================================================== */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () { });
            });
        }
