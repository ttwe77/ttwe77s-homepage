<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人状态</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#252b3a;
    --fg:#e9ecf3; --muted:#8b93a7;
    --online:#3ddc84; --away:#ffcc4d; --busy:#ff6b6b; --offline:#6b7280;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 500px at 50% -20%,#1e2433,#0f1115 70%);
    color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  }
  .card{
    width:100%;max-width:540px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:26px 26px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5)
  }
  header{display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .avatar{
    width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(135deg,#4f7cff,#a855f7);color:#fff;font-size:22px;font-weight:700
  }
  h1{margin:0;font-size:19px;font-weight:650}
  .status{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted);font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--offline);flex:0 0 auto}
  .dot.online{background:var(--online);animation:pulse 2s infinite}
  .dot.away{background:var(--away)}
  .dot.busy{background:var(--busy)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}
    70%{box-shadow:0 0 0 10px rgba(61,220,132,0)}
    100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}
  }
  h2{
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin:20px 0 10px;font-weight:600
  }
  ul.programs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.programs li{
    display:flex;align-items:baseline;gap:10px;background:#1d2129;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px
  }
  .pname{font-weight:600}
  .pdetail{color:var(--muted);font-size:13px}
  .psince{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
  .empty{color:var(--muted);font-size:14px;padding:10px 2px}
  footer{
    margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:4px
  }
  footer b{color:#c8cfdd;font-weight:500}
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="avatar" id="avatar">?</div>
    <div>
      <h1 id="name">加载中…</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">正在获取状态</span>
      </div>
    </div>
  </header>

  <section>
    <h2>正在运行</h2>
    <ul class="programs" id="programs"></ul>
  </section>

  <footer>
    <div>服务器最后更新：<b id="server-updated">--</b> <span id="server-ago"></span></div>
    <div>浏览器最后更新：<b id="client-updated">--</b> <span id="client-ago"></span></div>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var STATUS_URL = '/status/data/device-01.json';  // ← 固定数据源路径
  var REFRESH_MS = 10000;          // 轮询间隔 10s
  var STALE_MS   = 5 * 60 * 1000;  // 服务端超过 5 分钟没更新 → 视为离线

  var STATE = {
    online:  { text: '在线', cls: 'online'  },
    away:    { text: '离开', cls: 'away'    },
    busy:    { text: '忙碌', cls: 'busy'    },
    offline: { text: '离线', cls: 'offline' }
  };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtTime(input) {
    if (!input) return '--';
    var d = input instanceof Date ? input : new Date(input);
    if (isNaN(d.getTime())) return '--';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function agoText(ms) {
    if (!ms) return '';
    var s = Math.floor((Date.now() - ms) / 1000);
    if (s < 0) s = 0;
    if (s < 60)  return '（' + s + ' 秒前）';
    var m = Math.floor(s / 60);
    if (m < 60)  return '（' + m + ' 分钟前）';
    var h = Math.floor(m / 60);
    if (h < 24)  return '（' + h + ' 小时前）';
    return '（' + Math.floor(h / 24) + ' 天前）';
  }

  var lastServerMs = null;     // 服务端最后更新（来自 JSON）
  var lastClientMs = null;     // 客户端最后更新（本地拉取成功时间）

  // 从整份数据里取出「正在运行」列表
  // 新格式：单条 program_name / since
  // 旧格式：programs 数组（兼容保留）
  function normalizePrograms(data) {
    if (Array.isArray(data.programs) && data.programs.length) {
      return data.programs;
    }
    if (data.program_name) {
      return [{
        name:   data.program_name,
        detail: data.program_detail || data.detail || '',
        since:  data.since || ''
      }];
    }
    return [];
  }

  function renderPrograms(data) {
    var ul = $('programs');
    ul.textContent = '';

    var list = normalizePrograms(data);

    if (list.length === 0) {
      var em = document.createElement('li');
      em.className = 'empty';
      em.textContent = '暂无正在运行的程序';
      ul.appendChild(em);
      return;
    }

    list.forEach(function (p) {
      var li = document.createElement('li');

      var name = document.createElement('span');
      name.className = 'pname';
      name.textContent = p.name || '未命名';
      li.appendChild(name);

      if (p.detail) {
        var d = document.createElement('span');
        d.className = 'pdetail';
        d.textContent = p.detail;
        li.appendChild(d);
      }

      if (p.since) {
        var t = new Date(p.since);
        var s = document.createElement('span');
        s.className = 'psince';
        s.textContent = isNaN(t.getTime()) ? p.since : '自 ' + fmtTime(t);
        li.appendChild(s);
      }

      ul.appendChild(li);
    });
  }

  function render(data) {
    var name = data.name || '匿名';
    $('name').textContent = name;
    $('avatar').textContent = (name.trim().charAt(0) || '?').toUpperCase();

    var raw = data.server_updated ? new Date(data.server_updated).getTime() : NaN;
    lastServerMs = isFinite(raw) ? raw : null;

    var stale = !lastServerMs || (Date.now() - lastServerMs > STALE_MS);
    var key = String(data.status || 'offline').toLowerCase();
    if (!STATE[key]) key = 'offline';
    if (stale) key = 'offline';

    $('dot').className = 'dot ' + STATE[key].cls;
    $('status-text').textContent = stale
      ? '离线（数据已过期）'
      : (data.status_text || STATE[key].text);

    renderPrograms(data);
    $('server-updated').textContent = fmtTime(data.server_updated);
    tick();
  }

  function tick() {
    $('server-ago').textContent = agoText(lastServerMs);
    $('client-ago').textContent = agoText(lastClientMs);
  }

  function refresh() {
    var url = STATUS_URL + '?_=' + Date.now();   // 强制绕过缓存
    return fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        lastClientMs = Date.now();
        $('client-updated').textContent = fmtTime(new Date(lastClientMs));
        render(data);
      })
      .catch(function (e) {
        $('dot').className = 'dot offline';
        $('status-text').textContent = '无法获取状态（' + e.message + '）';
      });
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refresh();
  });
})();
</script>
</body>
</html>
