<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#21a5e3">

  <!-- 主题初始化：在样式解析前决定深色 / 浅色，避免刷新时闪白 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- 字体初始化：沿用首页的字体选择 -->
  <script id="font-init">
    (function () {
      try {
        if (localStorage.getItem('home-font') === 'system') {
          document.documentElement.style.setProperty('--font-sans', 'var(--font-fallback)');
        }
      } catch (e) { }
    })();
  </script>

  <title>音乐盒 | 七七的折腾笔记</title>
  <link rel="icon" type="image/svg+xml" href="/src/music.svg">
  <link rel="apple-touch-icon" href="/src/apple-touch-icon.png">
  <meta name="description" content="七七的折腾笔记 · 自建音乐播放器，收录原神 OST 等纯音乐，边逛边听。" />

  <!-- 音频直连网易云外链，提前建连省一点首播等待 -->
  <link rel="preconnect" href="https://music.163.com" crossorigin>
  <link rel="dns-prefetch" href="https://music.163.com">

  <style>
    /* ============ 自定义字体（woff2） ============ */
    @font-face {
      font-family: "Blog-WenYuan";
      src: url("/blog/fonts/77StandardRound-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan";
      src: url("/blog/fonts/77StandardRound-SemiBold.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan";
      src: url("/blog/fonts/77StandardRound-Bold.woff2") format("woff2");
      font-weight: 700 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan-Fallback";
      src: url("/src/ttf/fonts/standard-round/subset/fallback/77StandardRound-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan-Fallback";
      src: url("/src/ttf/fonts/standard-round/subset/fallback/77StandardRound-SemiBold.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan-Fallback";
      src: url("/src/ttf/fonts/standard-round/subset/fallback/77StandardRound-Bold.woff2") format("woff2");
      font-weight: 700 900;
      font-style: normal;
      font-display: swap;
    }

    /* ============ 设计令牌 ============ */
    :root {
      --color-primary: #21a5e3;
      --color-primary-hover: #0E7AE0;
      --color-primary-active: #0B6BC5;
      --color-blue-light: #ABD7FF;
      --color-periwinkle: #BEC0EC;
      --color-orchid: #4454F8;
      --color-bg-white: #FFFFFF;
      --color-bg-light: #FAFAFA;
      --color-bg-soft: #F5F5F5;
      --color-border: #EDEDED;
      --color-border-strong: #D4D4D4;
      --color-text-primary: #1F1F1F;
      --color-text-body: #404040;
      --color-text-secondary: #737373;
      --color-text-disabled: #A3A3A3;
      --color-danger: #F21B28;
      --color-success: #169B5B;
      --color-warning: #FFD84D;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, .06);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .1);
      --shadow-blue: 0 6px 20px rgba(18, 138, 250, .25);
      --font-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-sans: "Blog-WenYuan", "Blog-WenYuan-Fallback", var(--font-fallback);
      --topbar-h: 56px;
      --page-ease: cubic-bezier(.65, .05, .36, 1);
      --track: #e8eef5;
    }

    /* ============ 基础 ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--color-bg-light);
      color: var(--color-text-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    a {
      text-decoration: none;
      color: inherit
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit
    }

    /* 背景氛围（与首页一致） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 4%, rgba(18, 138, 250, .12), transparent 42%),
        radial-gradient(circle at 92% -4%, rgba(171, 215, 255, .42), transparent 46%),
        radial-gradient(circle at 72% 96%, rgba(190, 192, 236, .22), transparent 46%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(18, 138, 250, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 138, 250, .035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ============ 顶栏 ============ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: rgba(255, 255, 255, .92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto
    }

    .brand__mark {
      width: 80px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand__mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .brand__name {
      font-size: 16px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: .04em;
      white-space: nowrap
    }

    .topbar__spacer {
      flex: 1 1 auto
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #3f568c;
      background: transparent;
      transition: background .18s ease, transform .12s ease, color .18s ease;
    }

    .icon-btn:hover {
      background: rgba(63, 86, 140, .08)
    }

    .icon-btn:active {
      transform: scale(.94)
    }

    .icon-btn__moon {
      display: none
    }

    :root[data-theme="dark"] .icon-btn__sun {
      display: none
    }

    :root[data-theme="dark"] .icon-btn__moon {
      display: block
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px 0 10px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      color: #3f568c;
      background: rgba(63, 86, 140, .06);
      transition: background .18s ease, color .18s ease, transform .12s ease;
      white-space: nowrap
    }

    .back-link:hover {
      background: rgba(63, 86, 140, .12)
    }

    .back-link:active {
      transform: scale(.97)
    }

    /* ============ 页面骨架 ============ */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + 40px) 20px 64px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px
    }

    .page-head h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--color-text-primary);
      line-height: 1.3
    }

    .page-head h1 span {
      color: var(--color-primary)
    }

    .page-head p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--color-text-secondary)
    }

    .badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-primary);
      background: rgba(33, 165, 227, .1);
      border: 1px solid rgba(33, 165, 227, .18)
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .18)
    }

    .card {
      position: relative;
      border-radius: var(--radius-xl);
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card);
      overflow: hidden
    }

    /* ============ 播放器主体 ============ */
    .player {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 26px;
      padding: 24px;
      align-items: center
    }

    .cover {
      position: relative;
      width: 232px;
      height: 232px;
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .5), transparent 58%),
        linear-gradient(142deg, #7FC4EA 0%, #21a5e3 48%, #4454F8 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(33, 165, 227, .28);
      transition: transform .5s var(--page-ease)
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 78% 78%, rgba(255, 255, 255, .28), transparent 42%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, .07) 0 2px, transparent 2px 9px);
      pointer-events: none
    }

    .cover__icon {
      position: relative;
      z-index: 1;
      width: 84px;
      height: 84px;
      color: rgba(255, 255, 255, .92);
      transition: transform .4s var(--page-ease)
    }

    .player.is-playing .cover__icon {
      transform: scale(.86) translateY(-10px)
    }

    .cover__bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 26px;
      opacity: 0;
      transition: opacity .3s ease
    }

    .player.is-playing .cover__bars {
      opacity: 1
    }

    .cover__bars i {
      width: 4px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .9);
      animation: bar 1.1s ease-in-out infinite
    }

    .cover__bars i:nth-child(2) {
      animation-delay: .18s
    }

    .cover__bars i:nth-child(3) {
      animation-delay: .36s
    }

    .cover__bars i:nth-child(4) {
      animation-delay: .09s
    }

    .cover__bars i:nth-child(5) {
      animation-delay: .27s
    }

    .player.is-paused .cover__bars i {
      animation-play-state: paused
    }

    @keyframes bar {

      0%,
      100% {
        height: 7px;
        opacity: .7
      }

      50% {
        height: 24px;
        opacity: 1
      }
    }

    .player__main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .player__eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      color: var(--color-text-disabled);
      text-transform: uppercase
    }

    .player__title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--color-text-primary);
      margin-top: 2px;
      transition: opacity .2s ease;
      word-break: break-word
    }

    .player.is-loading .player__title {
      opacity: .55
    }

    .player__artist {
      font-size: 13px;
      color: var(--color-text-secondary);
      word-break: break-word
    }

    .player__status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-disabled)
    }

    .player__status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-text-disabled);
      transition: background .2s ease
    }

    .player.is-playing .player__status {
      color: var(--color-primary)
    }

    .player.is-playing .player__status .dot {
      background: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .16)
    }

    .spinner {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 2px solid rgba(33, 165, 227, .22);
      border-top-color: var(--color-primary);
      animation: spin .7s linear infinite
    }

    .spinner[hidden] {
      display: none
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ============ 进度条 ============ */
    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px
    }

    .time {
      flex: 0 0 auto;
      min-width: 38px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-disabled);
      text-align: center
    }

    input[type="range"].range {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 auto;
      height: 5px;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      background: linear-gradient(90deg, var(--color-primary) var(--p, 0%), var(--track) var(--p, 0%));
      transition: background .1s linear
    }

    input[type="range"].range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(33, 165, 227, .45);
      transition: transform .15s
    }

    input[type="range"].range::-webkit-slider-thumb:hover {
      transform: scale(1.18)
    }

    input[type="range"].range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(33, 165, 227, .45)
    }

    /* ============ 控制区 ============ */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px
    }

    .ctl {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--color-text-secondary);
      transition: background .18s, color .18s, transform .12s
    }

    .ctl:hover {
      background: rgba(33, 165, 227, .08);
      color: var(--color-primary)
    }

    .ctl:active {
      transform: scale(.94)
    }

    .ctl--mode .mode-icon {
      display: none
    }

    .ctl--mode[data-mode="list"] .mode-icon--list,
    .ctl--mode[data-mode="single"] .mode-icon--single,
    .ctl--mode[data-mode="random"] .mode-icon--random {
      display: block
    }

    .play-btn {
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      margin: 0 4px;
      background: var(--color-primary);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 18px rgba(33, 165, 227, .38);
      transition: background .18s ease, transform .12s ease, box-shadow .18s ease
    }

    .play-btn:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 8px 22px rgba(33, 165, 227, .46)
    }

    .play-btn:active {
      transform: scale(.94)
    }

    .play-btn .icon-pause {
      display: none
    }

    .play-btn.is-playing .icon-play {
      display: none
    }

    .play-btn.is-playing .icon-pause {
      display: block
    }

    .play-btn.is-loading .icon-play,
    .play-btn.is-loading .icon-pause {
      display: none
    }

    .play-btn.is-loading::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      animation: spin .7s linear infinite
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-left: 10px
    }

    .volume .range {
      width: 92px
    }

    .volume__btn {
      color: var(--color-text-disabled)
    }

    .volume__btn:hover {
      color: var(--color-primary)
    }

    /* ============ 播放列表 ============ */
    .list-card {
      margin-top: 18px
    }

    .list-card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--color-border);
      background: linear-gradient(180deg, #f8fbff, #fff)
    }

    .list-card__head h2 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .list-card__head h2 svg {
      color: var(--color-primary)
    }

    .list-card__count {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-disabled)
    }

    .list {
      margin: 0;
      padding: 6px;
      list-style: none
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: background .16s ease, color .16s ease
    }

    .list li:hover {
      background: rgba(33, 165, 227, .07)
    }

    .list li.is-active {
      color: var(--color-primary);
      background: rgba(33, 165, 227, .1)
    }

    .list__index {
      flex: 0 0 26px;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--color-text-disabled)
    }

    .list li.is-active .list__index {
      color: var(--color-primary)
    }

    .list__text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px
    }

    .list__name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .list__artist {
      font-size: 11px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .list li.is-active .list__name {
      font-weight: 800
    }

    .list__eq {
      flex: 0 0 auto;
      margin-left: auto;
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px
    }

    .list li.is-active.is-playing .list__eq {
      display: flex
    }

    .list__eq i {
      width: 2.5px;
      border-radius: 2px;
      background: var(--color-primary);
      height: 5px;
      animation: bar 1s ease-in-out infinite
    }

    .list__eq i:nth-child(2) {
      animation-delay: .2s
    }

    .list__eq i:nth-child(3) {
      animation-delay: .4s
    }

    /* ============ 页脚 ============ */
    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-disabled)
    }

    .foot a {
      color: var(--color-primary)
    }

    /* ============ 字体切换按钮 ============ */
    #btn-font[aria-pressed="false"] {
      color: var(--color-text-disabled)
    }

    /* ============ 主题切换过渡（与首页同一套） ============ */
    ::view-transition-old(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: theme-blur-dissolve .55s cubic-bezier(.65, .05, .36, 1) both;
      background-color: var(--color-bg-light, #fff);
    }

    @keyframes theme-blur-dissolve {
      from {
        opacity: 0;
        filter: blur(20px);
        transform: scale(1.015);
        /* 稍微放大，防止模糊边缘透出旧内容 */
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    /* 兜底：不支持 View Transitions 时，用旧底色层做淡出溶解 */
    .theme-dissolve {
      position: fixed;
      inset: 0;
      z-index: 999998;
      pointer-events: none;
      opacity: 1;

    /* ============ 响应式 ============ */
    @media (max-width:760px) {
      .wrap {

      .page-head h1 {

          setStatus('已暂停');
        } else {
          setStatus('点一下播放键，音乐就来了');
        }
      }

      function updateMediaSession(song) {
        if (!('mediaSession' in navigator) || typeof window.MediaMetadata !== 'function') return;
        try {
          navigator.mediaSession.metadata = new window.MediaMetadata({
            title: song.name,
            artist: song.artist,
            album: '七七的音乐盒'
          });
        } catch (e) { }
      }

      /* ---------- 列表渲染 ---------- */
      function renderPlaylist() {
        listEl.innerHTML = '';
        PLAYLIST.forEach(function (song, index) {
          var li = document.createElement('li');
          li.dataset.index = String(index);
          li.setAttribute('role', 'button');
          li.setAttribute('tabindex', '0');

          var idx = document.createElement('span');
          idx.className = 'list__index';
          idx.textContent = String(index + 1).padStart(2, '0');

          var text = document.createElement('span');
          text.className = 'list__text';
          var name = document.createElement('span');
          name.className = 'list__name';
          name.textContent = song.name;
          var artist = document.createElement('span');
          artist.className = 'list__artist';
          artist.textContent = song.artist;
          text.appendChild(name);
          text.appendChild(artist);

          var eq = document.createElement('span');
          eq.className = 'list__eq';
          eq.setAttribute('aria-hidden', 'true');
          eq.innerHTML = '<i></i><i></i><i></i>';

          li.appendChild(idx);
          li.appendChild(text);
          li.appendChild(eq);

          li.addEventListener('click', function () { playSong(index); });
          li.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              playSong(index);
            }
          });

          listEl.appendChild(li);
        });
        if (countEl) countEl.textContent = PLAYLIST.length + ' 首';
      }

      function highlightCurrent() {
        var items = listEl.querySelectorAll('li');
        var playing = !audio.paused;
        Array.prototype.forEach.call(items, function (li, i) {
          li.classList.toggle('is-active', i === currentIndex);
          li.classList.toggle('is-playing', i === currentIndex && playing);
          li.setAttribute('aria-current', i === currentIndex ? 'true' : 'false');
        });
      }

      function updateModeIcon() {
        if (modeBtn) {
          modeBtn.dataset.mode = playMode;
          modeBtn.setAttribute('aria-label', '播放模式：' + MODE_LABELS[playMode] + '（点击切换）');
        }
        if (badgeEl) badgeEl.textContent = MODE_LABELS[playMode];
      }

      /* ---------- 播放控制 ---------- */
      function playSong(index) {
        if (!PLAYLIST.length) return;
        index = ((index % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
        currentIndex = index;
        var song = PLAYLIST[index];

        titleEl.textContent = song.name;
        artistEl.textContent = song.artist;
        document.title = song.name + ' | 七七的音乐盒';
        updateMediaSession(song);
        highlightCurrent();
        userInitiated = true;
        setLoading(true);

        audio.src = API_BASE + song.id + AUDIO_EXT;
        audio.load();

        var promise = audio.play();
        if (promise && typeof promise.then === 'function') {
          promise.then(function () {
            started = true;
            syncPlayingUI(true);
          }).catch(function (err) {
            /* 快速切歌会抛 AbortError，此时新歌已经接管加载态，不要误关 */
            if (err && err.name === 'AbortError') return;
            console.warn('播放失败：', err);
            setLoading(false);
            syncPlayingUI(false);
            titleEl.textContent = song.name + '（无法播放）';
            setStatus('这首歌的音频拿不到，换一首试试');
          });
        }
      }

      function pause() {
        audio.pause();
        syncPlayingUI(false);
      }

      function togglePlay() {
        userInitiated = true;
        if (audio.paused) {
          if (!audio.src) { playSong(currentIndex); return; }
          var promise = audio.play();
          if (promise && typeof promise.then === 'function') {
            promise.then(function () {
              started = true;
              syncPlayingUI(true);
            }).catch(function (err) {
              console.warn('播放失败：', err);
              setStatus('播放被挡住了，再点一次试试');
            });
          }
        } else {
          pause();
        }
      }

      function pickRandom(except) {
        if (PLAYLIST.length <= 1) return 0;
        var next;
        do { next = Math.floor(Math.random() * PLAYLIST.length); } while (next === except);
        return next;
      }

      function nextSong() {
        if (!PLAYLIST.length) return;
        playSong(playMode === 'random' ? pickRandom(currentIndex) : currentIndex + 1);
      }

      function prevSong() {
        if (!PLAYLIST.length) return;
        playSong(playMode === 'random' ? pickRandom(currentIndex) : currentIndex - 1);
      }

      function onEnded() {
        if (playMode === 'single') {
          audio.currentTime = 0;
          var promise = audio.play();
          if (promise && typeof promise.catch === 'function') promise.catch(function () { });
        } else {
          nextSong();
        }
      }

      function updateProgress() {
        if (isSeeking) return;
        var duration = audio.duration;
        if (isFinite(duration) && duration > 0) {
          var percent = audio.currentTime / duration;
          seekEl.value = String(Math.round(percent * 1000));
          setRangeFill(seekEl, percent * 100);
          currentTimeEl.textContent = formatTime(audio.currentTime);
        } else {
          seekEl.value = '0';
          setRangeFill(seekEl, 0);
          currentTimeEl.textContent = '00:00';
        }
      }

      function updateDuration() {
        var duration = audio.duration;
        durationEl.textContent = (isFinite(duration) && duration > 0) ? formatTime(duration) : '00:00';
      }

      function bindAudioEvents() {
        audio.addEventListener('loadstart', function () { setLoading(true); });
        audio.addEventListener('waiting', function () { setLoading(true); });
        audio.addEventListener('stalled', function () { setLoading(true); });

        audio.addEventListener('loadedmetadata', function () {
          setLoading(false);
          updateDuration();
        });
        audio.addEventListener('canplay', function () { setLoading(false); });
        audio.addEventListener('playing', function () {
          setLoading(false);
          failStreak = 0;
          started = true;
          syncPlayingUI(true);
        });
        audio.addEventListener('seeked', function () { setLoading(false); });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('durationchange', updateDuration);
        audio.addEventListener('ended', onEnded);

        audio.addEventListener('play', function () { syncPlayingUI(true); });
        audio.addEventListener('pause', function () { syncPlayingUI(false); });

        audio.addEventListener('error', function () {
          console.warn('音频加载错误', audio.src);
          setLoading(false);

          /* 还没点播放时只是预取失败，别自作主张换歌 */
          if (!userInitiated) {
            setStatus('这首歌的音频好像拿不到，换一首试试');
            return;
          }

          syncPlayingUI(false);
          failStreak += 1;
          if (failStreak >= 5) {
            setStatus('连跳 5 首都拿不到音频，先检查下网络吧');
            failStreak = 0;
            return;
          }

          setStatus('加载失败，1 秒后自动跳下一首');
          setTimeout(function () {
            if (PLAYLIST.length > 1) nextSong();
          }, 1000);
        });
      }

      function bindControls() {
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        seekEl.addEventListener('input', function () {
          isSeeking = true;
          var percent = Number(seekEl.value) / 1000;
          setRangeFill(seekEl, percent * 100);
          var duration = audio.duration;
          if (isFinite(duration) && duration > 0) {
            currentTimeEl.textContent = formatTime(percent * duration);
          }
        });

        seekEl.addEventListener('change', function () {
          var percent = Number(seekEl.value) / 1000;
          var duration = audio.duration;
          if (isFinite(duration) && duration > 0) {
            audio.currentTime = percent * duration;
          }
          isSeeking = false;
        });

        modeBtn.addEventListener('click', function () {
          var idx = MODES.indexOf(playMode);
          playMode = MODES[(idx + 1) % MODES.length];
          updateModeIcon();
          writePref('music-mode', playMode);
          if (!audio.paused) setStatus('正在播放 · ' + MODE_LABELS[playMode]);
        });

        volumeRange.addEventListener('input', function () {
          volume = Number(volumeRange.value) / 100;
          audio.volume = volume;
          if (volume > 0) lastVolume = volume;
          setRangeFill(volumeRange, volume * 100);
          writePref('music-volume', String(volume));
        });

        if (muteBtn) {
          muteBtn.addEventListener('click', function () {
            if (audio.volume > 0) {
              lastVolume = audio.volume;
              audio.volume = 0;
              volumeRange.value = '0';
              setRangeFill(volumeRange, 0);
              muteBtn.setAttribute('aria-label', '取消静音');
            } else {
              audio.volume = lastVolume || DEFAULT_VOLUME;
              volumeRange.value = String(Math.round(audio.volume * 100));
              setRangeFill(volumeRange, audio.volume * 100);
              muteBtn.setAttribute('aria-label', '静音');
            }
            writePref('music-volume', String(audio.volume));
          });
        }

        /* 空格播放 / 暂停，左右键切歌 */
        document.addEventListener('keydown', function (e) {
          var tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextSong();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevSong();
          }
        });
      }

      /* ---------- 主题切换：与首页同一套过渡 + 同一 localStorage 键 ---------- */
      function initTheme() {
        var btn = document.getElementById('btn-theme');
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');

        function isDark() {
          return root.getAttribute('data-theme') === 'dark';
        }

        function sync() {
          var dark = isDark();
          if (meta) meta.setAttribute('content', dark ? '#12161F' : '#21a5e3');
          if (!btn) return;
          var label = dark ? '切换到浅色模式' : '切换到深色模式';
          btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', label);
        }

        function apply(theme, persist) {
          root.setAttribute('data-theme', theme);
          if (persist) {
            try { localStorage.setItem('theme', theme); } catch (e) { }
          }
          sync();
        }

        function prefersReducedMotion() {
          return window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        sync();
        if (!btn) return;

        btn.addEventListener('click', function () {
          var theme = isDark() ? 'light' : 'dark';

          if (prefersReducedMotion()) {
            apply(theme, true);
            return;
          }

          if (typeof document.startViewTransition === 'function') {
            /* 主力方案：新主题从模糊中淡入，覆盖旧主题 */
            document.startViewTransition(function () {
              apply(theme, true);
            });
          } else {
            /* 兜底方案：旧底色覆盖 → 淡出 → 露出新主题 */
            var overlay = document.createElement('div');
            overlay.className = 'theme-dissolve';
            overlay.style.background = getComputedStyle(document.body).backgroundColor;
            document.body.appendChild(overlay);

            void overlay.offsetWidth;     // 强制回流，确保起始状态生效

            apply(theme, true);           // 现在有层挡着，用户看不到瞬切

            requestAnimationFrame(function () {
              overlay.style.opacity = '0';
            });

            setTimeout(function () {
              if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            }, 550);
          }
        });

        /* 用户没手动选过时，跟随系统偏好变化（与首页一致） */
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        if (mq && mq.addEventListener) {
          mq.addEventListener('change', function (e) {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (err) { }
            if (saved) return;
            apply(e.matches ? 'dark' : 'light', false);
          });
        }
      }

      /* ---------- 字体切换：七七柔和圆体 ⇄ 系统字体（沿用首页 home-font） ---------- */
      function initFont() {
        var btn = document.getElementById('btn-font');
        if (!btn) return;

        var root = document.documentElement;
        var ROUND = '"Blog-WenYuan", "Blog-WenYuan-Fallback", var(--font-fallback)';
        var SYSTEM = 'var(--font-fallback)';

        function isSystem() {
          try {
            return localStorage.getItem('home-font') === 'system';
          } catch (e) {
            return false;
          }
        }

        function updateUI(system) {
          var name = system ? '系统字体' : '七七柔和圆体';
          var label = '切换字体（当前：' + name + '）';
          btn.setAttribute('aria-pressed', system ? 'false' : 'true');
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', label);
        }

        updateUI(isSystem());

        btn.addEventListener('click', function () {
          var toSystem = !isSystem();
          root.style.setProperty('--font-sans', toSystem ? SYSTEM : ROUND);
          try {
            localStorage.setItem('home-font', toSystem ? 'system' : 'round');
          } catch (e) { }
          updateUI(toSystem);
        });
      }

      /* ---------- 初始化 ---------- */
      function init() {
        renderPlaylist();
        updateModeIcon();
        updateDuration();
        setRangeFill(seekEl, 0);
        setRangeFill(volumeRange, volume * 100);
        bindAudioEvents();
        bindControls();
        initTheme();
        initFont();

        if (!PLAYLIST.length) {
          setStatus('歌单是空的');
          return;
        }

        /* 只预取第一首的元数据，不自动播放（浏览器会拦） */
        var first = PLAYLIST[0];
        currentIndex = 0;
        titleEl.textContent = first.name;
        artistEl.textContent = first.artist;
        highlightCurrent();
        audio.src = API_BASE + first.id + AUDIO_EXT;
        audio.load();
        setStatus('点一下播放键，音乐就来了');
      }

      /* 支持从首页带参进入，例如 music.html?autoplay=1 */
      function maybeAutoplay() {
        try {
          var params = new URLSearchParams(location.search);
          if (params.get('autoplay') !== '1') return;
        } catch (e) { return; }
        playSong(0);
      }

      init();
      maybeAutoplay();
    })();
  </script>
</body>

</html>
