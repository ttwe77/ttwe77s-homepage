<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#21a5e3">

  <!-- 主题初始化：在样式解析前决定深色 / 浅色，避免刷新时闪白 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- 字体初始化：沿用首页的字体选择 -->
  <script id="font-init">
    (function () {
      try {
        if (localStorage.getItem('home-font') === 'system') {
          document.documentElement.style.setProperty('--font-sans', 'var(--font-fallback)');
        }
      } catch (e) { }
    })();
  </script>

  <title>音乐盒 | 七七的折腾笔记</title>
  <link rel="icon" type="image/svg+xml" href="/src/music.svg">
  <link rel="apple-touch-icon" href="/src/apple-touch-icon.png">
  <meta name="description" content="七七的折腾笔记 · 自建音乐播放器，收录原神 OST 等纯音乐，边逛边听。" />

  <!-- 音频直连网易云外链，提前建连省一点首播等待 -->
  <link rel="preconnect" href="https://music.163.com" crossorigin>
  <link rel="dns-prefetch" href="https://music.163.com">

  <style>
    /* ============ 自定义字体（woff2） ============ */
    @font-face {
      font-family: "Blog-WenYuan";
      src: url("/blog/fonts/77StandardRound-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan";
      src: url("/blog/fonts/77StandardRound-SemiBold.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan";
      src: url("/blog/fonts/77StandardRound-Bold.woff2") format("woff2");
      font-weight: 700 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan-Fallback";
      src: url("/src/ttf/fonts/standard-round/subset/fallback/77StandardRound-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan-Fallback";
      src: url("/src/ttf/fonts/standard-round/subset/fallback/77StandardRound-SemiBold.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Blog-WenYuan-Fallback";
      src: url("/src/ttf/fonts/standard-round/subset/fallback/77StandardRound-Bold.woff2") format("woff2");
      font-weight: 700 900;
      font-style: normal;
      font-display: swap;
    }

    /* ============ 设计令牌 ============ */
    :root {
      --color-primary: #21a5e3;
      --color-primary-hover: #0E7AE0;
      --color-primary-active: #0B6BC5;
      --color-blue-light: #ABD7FF;
      --color-periwinkle: #BEC0EC;
      --color-orchid: #4454F8;
      --color-bg-white: #FFFFFF;
      --color-bg-light: #FAFAFA;
      --color-bg-soft: #F5F5F5;
      --color-border: #EDEDED;
      --color-border-strong: #D4D4D4;
      --color-text-primary: #1F1F1F;
      --color-text-body: #404040;
      --color-text-secondary: #737373;
      --color-text-disabled: #A3A3A3;
      --color-danger: #F21B28;
      --color-success: #169B5B;
      --color-warning: #FFD84D;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, .06);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .1);
      --shadow-blue: 0 6px 20px rgba(18, 138, 250, .25);
      --font-fallback: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-sans: "Blog-WenYuan", "Blog-WenYuan-Fallback", var(--font-fallback);
      --topbar-h: 56px;
      --page-ease: cubic-bezier(.65, .05, .36, 1);
      --track: #e8eef5;
    }

    /* ============ 基础 ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--color-bg-light);
      color: var(--color-text-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    a {
      text-decoration: none;
      color: inherit
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit
    }

    /* 背景氛围（与首页一致） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 4%, rgba(18, 138, 250, .12), transparent 42%),
        radial-gradient(circle at 92% -4%, rgba(171, 215, 255, .42), transparent 46%),
        radial-gradient(circle at 72% 96%, rgba(190, 192, 236, .22), transparent 46%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(18, 138, 250, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 138, 250, .035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ============ 顶栏 ============ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: rgba(255, 255, 255, .92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto
    }

    .brand__mark {
      width: 80px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand__mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .brand__name {
      font-size: 16px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: .04em;
      white-space: nowrap
    }

    .topbar__spacer {
      flex: 1 1 auto
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #3f568c;
      background: transparent;
      transition: background .18s ease, transform .12s ease, color .18s ease;
    }

    .icon-btn:hover {
      background: rgba(63, 86, 140, .08)
    }

    .icon-btn:active {
      transform: scale(.94)
    }

    .icon-btn__moon {
      display: none
    }

    :root[data-theme="dark"] .icon-btn__sun {
      display: none
    }

    :root[data-theme="dark"] .icon-btn__moon {
      display: block
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px 0 10px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      color: #3f568c;
      background: rgba(63, 86, 140, .06);
      transition: background .18s ease, color .18s ease, transform .12s ease;
      white-space: nowrap
    }

    .back-link:hover {
      background: rgba(63, 86, 140, .12)
    }

    .back-link:active {
      transform: scale(.97)
    }

    /* ============ 页面骨架 ============ */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + 40px) 20px 64px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px
    }

    .page-head h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--color-text-primary);
      line-height: 1.3
    }

    .page-head h1 span {
      color: var(--color-primary)
    }

    .page-head p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--color-text-secondary)
    }

    .badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-primary);
      background: rgba(33, 165, 227, .1);
      border: 1px solid rgba(33, 165, 227, .18)
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .18)
    }

    .card {
      position: relative;
      border-radius: var(--radius-xl);
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-card);
      overflow: hidden
    }

    /* ============ 播放器主体 ============ */
    .player {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 26px;
      padding: 24px;
      align-items: center
    }

    .cover {
      position: relative;
      width: 232px;
      height: 232px;
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .5), transparent 58%),
        linear-gradient(142deg, #7FC4EA 0%, #21a5e3 48%, #4454F8 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(33, 165, 227, .28);
      transition: transform .5s var(--page-ease)
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 78% 78%, rgba(255, 255, 255, .28), transparent 42%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, .07) 0 2px, transparent 2px 9px);
      pointer-events: none
    }

    .cover__icon {
      position: relative;
      z-index: 1;
      width: 84px;
      height: 84px;
      color: rgba(255, 255, 255, .92);
      transition: transform .4s var(--page-ease)
    }

    .player.is-playing .cover__icon {
      transform: scale(.86) translateY(-10px)
    }

    .cover__bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 26px;
      opacity: 0;
      transition: opacity .3s ease
    }

    .player.is-playing .cover__bars {
      opacity: 1
    }

    .cover__bars i {
      width: 4px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .9);
      animation: bar 1.1s ease-in-out infinite
    }

    .cover__bars i:nth-child(2) {
      animation-delay: .18s
    }

    .cover__bars i:nth-child(3) {
      animation-delay: .36s
    }

    .cover__bars i:nth-child(4) {
      animation-delay: .09s
    }

    .cover__bars i:nth-child(5) {
      animation-delay: .27s
    }

    .player.is-paused .cover__bars i {
      animation-play-state: paused
    }

    @keyframes bar {

      0%,
      100% {
        height: 7px;
        opacity: .7
      }

      50% {
        height: 24px;
        opacity: 1
      }
    }

    .player__main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .player__eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      color: var(--color-text-disabled);
      text-transform: uppercase
    }

    .player__title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--color-text-primary);
      margin-top: 2px;
      transition: opacity .2s ease;
      word-break: break-word
    }

    .player.is-loading .player__title {
      opacity: .55
    }

    .player__artist {
      font-size: 13px;
      color: var(--color-text-secondary);
      word-break: break-word
    }

    .player__status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-disabled)
    }

    .player__status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-text-disabled);
      transition: background .2s ease
    }

    .player.is-playing .player__status {
      color: var(--color-primary)
    }

    .player.is-playing .player__status .dot {
      background: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(33, 165, 227, .16)
    }

    .spinner {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 2px solid rgba(33, 165, 227, .22);
      border-top-color: var(--color-primary);
      animation: spin .7s linear infinite
    }

    .spinner[hidden] {
      display: none
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ============ 进度条 ============ */
    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px
    }

    .time {
      flex: 0 0 auto;
      min-width: 38px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-disabled);
      text-align: center
    }

    input[type="range"].range {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 auto;
      height: 5px;
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
      background: linear-gradient(90deg, var(--color-primary) var(--p, 0%), var(--track) var(--p, 0%));
      transition: background .1s linear
    }

    input[type="range"].range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(33, 165, 227, .45);
      transition: transform .15s
    }

    input[type="range"].range::-webkit-slider-thumb:hover {
      transform: scale(1.18)
    }

    input[type="range"].range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(33, 165, 227, .45)
    }

    /* ============ 控制区 ============ */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px
    }

    .ctl {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--color-text-secondary);
      transition: background .18s, color .18s, transform .12s
    }

    .ctl:hover {
      background: rgba(33, 165, 227, .08);
      color: var(--color-primary)
    }

    .ctl:active {
      transform: scale(.94)
    }

    .ctl--mode .mode-icon {
      display: none
    }

    .ctl--mode[data-mode="list"] .mode-icon--list,
    .ctl--mode[data-mode="single"] .mode-icon--single,
    .ctl--mode[data-mode="random"] .mode-icon--random {
      display: block
    }

    .play-btn {
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      margin: 0 4px;
      background: var(--color-primary);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 18px rgba(33, 165, 227, .38);
      transition: background .18s ease, transform .12s ease, box-shadow .18s ease
    }

    .play-btn:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 8px 22px rgba(33, 165, 227, .46)
    }

    .play-btn:active {
      transform: scale(.94)
    }

    .play-btn .icon-pause {
      display: none
    }

    .play-btn.is-playing .icon-play {
      display: none
    }

    .play-btn.is-playing .icon-pause {
      display: block
    }

    .play-btn.is-loading .icon-play,
    .play-btn.is-loading .icon-pause {
      display: none
    }

    .play-btn.is-loading::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      animation: spin .7s linear infinite
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding-left: 10px
    }

    .volume .range {
      width: 92px
    }

    .volume__btn {
      color: var(--color-text-disabled)
    }

    .volume__btn:hover {
      color: var(--color-primary)
    }

    /* ============ 画中画迷你播放器 ============ */
    /* 用 flex 而不是 grid + place-items:center：
       grid 里百分比高度的参照是不确定的行高，会把 height:100% 退化成 auto，
       列表一展开面板就按内容撑高，控制条和进度条被顶到窗口外面 */
    .pip-body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pipui {
      display: grid;
      grid-template-columns: clamp(64px, 26%, 108px) minmax(0, 1fr);
      grid-template-areas:
        "art meta"
        "art bar"
        "controls controls";
      grid-template-rows: auto auto auto;
      align-content: center;
      gap: 8px 14px;
      height: 100%;
      min-height: 0;
      min-width: 0;
      max-height: 100%;
      overflow: hidden;
      padding: clamp(12px, 4%, 22px);
      border-radius: var(--radius-xl);
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      box-shadow: 0 14px 36px rgba(15, 32, 56, .18);
      user-select: none;
      -webkit-user-select: none;
    }

    .pipui--window {
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 250px;
      border: 0;
      box-shadow: 0 18px 44px rgba(15, 32, 56, .16);
    }

    .pipui__art {
      grid-area: art;
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      align-self: center;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: rgba(255, 255, 255, .92);
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .5), transparent 58%),
        linear-gradient(142deg, #7FC4EA 0%, #21a5e3 48%, #4454F8 100%);
      box-shadow: 0 8px 20px rgba(33, 165, 227, .24);
    }

    .pipui--float .pipui__art {
      cursor: grab
    }

    .pipui.is-playing .pipui__art svg {
      transform: scale(.82) translateY(-6px);
      transition: transform .4s var(--page-ease)
    }

    .pipui__art svg {
      transition: transform .4s var(--page-ease)
    }

    .pipui__eq {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 14px;
      opacity: 0;
      transition: opacity .3s ease
    }

    .pipui.is-playing .pipui__eq {
      opacity: 1
    }

    .pipui__eq i {
      width: 3px;
      height: 5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .9);
      animation: bar 1.1s ease-in-out infinite
    }

    .pipui__eq i:nth-child(2) {
      animation-delay: .18s
    }

    .pipui__eq i:nth-child(3) {
      animation-delay: .36s
    }

    .pipui__eq i:nth-child(4) {
      animation-delay: .09s
    }

    :root[data-theme="dark"] .pipui__art {
      background:
        radial-gradient(circle at 30% 22%, rgba(122, 190, 235, .12), transparent 62%),
        linear-gradient(142deg, #22506E 0%, #1D4762 46%, #2A326B 100%);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .42);
      color: rgba(198, 224, 244, .72);
    }

    .pipui__meta {
      grid-area: meta;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px
    }

    .pipui__title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pipui__artist {
      font-size: 11.5px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pipui__controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      align-self: center;
      min-width: 0
    }

    /* 音量滑块：挤在控制条尾部，窄窗口下自动收缩 */
    .pipui__vol {
      flex: 1 1 40px;
      min-width: 32px;
      max-width: 96px;
      height: 4px;
      margin: 0 1px
    }

    /* 静音图标切换（迷你播放器 + 主播放器共用） */
    .pipui__btn .icon-vol-mute,
    .volume__btn .icon-vol-mute {
      display: none
    }

    .pipui__btn.is-muted .icon-vol,
    .volume__btn.is-muted .icon-vol {
      display: none
    }

    .pipui__btn.is-muted .icon-vol-mute,
    .volume__btn.is-muted .icon-vol-mute {
      display: block
    }

    .pipui__btn.is-active {
      color: var(--color-primary);
      background: rgba(33, 165, 227, .12)
    }

    /* 迷你播放器的播放模式键：三枚图标只露当前那一枚 */
    .pipui__btn .mode-icon {
      display: none
    }

    .pipui__mode[data-mode="list"] .mode-icon--list,
    .pipui__mode[data-mode="single"] .mode-icon--single,
    .pipui__mode[data-mode="random"] .mode-icon--random {
      display: block
    }

    .pipui__btn {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--color-text-secondary);
      transition: background .16s ease, color .16s ease, transform .12s ease
    }

    .pipui__btn:hover {
      background: rgba(33, 165, 227, .1);
      color: var(--color-primary)
    }

    .pipui__btn:active {
      transform: scale(.9)
    }

    /* ---------- 点击动效：水波纹 + 回弹（静音键 / 迷你播放器列表键共用） ---------- */
    .tap-fx {
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent
    }

    .tap-fx__ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0;
      pointer-events: none;
      transform: scale(0);
      animation: tap-ripple .5s cubic-bezier(.22, .61, .36, 1) forwards
    }

    @keyframes tap-ripple {
      0% {
        transform: scale(.15);
        opacity: .3
      }

      60% {
        opacity: .16
      }

      100% {
        transform: scale(1);
        opacity: 0
      }
    }

    .tap-fx.is-tapped {
      animation: tap-pop .36s cubic-bezier(.34, 1.56, .64, 1)
    }

    @keyframes tap-pop {
      0% {
        transform: scale(1)
      }

      30% {
        transform: scale(.86)
      }

      62% {
        transform: scale(1.07)
      }

      100% {
        transform: scale(1)
      }
    }

    .pipui__btn--play {
      width: 34px;
      height: 34px;
      margin: 0 2px;
      background: var(--color-primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(33, 165, 227, .35)
    }

    .pipui__btn--play:hover {
      background: var(--color-primary-hover);
      color: #fff
    }

    /* 深色下别当小太阳，与主播放键保持同一档 */
    :root[data-theme="dark"] .pipui__btn--play {
      background: #2C7FB8;
      color: #EAF2FA;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .42)
    }

    :root[data-theme="dark"] .pipui__btn--play:hover {
      background: #3592CF
    }

    .pipui__btn--close {
      margin-left: auto;
      color: var(--color-text-disabled)
    }

    .pipui__btn .icon-pause {
      display: none
    }

    .pipui.is-playing .pipui__btn--play .icon-play {
      display: none
    }

    .pipui.is-playing .pipui__btn--play .icon-pause {
      display: block
    }

    .pipui__bar {
      grid-area: bar;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .pipui__time {
      flex: 0 0 auto;
      min-width: 30px;
      font-size: 10.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-disabled);
      text-align: center
    }

    .pipui__bar .range {
      height: 4px
    }

    /* ---------- 迷你列表 ---------- */
    .pipui__list {
      grid-area: list;
      display: none;
      min-height: 0;
      margin: 0;
      padding: 0 2px 0 0;
      list-style: none;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
    }

    /* Firefox 用标准属性；Chromium 走下面的 ::-webkit-，两条别混用，
       否则 Chrome 会用原生细滚动条（还带小箭头）盖掉自定义样式 */
    @supports not selector(::-webkit-scrollbar) {
      .pipui__list {
        scrollbar-width: thin;
        scrollbar-color: rgba(33, 165, 227, .35) transparent
      }
    }

    .pipui__list::-webkit-scrollbar {
      width: 6px;
      height: 0
    }

    /* Windows 上原生滚动条会留个箭头按钮，遮掉 */
    .pipui__list::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0
    }

    .pipui__list::-webkit-scrollbar-corner {
      background: transparent
    }

    .pipui__list::-webkit-scrollbar-thumb {
      border-radius: 2px;
      background: rgba(33, 165, 227, .35)
    }

    .pipui__list::-webkit-scrollbar-track {
      background: transparent
    }

    /* 列表展开时：藏起封面与歌名，控制条置顶、列表铺满中间、进度条回到底部 */
    .pipui.is-list .pipui__art,
    .pipui.is-list .pipui__meta {
      display: none
    }

    .pipui.is-list {
      grid-template-areas:
        "controls controls"
        "list list"
        "bar bar";
      grid-template-rows: auto minmax(0, 1fr) auto
    }

    .pipui.is-list .pipui__list {
      display: block
    }

    /* 展开列表时交给窗口高度自己决定，别再用固定值把面板顶出窗口 */
    .pipui--window.is-list {
      max-height: 100%
    }

    .pipui__item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 5px 6px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      font-family: inherit;
      font-size: 11.5px;
      color: var(--color-text-secondary);
      text-align: left;
      cursor: pointer;
      transition: background .14s ease, color .14s ease
    }

    .pipui__item:hover {
      background: rgba(33, 165, 227, .08);
      color: var(--color-text-primary)
    }

    .pipui__item.is-active {
      color: var(--color-primary);
      background: rgba(33, 165, 227, .1);
      font-weight: 700
    }

    .pipui__item-idx {
      flex: 0 0 18px;
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--color-text-disabled)
    }

    .pipui__item.is-active .pipui__item-idx {
      color: var(--color-primary)
    }

    .pipui__item-name {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pipui__item-eq {
      flex: 0 0 auto;
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 11px
    }

    .pipui__item.is-active.is-playing .pipui__item-eq {
      display: flex
    }

    .pipui__item-eq i {
      width: 2.5px;
      height: 4px;
      border-radius: 2px;
      background: currentColor;
      animation: bar 1s ease-in-out infinite
    }

    .pipui__item-eq i:nth-child(2) {
      animation-delay: .2s
    }

    .pipui__item-eq i:nth-child(3) {
      animation-delay: .4s
    }

    /* 页内浮窗（浏览器不支持 Document PiP 时的兜底） */
    .pip-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 900;
      width: 300px;
      height: 168px;
      touch-action: none;
      /* 展开列表时高度是变化的，别让浮窗“啪”一下长高 */
      transition: height .32s var(--page-ease);
      animation: pip-in .28s var(--page-ease) both
    }

    .pip-float[hidden] {
      display: none
    }

    .pip-float.is-dragging {
      cursor: grabbing
    }

    /* 页内浮窗展开列表时拉高一点，不然一屏只看得见一首 */
    .pip-float:has(.pipui.is-list) {
      height: min(340px, calc(100vh - 24px))
    }

    @keyframes pip-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.96)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* 画中画按钮激活态 */
    .ctl--pip.is-active {
      color: var(--color-primary);
      background: rgba(33, 165, 227, .12)
    }

    /* ============ 播放列表 ============ */
    .list-card {
      margin-top: 18px
    }

    .list-card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--color-border);
      background: linear-gradient(180deg, #f8fbff, #fff)
    }

    .list-card__head h2 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .list-card__head h2 svg {
      color: var(--color-primary)
    }

    .list-card__count {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-disabled)
    }

    .list {
      margin: 0;
      padding: 6px;
      list-style: none
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: background .16s ease, color .16s ease
    }

    .list li:hover {
      background: rgba(33, 165, 227, .07)
    }

    .list li.is-active {
      color: var(--color-primary);
      background: rgba(33, 165, 227, .1)
    }

    .list__index {
      flex: 0 0 26px;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--color-text-disabled)
    }

    .list li.is-active .list__index {
      color: var(--color-primary)
    }

    .list__text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px
    }

    .list__name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .list__artist {
      font-size: 11px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .list li.is-active .list__name {
      font-weight: 800
    }

    .list__eq {
      flex: 0 0 auto;
      margin-left: auto;
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px
    }

    .list li.is-active.is-playing .list__eq {
      display: flex
    }

    .list__eq i {
      width: 2.5px;
      border-radius: 2px;
      background: var(--color-primary);
      height: 5px;
      animation: bar 1s ease-in-out infinite
    }

    .list__eq i:nth-child(2) {
      animation-delay: .2s
    }

    .list__eq i:nth-child(3) {
      animation-delay: .4s
    }

    /* ============ 页脚 ============ */
    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-disabled)
    }

    .foot a {
      color: var(--color-primary)
    }

    /* ============ 字体切换按钮 ============ */
    #btn-font[aria-pressed="false"] {
      color: var(--color-text-disabled)
    }

    /* ============ 主题切换过渡（与首页同一套） ============ */
    ::view-transition-old(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: theme-blur-dissolve .55s cubic-bezier(.65, .05, .36, 1) both;
      background-color: var(--color-bg-light, #fff);
    }

    @keyframes theme-blur-dissolve {
      from {
        opacity: 0;
        filter: blur(20px);
        transform: scale(1.015);
        /* 稍微放大，防止模糊边缘透出旧内容 */
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    /* 兜底：不支持 View Transitions 时，用旧底色层做淡出溶解 */
    .theme-dissolve {
      position: fixed;
      inset: 0;
      z-index: 999998;
      pointer-events: none;
      opacity: 1;
      transition: opacity .45s cubic-bezier(.65, .05, .36, 1);
    }

    /* ============ 深色模式 ============ */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-primary: #4FB8F0;
      --color-primary-hover: #7ACDFF;
      --color-primary-active: #35A0D8;
      --color-blue-light: #6FA8D6;
      --color-periwinkle: #9A9DE8;
      --color-orchid: #8C9BFF;
      --color-bg-white: #1B2230;
      --color-bg-light: #12161F;
      --color-bg-soft: #232B3A;
      --color-border: #2B3546;
      --color-border-strong: #3B465C;
      --color-text-primary: #EAF2FA;
      --color-text-body: #C6D2E0;
      --color-text-secondary: #93A3B8;
      --color-text-disabled: #6B7A8E;
      --color-danger: #FF6B75;
      --color-success: #4ED08A;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, .38);
      --shadow-card-hover: 0 4px 16px rgba(0, 0, 0, .5);
      --track: #2F3A4D;
    }

    :root[data-theme="dark"] body::before {
      background:
        radial-gradient(circle at 10% 4%, rgba(79, 184, 240, .16), transparent 42%),
        radial-gradient(circle at 92% -4%, rgba(68, 84, 248, .18), transparent 46%),
        radial-gradient(circle at 72% 96%, rgba(140, 155, 255, .12), transparent 46%);
    }

    :root[data-theme="dark"] body::after {
      background-image:
        linear-gradient(rgba(79, 184, 240, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 184, 240, .05) 1px, transparent 1px);
    }

    :root[data-theme="dark"] .topbar {
      background: rgba(18, 22, 31, .92);
      border-bottom-color: rgba(255, 255, 255, .07);
    }

    :root[data-theme="dark"] .brand__name {
      color: var(--color-text-primary);
    }

    :root[data-theme="dark"] .icon-btn {
      color: #AFC4DD;
    }

    :root[data-theme="dark"] .icon-btn:hover {
      background: rgba(175, 196, 221, .1);
    }

    :root[data-theme="dark"] .back-link {
      color: #AFC4DD;
      background: rgba(175, 196, 221, .1);
    }

    :root[data-theme="dark"] .back-link:hover {
      background: rgba(175, 196, 221, .18);
    }

    :root[data-theme="dark"] .list-card__head {
      background: linear-gradient(180deg, #1E2634, #1B2230);
    }

    /* 深色下封面压暗：收掉白色高光与鲜艳蓝，别让整块发光 */
    :root[data-theme="dark"] .cover {
      background:
        radial-gradient(circle at 30% 22%, rgba(122, 190, 235, .12), transparent 62%),
        linear-gradient(142deg, #22506E 0%, #1D4762 46%, #2A326B 100%);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05);
    }

    :root[data-theme="dark"] .cover::after {
      background-image:
        radial-gradient(circle at 78% 78%, rgba(122, 190, 235, .07), transparent 46%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, .03) 0 2px, transparent 2px 9px);
    }

    :root[data-theme="dark"] .cover__icon {
      color: rgba(198, 224, 244, .5);
    }

    :root[data-theme="dark"] .cover__bars i {
      background: rgba(140, 200, 240, .68);
    }

    :root[data-theme="dark"] input[type="range"].range::-webkit-slider-thumb {
      border-color: #12161F;
    }

    :root[data-theme="dark"] input[type="range"].range::-moz-range-thumb {
      border-color: #12161F;
    }

    /* 深色下播放键别当小太阳：深一档的蓝，光晕收弱 */
    :root[data-theme="dark"] .play-btn {
      background: #2C7FB8;
      color: #EAF2FA;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .42);
    }

    :root[data-theme="dark"] .play-btn:hover {
      background: #3592CF;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .48);
    }

    :root[data-theme="dark"] .play-btn:active {
      background: #2A76AC;
    }

    :root[data-theme="dark"] .play-btn.is-loading::after {
      border-color: rgba(234, 242, 250, .28);
      border-top-color: #EAF2FA;
    }

    /* ============ 响应式 ============ */
    @media (max-width:760px) {
      .wrap {
        padding: calc(var(--topbar-h) + 24px) 14px 48px;
      }

      .page-head h1 {
        font-size: 22px;
      }

      .player {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 18px;
        justify-items: center;
        text-align: center;
      }

      .cover {
        width: min(220px, 62vw);
        height: min(220px, 62vw);
      }

      .player__main {
        width: 100%
      }

      .player__status {
        justify-content: center;
      }

      .controls {
        justify-content: center;
        flex-wrap: wrap;
      }

      .volume {
        margin-left: 0;
        width: 100%;
        justify-content: center;
        padding-left: 0;
        margin-top: 4px;
      }

      .volume .range {
        width: 140px
      }

      .list li {
        padding: 9px 8px
      }

      .back-link span {
        display: none
      }

      .back-link {
        padding: 0;
        width: 32px;
        justify-content: center
      }
    }

    /* 顶栏多了一个字体按钮，窄屏再挤一挤，别把品牌挤出屏幕 */
    @media (max-width:480px) {
      .topbar {
        gap: 8px;
        padding: 0 14px
      }

      .brand {
        gap: 7px
      }

      .brand__mark {
        width: 62px
      }

      .brand__name {
        font-size: 14.5px;
        letter-spacing: .02em
      }

      .icon-btn {
        width: 34px;
        height: 34px
      }

      .pip-float {
        right: 12px;
        bottom: 12px;
        width: calc(100vw - 24px);
        max-width: 320px;
        height: 162px
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .cover__bars i,
      .list__eq i {
        animation: none;
        height: 10px
      }

      .cover {
        transition: none
      }

      /* 点击动效别让晕动症用户难受，直接关掉 */
      .tap-fx.is-tapped {
        animation: none
      }

      .tap-fx__ripple {
        display: none
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none !important
      }
    }
  </style>
</head>

<body>
  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <a class="brand" href="./index.html">
      <span class="brand__mark">
        <img src="src/ttwe77.avif" alt="七七的折腾笔记" width="30" height="30">
      </span>
      <span class="brand__name">七七的折腾笔记</span>
    </a>
    <div class="topbar__spacer"></div>

    <a class="back-link" href="./index.html" title="返回首页">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>
      <span>返回首页</span>
    </a>

    <button class="icon-btn" id="btn-font" type="button" aria-label="切换字体（当前：七七柔和圆体）"
      aria-pressed="true" title="切换字体（当前：七七柔和圆体）">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M4 7V4h16v3" />
        <path d="M9 20h6" />
        <path d="M12 4v16" />
      </svg>
    </button>

    <button class="icon-btn" id="btn-theme" type="button" aria-label="切换主题" aria-pressed="false">
      <svg class="icon-btn__sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
      <svg class="icon-btn__moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
      </svg>
    </button>
  </header>

  <main class="wrap">

      var prevBtn = document.getElementById('mp-prev');

      var MODE_LABELS = { list: '列表循环', single: '单曲循环', random: '随机播放' };
      var MODES = ['list', 'single', 'random'];

      var currentIndex = 0;
      var playMode = readPref('music-mode', 'random');
      if (MODES.indexOf(playMode) === -1) playMode = 'random';
      var volume = DEFAULT_VOLUME;
      var lastVolume = DEFAULT_VOLUME;
      var isSeeking = false;
      var started = false;        // 是否已经成功播放过
      var userInitiated = false;  // 用户是否点过播放（预取元数据不算）
      var failStreak = 0;         // 连续失败计数，防止无限跳歌

      /* ---------- 偏好读写 ---------- */
      function readPref(key, fallback) {
        try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
      }

      function writePref(key, value) {
        try { localStorage.setItem(key, value); } catch (e) { }
      }

      var savedVolume = parseFloat(readPref('music-volume', ''));
      if (isFinite(savedVolume) && savedVolume >= 0 && savedVolume <= 1) volume = savedVolume;
      lastVolume = volume || DEFAULT_VOLUME;

      audio.volume = volume;
      volumeRange.value = String(Math.round(volume * 100));

      /* ---------- 通用 ---------- */
      function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '00:00';
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }

      function setRangeFill(el, percent) {
        if (!el) return;
        /* 收个尾数，不然 style 里会写出一串 23.799999999999997% 的鬼东西 */
        var p = Math.round(Math.max(0, Math.min(100, percent)) * 1000) / 1000;
        el.style.setProperty('--p', p + '%');
      }

      /* ---------- 点击动效：按下处冒一圈水波 + 按钮回弹一下 ---------- */
      function addTapFx(btn) {
        if (!btn || btn.__tapFx) return btn;
        btn.__tapFx = true;
        btn.classList.add('tap-fx');

        function burst(clientX, clientY) {
          var doc = btn.ownerDocument || document;
          var rect = btn.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          var x = typeof clientX === 'number' ? clientX - rect.left : rect.width / 2;
          var y = typeof clientY === 'number' ? clientY - rect.top : rect.height / 2;
          /* 半径取点击点到四角的最远距离，波纹才能铺满整个圆钮 */
          var radius = Math.max(
            Math.hypot(x, y),
            Math.hypot(rect.width - x, y),
            Math.hypot(x, rect.height - y),
            Math.hypot(rect.width - x, rect.height - y)
          );

          var dot = doc.createElement('span');
          dot.className = 'tap-fx__ripple';
          dot.style.width = dot.style.height = (radius * 2).toFixed(1) + 'px';
          dot.style.left = (x - radius).toFixed(1) + 'px';
          dot.style.top = (y - radius).toFixed(1) + 'px';
          dot.addEventListener('animationend', function () {
            if (dot.parentNode) dot.parentNode.removeChild(dot);
          });
          btn.appendChild(dot);

          /* 连点时先清掉再重新加，动画才会重新播放 */
          btn.classList.remove('is-tapped');
          void btn.offsetWidth;
          btn.classList.add('is-tapped');
        }

        btn.addEventListener('animationend', function (e) {
          if (e.animationName === 'tap-pop') btn.classList.remove('is-tapped');
        });

        btn.addEventListener('pointerdown', function (e) {
          burst(e.clientX, e.clientY);
        });

        /* 键盘 Enter / 空格触发没有 pointerdown，补一发居中的 */
        btn.addEventListener('click', function (e) {
          if (e.detail === 0) burst();
        });

        return btn;
      }

      /* ---------- 滑轨点哪儿都能平滑滑过去，而不是一蹦到位 ----------
         原生 range 点轨道是「瞬移」的：拦掉 pointerdown 自己算目标值，
         再用 rAF 逐帧写 value（顺带 dispatch input，复用原有处理逻辑）；
         按在圆点上时放行，交回原生拖拽，键盘方向键也不受影响。 */
      var RANGE_THUMB_W = 13;   /* 与 CSS 里 ::-webkit-slider-thumb 的宽度保持一致 */

      function smoothRange(el, opts) {
        if (!el || el.__smoothRange) return el;
        el.__smoothRange = true;
        var duration = (opts && opts.duration) || 260;

        var glide = 0;
        var dragging = false;
        var pointerId = null;

        function limits() {
          var min = parseFloat(el.min);
          var max = parseFloat(el.max);
          var step = parseFloat(el.step);
          return {
            min: isFinite(min) ? min : 0,
            max: isFinite(max) && max > (isFinite(min) ? min : 0) ? max : 100,
            step: isFinite(step) && step > 0 ? step : 1
          };
        }

        function ratioOf() {
          var l = limits();
          return Math.max(0, Math.min(1, (parseFloat(el.value) - l.min) / (l.max - l.min)));
        }

        function ratioFromX(clientX) {
          var rect = el.getBoundingClientRect();
          var usable = Math.max(1, rect.width - RANGE_THUMB_W);
          return Math.max(0, Math.min(1, (clientX - rect.left - RANGE_THUMB_W / 2) / usable));
        }

        function thumbCenterX() {
          var rect = el.getBoundingClientRect();
          var usable = Math.max(1, rect.width - RANGE_THUMB_W);
          return rect.left + RANGE_THUMB_W / 2 + ratioOf() * usable;
        }

        /* 写值并派发 input，音量/进度各自的原有监听会照常接力 */
        function write(ratio) {
          var l = limits();
          var v = l.min + ratio * (l.max - l.min);
          v = Math.round(v / l.step) * l.step;
          v = Math.max(l.min, Math.min(l.max, v));
          if (Math.abs(parseFloat(el.value) - v) < 1e-6) return;
          el.value = String(v);
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function commit() {
          el.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function stopGlide() {
          if (glide) {
            cancelAnimationFrame(glide);
            glide = 0;
          }
        }

        function glideTo(target) {
          stopGlide();
          var from = ratioOf();
          if (Math.abs(target - from) < 0.002) { write(target); commit(); return; }
          if (prefersReducedMotion()) { write(target); commit(); return; }

          var t0 = 0;
          function step(now) {
            if (!t0) t0 = now;
            var k = Math.min(1, (now - t0) / duration);
            /* easeOutCubic：手一按就有反应，尾巴稳稳刹住 */
            var e = 1 - Math.pow(1 - k, 3);
            write(from + (target - from) * e);
            if (k < 1) {
              glide = requestAnimationFrame(step);
            } else {
              glide = 0;
              commit();
            }
          }
          glide = requestAnimationFrame(step);
        }

        el.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          /* 按在圆点上：别插手，原生拖拽 + input 事件已经够用了 */
          if (Math.abs(e.clientX - thumbCenterX()) <= RANGE_THUMB_W) return;

          e.preventDefault();   /* 关键：拦掉原生的一步到位 */
          stopGlide();
          dragging = true;
          pointerId = e.pointerId;
          try { el.setPointerCapture(e.pointerId); } catch (err) { }
          try { el.focus({ preventScroll: true }); } catch (err) { }
          /* 先派发一次 input：进度条的 isSeeking 得立刻置位，
             否则 timeupdate 会在缓动过程中把滑块拽回播放位置 */
          el.dispatchEvent(new Event('input', { bubbles: true }));
          glideTo(ratioFromX(e.clientX));
        });

        el.addEventListener('pointermove', function (e) {
          if (!dragging || e.pointerId !== pointerId) return;
          stopGlide();          /* 按住轨道拖动就跟手走，不再缓动 */
          write(ratioFromX(e.clientX));
        });

        function endDrag(e) {
          if (!dragging || (e && e.pointerId !== pointerId)) return;
          dragging = false;
          try { el.releasePointerCapture(pointerId); } catch (err) { }
          pointerId = null;
          /* 缓动还没跑完就松手？让它跑完自己 commit，别把中间值当成终点 */
          if (glide) return;
          commit();
        }

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);

        return el;
      }

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;

      function setLoading(on) {
        on = !!on;

          name.className = 'list__name';
          name.textContent = song.name;
          var artist = document.createElement('span');
          artist.className = 'list__artist';
          artist.textContent = song.artist;
          text.appendChild(name);
          text.appendChild(artist);

          var eq = document.createElement('span');
          eq.className = 'list__eq';
          eq.setAttribute('aria-hidden', 'true');
          eq.innerHTML = '<i></i><i></i><i></i>';

          li.appendChild(idx);
          li.appendChild(text);
          li.appendChild(eq);

          li.addEventListener('click', function () { playSong(index); });
          li.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              playSong(index);
            }
          });

          listEl.appendChild(li);
        });
        if (countEl) countEl.textContent = PLAYLIST.length + ' 首';
      }

      function highlightCurrent() {
        var items = listEl.querySelectorAll('li');
        var playing = !audio.paused;
        Array.prototype.forEach.call(items, function (li, i) {
          li.classList.toggle('is-active', i === currentIndex);
          li.classList.toggle('is-playing', i === currentIndex && playing);
          li.setAttribute('aria-current', i === currentIndex ? 'true' : 'false');
        });

      function updateModeIcon() {
        if (modeBtn) {
          modeBtn.dataset.mode = playMode;
          modeBtn.setAttribute('aria-label', '播放模式：' + MODE_LABELS[playMode] + '（点击切换）');
        }
        if (badgeEl) badgeEl.textContent = MODE_LABELS[playMode];
        syncPipMode();
      }

      /* 随机 → 列表循环 → 单曲循环，主播放器和画中画共用 */
      function cyclePlayMode() {
        var idx = MODES.indexOf(playMode);
        playMode = MODES[(idx + 1) % MODES.length];
        updateModeIcon();
        writePref('music-mode', playMode);
        if (!audio.paused) setStatus('正在播放 · ' + MODE_LABELS[playMode]);
      }

      /* ---------- 播放控制 ---------- */
      function playSong(index) {
        if (!PLAYLIST.length) return;
        index = ((index % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
        currentIndex = index;
        var song = PLAYLIST[index];

        titleEl.textContent = song.name;
        artistEl.textContent = song.artist;
        document.title = song.name + ' | 七七的音乐盒';
        updateMediaSession(song);
        syncPipMeta();
        highlightCurrent();
        userInitiated = true;
        setLoading(true);

        audio.src = API_BASE + song.id + AUDIO_EXT;
        audio.load();

        var promise = audio.play();
        if (promise && typeof promise.then === 'function') {
          promise.then(function () {
            started = true;
            syncPlayingUI(true);
          }).catch(function (err) {
            /* 快速切歌会抛 AbortError，此时新歌已经接管加载态，不要误关 */
            if (err && err.name === 'AbortError') return;
            console.warn('播放失败：', err);
            setLoading(false);
            syncPlayingUI(false);
            titleEl.textContent = song.name + '（无法播放）';
            setStatus('这首歌的音频拿不到，换一首试试');
          });
        }
      }

      function pause() {
        audio.pause();
        syncPlayingUI(false);
      }

      function togglePlay() {
        userInitiated = true;
        if (audio.paused) {
          if (!audio.src) { playSong(currentIndex); return; }
          var promise = audio.play();
          if (promise && typeof promise.then === 'function') {
            promise.then(function () {
              started = true;
              syncPlayingUI(true);
            }).catch(function (err) {
              console.warn('播放失败：', err);
              setStatus('播放被挡住了，再点一次试试');
            });
          }
        } else {
          pause();
        }
      }

      function pickRandom(except) {
        if (PLAYLIST.length <= 1) return 0;
        var next;
        do { next = Math.floor(Math.random() * PLAYLIST.length); } while (next === except);
        return next;
      }

      function nextSong() {
        if (!PLAYLIST.length) return;
        playSong(playMode === 'random' ? pickRandom(currentIndex) : currentIndex + 1);
      }

      function prevSong() {
        if (!PLAYLIST.length) return;
        playSong(playMode === 'random' ? pickRandom(currentIndex) : currentIndex - 1);
      }

      function onEnded() {
        if (playMode === 'single') {
          audio.currentTime = 0;

          if (promise && typeof promise.catch === 'function') promise.catch(function () { });
        } else {
          nextSong();
        }
      }

      function updateProgress() {
        if (isSeeking) return;
        var duration = audio.duration;
        if (isFinite(duration) && duration > 0) {
          var percent = audio.currentTime / duration;
          seekEl.value = String(Math.round(percent * 1000));
          setRangeFill(seekEl, percent * 100);
          currentTimeEl.textContent = formatTime(audio.currentTime);
        } else {
          seekEl.value = '0';
          setRangeFill(seekEl, 0);
          currentTimeEl.textContent = '00:00';
        }
        syncPipProgress();
        updatePositionState();
      }

      function updateDuration() {
        var duration = audio.duration;
        durationEl.textContent = (isFinite(duration) && duration > 0) ? formatTime(duration) : '00:00';
        if (pipUI && pipUI.dur) {
          pipUI.dur.textContent = durationEl.textContent;
        }
      }

      function bindAudioEvents() {
        audio.addEventListener('loadstart', function () { setLoading(true); });
        audio.addEventListener('waiting', function () { setLoading(true); });
        audio.addEventListener('stalled', function () { setLoading(true); });

        audio.addEventListener('loadedmetadata', function () {
          setLoading(false);
          updateDuration();
        });
        audio.addEventListener('canplay', function () { setLoading(false); });
        audio.addEventListener('playing', function () {
          setLoading(false);
          failStreak = 0;
          started = true;
          syncPlayingUI(true);
        });
        audio.addEventListener('seeked', function () { setLoading(false); });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('durationchange', updateDuration);
        audio.addEventListener('ended', onEnded);

        audio.addEventListener('play', function () { syncPlayingUI(true); });
        audio.addEventListener('pause', function () { syncPlayingUI(false); });

        audio.addEventListener('error', function () {
          console.warn('音频加载错误', audio.src);
          setLoading(false);

          /* 还没点播放时只是预取失败，别自作主张换歌 */
          if (!userInitiated) {
            setStatus('这首歌的音频好像拿不到，换一首试试');
            return;
          }

          syncPlayingUI(false);
          failStreak += 1;
          if (failStreak >= 5) {
            setStatus('连跳 5 首都拿不到音频，先检查下网络吧');

            return;

          setTimeout(function () {
            if (PLAYLIST.length > 1) nextSong();
          }, 1000);
        });

      function bindControls() {
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        seekEl.addEventListener('input', function () {
          isSeeking = true;
          var percent = Number(seekEl.value) / 1000;
          setRangeFill(seekEl, percent * 100);
          var duration = audio.duration;
          if (isFinite(duration) && duration > 0) {
            currentTimeEl.textContent = formatTime(percent * duration);
          }
        });

        seekEl.addEventListener('change', function () {
          var percent = Number(seekEl.value) / 1000;
          var duration = audio.duration;
          if (isFinite(duration) && duration > 0) {

          }

        });

        smoothRange(seekEl, { duration: 190 });

        modeBtn.addEventListener('click', cyclePlayMode);

        volumeRange.addEventListener('input', function () {
          applyVolume(Number(volumeRange.value) / 100);
        });
        smoothRange(volumeRange);

        if (muteBtn) {
          addTapFx(muteBtn);
          muteBtn.addEventListener('click', toggleMute);
        }

        /* 空格播放 / 暂停，左右键切歌 */
        document.addEventListener('keydown', function (e) {
          var tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;

          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextSong();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevSong();
          }
        });

         画中画迷你播放器

      var floatUI = null;     // 页内浮窗的节点引用
      var pipOpen = false;

      var PIP_ICON = {
        prev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5.6v12.8L9.6 12z"/></svg>',

        modeList: '<svg class="mode-icon mode-icon--list" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',

        vol: '<svg class="icon-vol" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>' +
          '<svg class="icon-vol-mute" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
        music: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'
      };

      function isDocPipSupported() {
        return !!(window.documentPictureInPicture &&
          typeof window.documentPictureInPicture.requestWindow === 'function');
      }

      /* ---------- 音量：主页与画中画共用一套读写 ---------- */
      function syncMuteIcon(btn, muted) {
        if (!btn) return;
        btn.classList.toggle('is-muted', muted);
        btn.setAttribute('aria-label', muted ? '取消静音' : '静音');
      }

      function applyVolume(v, persist) {
        if (persist !== false) stopVolumeTween();
        v = Math.max(0, Math.min(1, v));
        volume = v;
        audio.volume = v;
        if (v > 0) lastVolume = v;

        if (volumeRange) {
          volumeRange.value = String(Math.round(v * 100));
          setRangeFill(volumeRange, v * 100);
        }
        syncMuteIcon(muteBtn, v <= 0);

        if (pipUI) {
          if (pipUI.vol) {
            pipUI.vol.value = String(Math.round(v * 100));
            setRangeFill(pipUI.vol, v * 100);
          }
          syncMuteIcon(pipUI.muteBtn, v <= 0);
        }

        if (persist !== false) writePref('music-volume', String(v));
      }

      /* ---------- 音量渐变：点静音键时滑块平滑滑到 0 / 滑回来 ---------- */
      var volTween = 0;
      var volGuard = 0;

      function stopVolumeTween() {
        if (volTween) {
          cancelAnimationFrame(volTween);
          volTween = 0;
        }
        if (volGuard) {
          clearTimeout(volGuard);
          volGuard = 0;
        }
      }

      function prefersReducedMotion() {
        return !!(window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }

      function fadeVolumeTo(target, ms) {
        target = Math.max(0, Math.min(1, target));
        stopVolumeTween();

        var from = audio.volume;
        /* 渐隐到 0 的每一帧都会把 lastVolume 刷成中间值，先备份，收尾再还回去 */
        var restore = lastVolume;
        var duration = prefersReducedMotion() ? 0 : (ms || 320);

        if (!duration || Math.abs(from - target) < 0.01) {
          applyVolume(target);
          if (target <= 0) lastVolume = restore || DEFAULT_VOLUME;
          return;
        }

        var t0 = 0;
        var done = false;

        function finish() {
          if (done) return;
          done = true;
          stopVolumeTween();
          applyVolume(target);
          /* 中途每一帧都在改 lastVolume，收尾把用户原来的音量还回去 */
          if (target <= 0) lastVolume = restore || DEFAULT_VOLUME;
        }

        function step(now) {
          if (!t0) t0 = now;
          var k = Math.min(1, (now - t0) / duration);
          /* easeInOutQuad：起手和收尾都软，中间快，比线性自然 */
          var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          applyVolume(from + (target - from) * e, false);
          if (k < 1) {
            volTween = requestAnimationFrame(step);
          } else {
            volTween = 0;
            finish();
          }
        }

        volTween = requestAnimationFrame(step);
        /* 后台标签页 / 画中画里 rAF 可能被挂起，兜底把动画直接收尾，
           不然音量会卡在中间某个诡异的数值上 */
        volGuard = setTimeout(finish, duration + 140);
      }

        fadeVolumeTo(audio.volume > 0 ? 0 : (lastVolume || DEFAULT_VOLUME));

      /* 迷你播放器 DOM（Document PiP 与页内浮窗共用一套结构） */

          PIP_ICON.modeList + PIP_ICON.modeSingle + PIP_ICON.modeRandom + '</button>' +

            '<button class="pipui__btn pipui__btn--close" type="button" data-act="close" aria-label="关闭画中画">' + PIP_ICON.close + '</button>') +
          '</div>' +

        root.querySelector('[data-act="next"]').addEventListener('click', nextSong);

        /* 播放模式：随机 → 列表循环 → 单曲循环，和主播放器共用一套状态 */
        if (refs.modeBtn) {
          refs.modeBtn.dataset.mode = playMode;
          refs.modeBtn.addEventListener('click', cyclePlayMode);

        var closeBtn = root.querySelector('[data-act="close"]');

        /* 迷你列表 */
        PLAYLIST.forEach(function (song, index) {
          var li = doc.createElement('li');
          var btn = doc.createElement('button');

          btn.className = 'pipui__item';
          btn.dataset.index = String(index);

            '<span class="pipui__item-idx">' + String(index + 1).padStart(2, '0') + '</span>' +
            '<span class="pipui__item-name"></span>' +

      }

      function syncPipMeta() {
        if (!pipUI) return;
        var song = PLAYLIST[currentIndex] || { name: '未播放', artist: '—' };
        pipUI.title.textContent = song.name;
        pipUI.title.title = song.name;
        pipUI.artist.textContent = song.artist;
        pipUI.artist.title = song.artist;

      function syncPipPlaying(on) {

      function syncPipVolume() {
        if (!pipUI) return;

          setRangeFill(pipUI.vol, audio.volume * 100);
        }

      }

      function syncPipMode() {
        if (!pipUI || !pipUI.modeBtn) return;
        var label = '播放模式：' + MODE_LABELS[playMode];
        pipUI.modeBtn.dataset.mode = playMode;
        pipUI.modeBtn.setAttribute('aria-label', label + '（点击切换）');

      }

      function syncPipList() {
        if (!pipUI || !pipUI.list) return;

        var items = pipUI.list.querySelectorAll('.pipui__item');
        Array.prototype.forEach.call(items, function (el, i) {

        });
      }

      /* 画中画窗口本身很矮（190px），展开列表时顺手把它拉高；
         浏览器不允许 resizeTo 就交给 CSS 自己压缩（列表内部滚动） */
      var PIP_WIN_W = 340;
      var PIP_WIN_H = 190;
      var PIP_WIN_H_LIST = 400;

      function resizePipWindow(open, refs) {
        if (!pipWin || !refs || refs.root.ownerDocument === document) return;
        if (typeof pipWin.resizeTo !== 'function') return;
        try { pipWin.resizeTo(PIP_WIN_W, open ? PIP_WIN_H_LIST : PIP_WIN_H); } catch (e) { }
      }

      /* 展开 / 收起迷你列表 */
      function togglePipList(refs) {
        if (!refs) return;
        var open = !refs.root.classList.contains('is-list');
        var reduce = prefersReducedMotion();

        refs.listBtn.classList.toggle('is-active', open);
        refs.listBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
        refs.listBtn.setAttribute('aria-label', open ? '收起播放列表' : '播放列表');

        if (open) {
          resizePipWindow(true, refs);
          refs.root.classList.add('is-list');
          syncPipList();
          var active = refs.list.querySelector('.pipui__item.is-active');
          if (active && active.scrollIntoView) {
            try { active.scrollIntoView({ block: 'nearest' }); } catch (e) { }
          }
          if (!reduce) animatePipListIn(refs);
        } else if (reduce) {
          refs.root.classList.remove('is-list');
          resizePipWindow(false, refs);
        } else {
          /* 先让列表淡出，再真的收起来，不然一按就“消失”很生硬 */
          animatePipListOut(refs, function () {
            refs.root.classList.remove('is-list');
            resizePipWindow(false, refs);
          });
        }
      }

      /* 展开：面板轻轻放大 + 列表整体上浮 + 列表项错峰滑入 */
      function animatePipListIn(refs) {
        var list = refs.list;
        if (!list || typeof list.animate !== 'function') return;

        list.animate(
          [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
          { duration: 240, easing: 'cubic-bezier(.22,.61,.36,1)' }
        );

        var items = list.querySelectorAll('.pipui__item');
        Array.prototype.forEach.call(items, function (el, i) {
          if (i > 10) return;   /* 只错峰前 11 条，再多就排到明年了 */
          el.animate(
            [{ opacity: 0, transform: 'translateX(-8px)' }, { opacity: 1, transform: 'none' }],
            {
              duration: 240,
              delay: 40 + i * 18,
              easing: 'cubic-bezier(.22,.61,.36,1)',
              fill: 'backwards'   /* 延迟期间用首帧，避免先闪一下再滑入 */
            }
          );
        });

        if (typeof refs.root.animate === 'function') {
          refs.root.animate(
            [{ transform: 'scale(.972)' }, { transform: 'scale(1)' }],
            { duration: 280, easing: 'cubic-bezier(.22,.61,.36,1)' }
          );
        }
      }

      /* 收起：列表下沉淡出，结束后再摘掉 is-list */
      function animatePipListOut(refs, done) {
        var list = refs.list;
        if (!list || typeof list.animate !== 'function') { done(); return; }

        var anim = list.animate(
          [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(8px)' }],
          { duration: 150, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }
        );

        var finished = false;
        function end() {
          if (finished) return;
          finished = true;
          if (anim.cancel) anim.cancel();   /* 清掉 forwards，别让列表残影留在关闭态 */
          done();
        }
        anim.onfinish = end;
        /* 画中画窗口被切到后台时 onfinish 不一定来，兜个底 */
        setTimeout(end, 260);
      }

      function syncPipProgress() {
        if (!pipUI) return;
        var d = audio.duration;
        if (isFinite(d) && d > 0) {
          var percent = audio.currentTime / d;
          pipUI.seek.value = String(Math.round(percent * 1000));
          setRangeFill(pipUI.seek, percent * 100);
          pipUI.cur.textContent = formatTime(audio.currentTime);
          pipUI.dur.textContent = formatTime(d);
        } else {
          pipUI.seek.value = '0';
          setRangeFill(pipUI.seek, 0);
          pipUI.cur.textContent = '00:00';
          pipUI.dur.textContent = '00:00';
        }
      }

      function syncPipButton() {
        if (!pipBtn) return;
        pipBtn.classList.toggle('is-active', pipOpen);
        pipBtn.setAttribute('aria-pressed', pipOpen ? 'true' : 'false');
        pipBtn.setAttribute('aria-label', pipOpen ? '关闭画中画' : '画中画');
        pipBtn.setAttribute('title', pipOpen ? '关闭画中画' : '画中画（迷你播放器）');
      }

      function refreshPipUI() {
        syncPipMeta();
        syncPipPlaying(!audio.paused);
        syncPipProgress();
        syncPipVolume();
        syncPipMode();
        syncPipList();
        syncPipButton();
      }

      function openPip() {
        if (pipOpen) { closePip(); return; }
        if (isDocPipSupported()) {
          openDocPip();
        } else {
          openFloatPip();
        }
      }

      function openDocPip() {
        var req = window.documentPictureInPicture.requestWindow({ width: PIP_WIN_W, height: PIP_WIN_H });
        if (!req || typeof req.then !== 'function') return;

        req.then(function (win) {
          /* 把页面样式整份搬进画中画窗口，省得再维护第二套 CSS */
          var styles = document.querySelectorAll('style');
          Array.prototype.forEach.call(styles, function (node) {
            win.document.head.appendChild(node.cloneNode(true));
          });

          var pipRoot = win.document.documentElement;
          pipRoot.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') || 'light');
          /* 字体等内联变量也一并带过去 */
          pipRoot.style.cssText = document.documentElement.style.cssText;
          win.document.body.className = 'pip-body';

          pipWin = win;
          pipUI = buildPipUI(win.document, true);
          win.document.body.appendChild(pipUI.root);
          pipOpen = true;
          refreshPipUI();

          win.addEventListener('pagehide', function () {
            /* 用户点了画中画窗口自带的关闭按钮 */
            if (pipWin === win) {
              pipWin = null;
              pipUI = null;
              pipOpen = false;
              syncPipButton();
            }
          });
        }).catch(function (err) {
          /* 用户手势丢失、权限被拒等，降级成页内浮窗 */
          console.warn('画中画窗口打开失败，改用页内浮窗：', err);
          openFloatPip();
        });
      }

      function openFloatPip() {
        if (!floatEl) {
          floatEl = document.createElement('div');
          floatEl.className = 'pip-float';
          document.body.appendChild(floatEl);

          floatUI = buildPipUI(document, false);
          floatEl.appendChild(floatUI.root);
          makeDraggable(floatEl);
        }
        floatEl.hidden = false;
        pipUI = floatUI;
        pipOpen = true;
        refreshPipUI();
      }

      function closePip() {
        pipOpen = false;
        if (pipWin) {
          try { pipWin.close(); } catch (e) { }
          pipWin = null;
          pipUI = null;
        }
        if (floatEl) {
          floatEl.hidden = true;
          pipUI = null;
        }
        syncPipButton();
      }

      /* 页内浮窗拖拽：按住空白处移动，越界时贴边停下 */
      function makeDraggable(el) {
        var dragging = false;
        var startX = 0, startY = 0, origX = 0, origY = 0;

        el.addEventListener('pointerdown', function (e) {
          if (e.target.closest && e.target.closest('button, input')) return;
          var rect = el.getBoundingClientRect();
          el.style.left = rect.left + 'px';
          el.style.top = rect.top + 'px';
          el.style.right = 'auto';
          el.style.bottom = 'auto';

          dragging = true;
          startX = e.clientX;
          startY = e.clientY;
          origX = rect.left;
          origY = rect.top;
          el.classList.add('is-dragging');
          try { el.setPointerCapture(e.pointerId); } catch (err) { }
          e.preventDefault();
        });

        el.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          var maxX = Math.max(8, window.innerWidth - el.offsetWidth - 8);
          var maxY = Math.max(8, window.innerHeight - el.offsetHeight - 8);
          var nx = Math.min(Math.max(8, origX + (e.clientX - startX)), maxX);
          var ny = Math.min(Math.max(8, origY + (e.clientY - startY)), maxY);
          el.style.left = nx + 'px';
          el.style.top = ny + 'px';
        });

        function endDrag(e) {
          if (!dragging) return;
          dragging = false;
          el.classList.remove('is-dragging');
          try { el.releasePointerCapture(e.pointerId); } catch (err) { }
        }

        el.addEventListener('pointerup', endDrag);
        el.addEventListener('pointercancel', endDrag);
      }

      /* ---------- 系统媒体控制（锁屏 / 耳机按键）---------- */
      function updatePositionState() {
        if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
        var d = audio.duration;
        if (!isFinite(d) || d <= 0) return;
        try {
          navigator.mediaSession.setPositionState({
            duration: d,
            position: Math.min(audio.currentTime, d),
            playbackRate: audio.playbackRate || 1
          });
        } catch (e) { }
      }

      function initMediaSession() {
        if (!('mediaSession' in navigator)) return;
        try {
          navigator.mediaSession.setActionHandler('previoustrack', prevSong);
          navigator.mediaSession.setActionHandler('nexttrack', nextSong);
        } catch (e) { }
      }

      /* ---------- 主题切换：与首页同一套过渡 + 同一 localStorage 键 ---------- */
      function initTheme() {
        var btn = document.getElementById('btn-theme');
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');

        function isDark() {
          return root.getAttribute('data-theme') === 'dark';
        }

        function sync() {
          var dark = isDark();
          if (meta) meta.setAttribute('content', dark ? '#12161F' : '#21a5e3');
          if (!btn) return;
          var label = dark ? '切换到浅色模式' : '切换到深色模式';
          btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', label);
        }

        function apply(theme, persist) {
          root.setAttribute('data-theme', theme);
          /* 画中画窗口是独立文档，得手动同步主题 */
          if (pipWin && pipWin.document) {
            pipWin.document.documentElement.setAttribute('data-theme', theme);
          }
          if (persist) {
            try { localStorage.setItem('theme', theme); } catch (e) { }
          }
          sync();
        }

        function prefersReducedMotion() {
          return window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        sync();
        if (!btn) return;

        btn.addEventListener('click', function () {
          var theme = isDark() ? 'light' : 'dark';

          if (prefersReducedMotion()) {
            apply(theme, true);
            return;
          }

          if (typeof document.startViewTransition === 'function') {
            /* 主力方案：新主题从模糊中淡入，覆盖旧主题 */
            document.startViewTransition(function () {
              apply(theme, true);
            });
          } else {
            /* 兜底方案：旧底色覆盖 → 淡出 → 露出新主题 */
            var overlay = document.createElement('div');
            overlay.className = 'theme-dissolve';
            overlay.style.background = getComputedStyle(document.body).backgroundColor;
            document.body.appendChild(overlay);

            void overlay.offsetWidth;     // 强制回流，确保起始状态生效

            apply(theme, true);           // 现在有层挡着，用户看不到瞬切

            requestAnimationFrame(function () {
              overlay.style.opacity = '0';
            });

            setTimeout(function () {
              if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            }, 550);
          }
        });

        /* 用户没手动选过时，跟随系统偏好变化（与首页一致） */
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        if (mq && mq.addEventListener) {
          mq.addEventListener('change', function (e) {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (err) { }
            if (saved) return;
            apply(e.matches ? 'dark' : 'light', false);
          });
        }
      }

      /* ---------- 字体切换：七七柔和圆体 ⇄ 系统字体（沿用首页 home-font） ---------- */
      function initFont() {
        var btn = document.getElementById('btn-font');
        if (!btn) return;

        var root = document.documentElement;
        var ROUND = '"Blog-WenYuan", "Blog-WenYuan-Fallback", var(--font-fallback)';
        var SYSTEM = 'var(--font-fallback)';

        function isSystem() {
          try {
            return localStorage.getItem('home-font') === 'system';
          } catch (e) {
            return false;
          }
        }

        function updateUI(system) {
          var name = system ? '系统字体' : '七七柔和圆体';
          var label = '切换字体（当前：' + name + '）';
          btn.setAttribute('aria-pressed', system ? 'false' : 'true');
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', label);
        }

        updateUI(isSystem());

        btn.addEventListener('click', function () {
          var toSystem = !isSystem();
          root.style.setProperty('--font-sans', toSystem ? SYSTEM : ROUND);
          try {
            localStorage.setItem('home-font', toSystem ? 'system' : 'round');
          } catch (e) { }
          updateUI(toSystem);
        });
      }

      /* ---------- 初始化 ---------- */
      function init() {
        renderPlaylist();
        updateModeIcon();
        updateDuration();
        setRangeFill(seekEl, 0);
        setRangeFill(volumeRange, volume * 100);
        syncMuteIcon(muteBtn, volume <= 0);
        bindAudioEvents();
        bindControls();
        initTheme();
        initFont();
        initMediaSession();
        if (pipBtn) pipBtn.addEventListener('click', openPip);

        if (!PLAYLIST.length) {
          setStatus('歌单是空的');
          return;
        }

        /* 只预取第一首的元数据，不自动播放（浏览器会拦） */
        var first = PLAYLIST[0];
        currentIndex = 0;
        titleEl.textContent = first.name;
        artistEl.textContent = first.artist;
        highlightCurrent();
        audio.src = API_BASE + first.id + AUDIO_EXT;
        audio.load();
        setStatus('点一下播放键，音乐就来了');
      }

      /* 支持从首页带参进入，例如 music.html?autoplay=1 */
      function maybeAutoplay() {
        try {
          var params = new URLSearchParams(location.search);
          if (params.get('autoplay') !== '1') return;
        } catch (e) { return; }
        playSong(0);
      }

      init();
      maybeAutoplay();
    })();
  </script>
</body>

</html>
